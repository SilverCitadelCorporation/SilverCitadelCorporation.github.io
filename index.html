<!DOCTYPE html>

<head>

    <title>Welcome to the Silver Citadel</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <script>
        async function sendReceipt() {
            // REPLACE THIS WITH YOUR ACTUAL WEBHOOK URL
            const webhookURL = "https://discord.com/api/webhooks/your_id_here"; 
            
            const message = {
                content: "🛡️ **New Receipt from Silver Citadel**",
                embeds: [{
                    title: "Transaction Successful",
                    description: "A customer has interacted with the Citadel Shop.",
                    fields: [
                        { name: "Item", value: "Knightly Custom Bot", inline: true },
                        { name: "Status", value: "Paid", inline: true }
                    ],
                    color: 13938487 // Gold color (#d4af37)
                }]
            };

            try {
                const response = await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(message)
                });

                if (response.ok) {
                    alert("Receipt sent to the Discord Kingdom!");
                } else {
                    alert("Failed to send receipt. Check your Webhook URL.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("An error occurred.");
            }
        }
    </script>
