<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Silver Citadel Corporation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background-color: #0f0f1a;
    color: #d4af37;
    font-family: 'Cinzel', serif;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    background-color: #1c1330;
    border-bottom: 3px solid #d4af37;
}

.logo {
    height: 70px;
}

/* HERO */
.hero {
    height: 90vh;
    background:
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url("./background.png");
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.hero h1 {
    font-size: 55px;
    margin: 0;
}

.hero p {
    font-size: 22px;
}

.button {
    margin-top: 20px;
    background: #d4af37;
    color: #1c1330;
    padding: 14px 30px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
}

section {
    padding: 80px 20px;
    text-align: center;
    background-color: #141424;
}

.gallery img {
    width: 250px;
    margin: 20px;
    border-radius: 10px;
}
</style>
</head>

<body>

<header>
    <img src="./logo.png" class="logo" alt="Logo">
</header>

<section class="hero">
    <h1>Silver Citadel Corporation</h1>
    <p>Forging Digital Power with a Knightly Edge</p>
    <a href="#" class="button">Enter the Kingdom</a>
</section>

<section>
    <h2>Our Creation</h2>
    <p>Elite Discord bots built for kingdoms of all sizes.</p>
</section>

<section class="gallery">
    <h2>The Arsenal</h2>
    <img src="./bot.png" alt="Bot Image">
</section>

</body>
</html>
