<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silver Citadel Corporation</title>
<link rel="icon" type="image/png" href="logo.png">

<style>
body {
    margin:0;
    font-family:'Garamond', serif;
    background: url('background.png') no-repeat center center fixed;
    background-size: cover;
    color:#d4af37;
}

.overlay {
    background: rgba(0,0,0,0.75);
    min-height:100vh;
    padding:120px 30px 30px 30px;
    text-align:center;
}

nav {
    position: fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:10px 30px;
}

nav a {
    margin-left:20px;
    color:#d4af37;
    text-decoration:none;
    font-weight:bold;
}

.button {
    background:#4a235a;
    color:#d4af37;
    padding:15px 30px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.button:hover {
    background:#d4af37;
    color:#4a235a;
}
</style>
</head>

<body>

<nav>
    <div>
        <a href="#" onclick="secretClick(event)">
            <img src="logo.png" style="width:50px; cursor:pointer;">
        </a>
        <span style="font-size:1.5rem; font-weight:bold;">Silver Citadel</span>
    </div>

    <div>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

<div class="overlay">
    <h1>Welcome to Silver Citadel</h1>
    <p>Explore our custom bots, digital creations, and medieval adventures.</p>
    <br>
    <a href="shop.html"><button class="button">Enter Shop</button></a>
</div>

<script>
let clickCount = 0;

function secretClick(event){
    event.preventDefault();
    clickCount++;

    if(clickCount >= 3){
        window.location.href = "supercalc.html";
    }
}
</script>

</body>
</html>
