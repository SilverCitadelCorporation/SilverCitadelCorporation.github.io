<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Silver Citadel</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        body {
            background: #1a1a1a url('banner.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #d4af37;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
        }
        .overlay {
            background: rgba(0, 0, 0, 0.8);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(74, 35, 90, 0.9);
            border-bottom: 2px solid #d4af37;
        }
        .logo-img { height: 60px; }
        nav a {
            color: #d4af37;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .hero {
            text-align: center;
            padding: 100px 20px;
            flex-grow: 1;
        }
        .hero h1 { font-size: 3.5rem; margin-bottom: 10px; text-shadow: 2px 2px 10px #000; }
        .hero p { font-size: 1.2rem; color: #fff; margin-bottom: 30px; }
        .cta-button {
            background: #d4af37;
            color: #4a235a;
            padding: 15px 40px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            font-size: 1.2rem;
            transition: 0.3s;
        }
        .cta-button:hover { background: #fff; transform: scale(1.05); }
        footer {
            text-align: center;
            padding: 20px;
            background: #4a235a;
            font-size: 0.9rem;
            color: #aaa;
        }
        @media (max-width: 600px) {
            header { flex-direction: column; gap: 15px; }
            .hero h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>
    <div class="overlay">
        <header>
            <img src="logo.png" alt="Silver Citadel Logo" class="logo-img">
            <nav>
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="https://discord.gg/silvercitadel" target="_blank">Discord</a>
            </nav>
        </header>

        <section class="hero">
            <h1>Silver Citadel Corporation</h1>
            <p>Custom Discord Bots & Knightly Digital Solutions</p>
            <a href="shop.html" class="cta-button">Enter the Armory (Shop)</a>
        </section>

        <footer>
            &copy; 2026 Silver Citadel Corporation. All Rights Reserved.
        </footer>
    </div>
</body>
</html>
