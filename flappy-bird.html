<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>
<style>
body { margin:0; background:#70c5ce; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; }
canvas { display:block; background:#70c5ce; }
.screen { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); color:white; display:flex; flex-direction:column; justify-content:center; align-items:center; font-size:32px; }
button { padding:12px 25px; margin-top:20px; font-size:20px; cursor:pointer; border:none; border-radius:6px; }
#score { position:absolute; top:20px; left:50%; transform:translateX(-50%); font-size:32px; color:white; text-shadow:2px 2px #000; }
</style>
</head>
<body>

<canvas id="game" width="400" height="600"></canvas>

<div id="startScreen" class="screen">
  Flappy Bird
  <button onclick="startGame()">Start</button>
</div>

<div id="gameOverScreen" class="screen" style="display:none;">
  <div id="finalScore">Score: 0</div>
  <button onclick="restartGame()">Restart</button>
</div>

<div id="score">0</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let running = false;
let frame = 0;
let score = 0;

const bird = {
  x: 80,
  y: 300,
  width: 34,
  height: 24,
  dy: 0
};

const gravity = 0.5;
const jump = -8;

const pipes = [];
const pipeWidth = 60;
const pipeGap = 150;
const groundHeight = 100;
let groundX = 0;

// Start / restart
function startGame() {
  document.getElementById('startScreen').style.display='none';
  resetGame();
  running=true;
  loop();
}

function restartGame() {
  document.getElementById('gameOverScreen').style.display='none';
  resetGame();
  running=true;
  loop();
}

function resetGame() {
  bird.y = 300; bird.dy = 0;
  pipes.length = 0;
  frame = 0;
  score = 0;
  document.getElementById('score').innerText = score;
}

// Input
function flap(){ bird.dy = jump; }
document.addEventListener('keydown', e=>{ if(e.code==='Space') flap(); });
canvas.addEventListener('click', flap);

// Draw functions
function drawBird() {
  ctx.fillStyle='yellow';
  ctx.save();
  ctx.translate(bird.x+bird.width/2,bird.y+bird.height/2);
  ctx.rotate(Math.min(bird.dy/10,0.5));
  ctx.fillRect(-bird.width/2,-bird.height/2,bird.width,bird.height);
  ctx.restore();
}

function drawPipe(x, y, w, h) {
  ctx.fillStyle="#228B22";
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle="#32CD32";
  ctx.fillRect(x+5, y+5, w-10, h-10);
}

function drawGround() {
  ctx.fillStyle="#DEB887";
  ctx.fillRect(groundX, canvas.height-groundHeight, canvas.width, groundHeight);
  ctx.fillRect(groundX+canvas.width, canvas.height-groundHeight, canvas.width, groundHeight);
}

// Main loop
function loop(){
  if(!running) return;

  bird.dy += gravity;
  bird.y += bird.dy;

  if(bird.y + bird.height > canvas.height - groundHeight || bird.y < 0){
    endGame();
    return;
  }

  if(frame%90===0){
    const topHeight = Math.floor(Math.random()*(canvas.height - pipeGap - groundHeight - 50)) + 50;
    const bottomY = topHeight + pipeGap;
    const bottomHeight = canvas.height - groundHeight - bottomY;
    pipes.push({x:canvas.width, y:0, width:pipeWidth, height:topHeight});
    pipes.push({x:canvas.width, y:bottomY, width:pipeWidth, height:bottomHeight});
  }

  for(let i=0;i<pipes.length;i++){
    pipes[i].x -= 2;

    if(
      bird.x < pipes[i].x + pipeWidth &&
      bird.x + bird.width > pipes[i].x &&
      bird.y < pipes[i].y + pipes[i].height &&
      bird.y + bird.height > pipes[i].y
    ){
      endGame();
      return;
    }

    if(i%2===0 && pipes[i].x + pipeWidth === bird.x) score++;
  }

  while(pipes.length && pipes[0].x + pipeWidth < 0) pipes.shift();

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#70c5ce";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  pipes.forEach(p => drawPipe(p.x,p.y,p.width,p.height));
  drawBird();

  groundX -= 2;
  if(groundX <= -canvas.width) groundX=0;
  drawGround();

  document.getElementById('score').innerText = score;
  frame++;
  requestAnimationFrame(loop);
}

function endGame(){
  running=false;
  document.getElementById('gameOverScreen').style.display='flex';
  document.getElementById('finalScore').innerText = "Score: " + score;
}
</script>

</body>
</html>
