<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>
<style>
body { margin:0; background:#70c5ce; display:flex; justify-content:center; align-items:center; height:100vh; font-family:Arial; }
canvas { background:#70c5ce; display:block; }
#score { position:absolute; top:20px; left:50%; transform:translateX(-50%); font-size:32px; color:white; text-shadow: 2px 2px #000; }
</style>
</head>
<body>

<div id="score">0</div>
<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const bird = { x: 80, y: 300, width: 34, height: 24, dy: 0 };
const gravity = 0.5;
const jump = -8;

const pipes = [];
const pipeWidth = 60;
const pipeGap = 150;
let frame = 0;
let score = 0;
let gameOver = false;

// Handle input
function flap() {
  bird.dy = jump;
}
document.addEventListener('keydown', e => { if(e.code==='Space') flap(); });
canvas.addEventListener('click', flap);

// Game Loop
function loop() {
  if(gameOver) return;

  // Update
  bird.dy += gravity;
  bird.y += bird.dy;

  if(bird.y + bird.height > canvas.height || bird.y < 0){
    gameOver = true;
    return;
  }

  // Pipes
  if(frame % 90 === 0){
    let topHeight = Math.random() * (canvas.height - pipeGap - 100) + 50;
    pipes.push({ x: canvas.width, y: 0, width: pipeWidth, height: topHeight });
    pipes.push({ x: canvas.width, y: topHeight + pipeGap, width: pipeWidth, height: canvas.height - topHeight - pipeGap });
  }
  for(let i=0; i<pipes.length; i++){
    pipes[i].x -= 2;

    // Collision
    if(bird.x < pipes[i].x + pipeWidth &&
       bird.x + bird.width > pipes[i].x &&
       bird.y < pipes[i].y + pipes[i].height &&
       bird.y + bird.height > pipes[i].y){
      gameOver = true;
      return;
    }

    // Score
    if(pipes[i].x + pipeWidth === bird.x) score++;
  }

  // Remove offscreen pipes
  while(pipes.length && pipes[0].x + pipeWidth < 0) pipes.shift();

  // Draw
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Pipes
  ctx.fillStyle = "#228B22";
  pipes.forEach(p => ctx.fillRect(p.x, p.y, p.width, p.height));

  // Bird
  ctx.fillStyle = "#FFD700";
  ctx.fillRect(bird.x, bird.y, bird.width, bird.height);

  // Score
  document.getElementById('score').innerText = score;

  frame++;
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
