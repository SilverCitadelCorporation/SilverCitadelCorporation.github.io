<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Calculator Arcade</title>
<link rel="icon" type="image/png" href="logo.png">

<style>
body { margin:0; font-family:'Arial', sans-serif; background:#e0e0e0; }
header { background:#4a235a; color:#d4af37; text-align:center; padding:15px; font-size:24px; font-weight:bold; }
#arcade { width:90%; max-width:900px; margin:20px auto; }
#tabs { display:flex; justify-content:center; margin-bottom:10px; flex-wrap:wrap; }
#tabs button { margin:5px; flex:1 1 100px; background:#4a235a; color:#d4af37; border:none; border-radius:8px; cursor:pointer; padding:10px; }
#tabs button.active { background:#d4af37; color:#4a235a; }
.game { display:none; text-align:center; }
canvas { border:1px solid #000; display:block; margin:auto; background:#111; }
</style>
</head>
<body>

<header>Super Calculator Arcade</header>

<div id="arcade">

<div id="tabs">
<button class="active" onclick="showGame('geometry', this)">Geometry Dash</button>
</div>

<div id="geometry" class="game">
<h3>Geometry Dash</h3>
<canvas id="geomCanvas" width="500" height="300"></canvas>
</div>

</div>

<script>
function showGame(id, btn){
document.querySelectorAll('.game').forEach(g=>g.style.display='none');
document.getElementById(id).style.display='block';
document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
}
showGame('geometry', document.querySelector('#tabs button'));

let canvas=document.getElementById("geomCanvas");
let ctx=canvas.getContext("2d");

let gravity=0.8;
let jumpPower=-13;
let speed=4;
let ground=280;

let player;
let obstacles;
let frame=0;

function resetGame(){
player={x:80,y:ground,width:20,height:20,vy:0};
obstacles=[];
frame=0;
}
resetGame();

document.addEventListener("keydown",e=>{
if(e.code==="Space" && player.y>=ground){
player.vy=jumpPower;
}
});

function spawnObstacle(){
let height=Math.random()*40+20;
obstacles.push({
x:500,
y:ground+(20-height),
width:20,
height:height
});
}

function update(){
frame++;

if(frame%90===0){
spawnObstacle();
}

player.vy+=gravity;
player.y+=player.vy;

if(player.y>ground){
player.y=ground;
player.vy=0;
}

for(let i=0;i<obstacles.length;i++){
let obs=obstacles[i];
obs.x-=speed;

if(
player.x < obs.x+obs.width &&
player.x+player.width > obs.x &&
player.y < obs.y+obs.height &&
player.y+player.height > obs.y
){
resetGame();
}
}

obstacles=obstacles.filter(o=>o.x>-50);
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="yellow";
ctx.fillRect(player.x,player.y,player.width,player.height);

ctx.fillStyle="red";
for(let obs of obstacles){
ctx.fillRect(obs.x,obs.y,obs.width,obs.height);
}

ctx.fillStyle="white";
ctx.fillRect(0,ground+20,500,5);
}

function gameLoop(){
update();
draw();
requestAnimationFrame(gameLoop);
}
gameLoop();
</script>

</body>
</html>
