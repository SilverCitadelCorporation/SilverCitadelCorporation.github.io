<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Calculator</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
body {
    margin:0;
    font-family:'Arial', sans-serif;
    background:#f0f0f0;
}
header {
    background:#4a235a;
    color:#d4af37;
    text-align:center;
    padding:15px;
    font-size:24px;
    font-weight:bold;
}
#calculator {
    max-width:320px;
    margin:50px auto;
    background:#fff;
    padding:20px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}
#display {
    width:100%;
    height:60px;
    font-size:28px;
    text-align:right;
    padding:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
}
button.calc-btn {
    width:22%;
    margin:1%;
    height:50px;
    font-size:20px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    background:#4a235a;
    color:#d4af37;
}
button.calc-btn:hover {
    background:#d4af37;
    color:#4a235a;
}
#arcade {
    display:none;
    padding:20px;
    max-width:900px;
    margin:auto;
}
#arcade h2 { text-align:center; color:#4a235a; margin-bottom:20px; }
.games-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:15px;
}
.game-tile {
    background:#4a235a;
    color:#d4af37;
    padding:15px;
    text-align:center;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}
.game-tile:hover {
    background:#d4af37;
    color:#4a235a;
}
.game-frame {
    width:100%;
    height:500px;
    border:none;
    display:none;
    margin-top:20px;
    border-radius:10px;
}
</style>
</head>
<body>

<header>Super Calculator</header>

<div id="calculator">
    <input type="text" id="display" readonly>
    <div>
        <button class="calc-btn" onclick="press('7')">7</button>
        <button class="calc-btn" onclick="press('8')">8</button>
        <button class="calc-btn" onclick="press('9')">9</button>
        <button class="calc-btn" onclick="clearDisplay()">C</button>

        <button class="calc-btn" onclick="press('4')">4</button>
        <button class="calc-btn" onclick="press('5')">5</button>
        <button class="calc-btn" onclick="press('6')">6</button>
        <button class="calc-btn" onclick="press('/')">/</button>

        <button class="calc-btn" onclick="press('1')">1</button>
        <button class="calc-btn" onclick="press('2')">2</button>
        <button class="calc-btn" onclick="press('3')">3</button>
        <button class="calc-btn" onclick="press('*')">*</button>

        <button class="calc-btn" onclick="press('0')">0</button>
        <button class="calc-btn" onclick="press('.')">.</button>
        <button class="calc-btn" onclick="unlock()">=</button>
        <button class="calc-btn" onclick="press('-')">-</button>

        <button class="calc-btn" onclick="press('+')">+</button>
    </div>
</div>

<div id="arcade">
    <h2>Super Calculator Arcade</h2>
    <div class="games-grid">
        <div class="game-tile" onclick="openGame('https://scratch.mit.edu/projects/633341882/embed')">Geometry Dash</div>
        <div class="game-tile" onclick="openGame('https://scratch.mit.edu/projects/623984167/embed')">Eagle Craft</div>
        <div class="game-tile" onclick="openGame('https://scratch.mit.edu/projects/617382715/embed')">Eagle Obby</div>
        <div class="game-tile" onclick="openGame('https://scratch.mit.edu/projects/618273145/embed')">Clicker Game</div>
        <div class="game-tile" onclick="openGame('https://scratch.mit.edu/projects/619283712/embed')">Dodge Game</div>
    </div>
    <iframe id="gameFrame" class="game-frame"></iframe>
</div>

<script>
let input = "";
let display = document.getElementById("display");

function press(val) {
    input += val;
    display.value = input;
}

function clearDisplay() {
    input = "";
    display.value = "";
}

function unlock() {
    // The secret code to access arcade
    if(input === "0000") {
        document.getElementById("calculator").style.display = "none";
        document.getElementById("arcade").style.display = "block";
        input = "";
        display.value = "";
    } else {
        try {
            input = eval(input).toString();
            display.value = input;
        } catch {
            display.value = "Error";
            input = "";
        }
    }
}

function openGame(url) {
    let frame = document.getElementById("gameFrame");
    frame.src = url;
    frame.style.display = "block";
    frame.scrollIntoView({behavior:'smooth'});
}
</script>

</body>
</html>
