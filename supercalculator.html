<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Resource Hub</title>

<style>

body{
margin:0;
font-family:Arial;
background:#e0e0e0;
}

header{
background:#2c3e50;
color:white;
padding:15px;
text-align:center;
font-size:24px;
}

#search{
width:90%;
max-width:500px;
margin:20px auto;
display:block;
padding:10px;
font-size:16px;
border-radius:6px;
border:none;
}

#menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
padding:25px;
max-width:1100px;
margin:auto;
}

.gameCard{
background:white;
border-radius:10px;
padding:20px;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
transition:0.2s;
text-align:center;
}

.gameCard:hover{
transform:scale(1.05);
}

#player{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
z-index:1000;
}

iframe{
width:100%;
height:100%;
border:none;
}

#closeBtn{
position:absolute;
top:15px;
right:20px;
font-size:20px;
background:red;
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
border-radius:6px;
}

</style>
</head>

<body>

<header>Student Tools</header>

<input id="search" placeholder="Search games..." onkeyup="searchGames()">

<div id="menu">

<div class="gameCard" onclick="openGame('https://classic.minecraft.net')">
<h3>Block Builder</h3>
</div>

<div class="gameCard" onclick="openGame('https://example.com/platformer')">
<h3>Platform Adventure</h3>
</div>

<div class="gameCard" onclick="openGame('https://example.com/runner')">
<h3>Speed Runner</h3>
</div>

<div class="gameCard" onclick="openGame('https://example.com/reaction')">
<h3>Reaction Test</h3>
</div>

<div class="gameCard" onclick="openGame('https://example.com/puzzle')">
<h3>Puzzle Lab</h3>
</div>

<div class="gameCard" onclick="openGame('https://example.com/arcade')">
<h3>Arcade Challenge</h3>
</div>

</div>

<div id="player">

<button id="closeBtn" onclick="closeGame()">Close</button>

<iframe id="gameFrame"></iframe>

</div>

<script>

function openGame(url){
document.getElementById("player").style.display="block"
document.getElementById("gameFrame").src=url
}

function closeGame(){
document.getElementById("player").style.display="none"
document.getElementById("gameFrame").src=""
}

function searchGames(){
let input=document.getElementById("search").value.toLowerCase()
let games=document.getElementsByClassName("gameCard")

for(let i=0;i<games.length;i++){
let title=games[i].innerText.toLowerCase()

if(title.includes(input)){
games[i].style.display="block"
}else{
games[i].style.display="none"
}
}
}

</script>

</body>
</html>
