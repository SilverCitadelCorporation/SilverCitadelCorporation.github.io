<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Resource Hub</title>
<link rel="icon" href="logo.png">

<style>

body{
margin:0;
font-family:Arial;
background:#e8edf3;
}

header{
background:#2c3e50;
color:white;
text-align:center;
padding:20px;
font-size:24px;
font-weight:bold;
}

#games{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
padding:30px;
max-width:1000px;
margin:auto;
}

.game{
background:white;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
cursor:pointer;
text-align:center;
padding:15px;
transition:.2s;
}

.game:hover{
transform:scale(1.05);
}

.game img{
width:100%;
border-radius:10px;
}

#player{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
z-index:999;
}

#player iframe{
width:100%;
height:100%;
border:none;
}

#close{
position:absolute;
top:10px;
right:20px;
background:red;
color:white;
border:none;
padding:10px 15px;
font-size:16px;
cursor:pointer;
border-radius:6px;
}

</style>
</head>

<body>

<header>
Student Learning Portal
</header>

<div id="games">

<div class="game" onclick="play('https://eaglercraft.com/mc/1.8.8/')">
<img src="https://i.imgur.com/W5b8E6A.png">
<h3>Block Builder</h3>
</div>

<div class="game" onclick="play('https://geometrydashlite.co/')">
<img src="https://i.imgur.com/y0Y5K2L.png">
<h3>Geometry Shapes</h3>
</div>

<div class="game" onclick="play('https://classic.minecraft.net/')">
<img src="https://i.imgur.com/V0qK6bM.png">
<h3>3D Builder</h3>
</div>

<div class="game" onclick="play('https://ubg44.github.io/roblox-obby/')">
<img src="https://i.imgur.com/W0sYh5E.png">
<h3>Platform Challenge</h3>
</div>

<div class="game" onclick="play('https://ubg44.github.io/slope/')">
<img src="https://i.imgur.com/QP6Qp0k.png">
<h3>Slope Math</h3>
</div>

<div class="game" onclick="play('https://ubg44.github.io/run3/')">
<img src="https://i.imgur.com/j9y6G7E.png">
<h3>Run 3</h3>
</div>

</div>

<div id="player">

<button id="close" onclick="closeGame()">Exit</button>

<iframe id="gameframe"></iframe>

</div>

<script>

function play(url){
document.getElementById("player").style.display="block";
document.getElementById("gameframe").src=url;
}

function closeGame(){
document.getElementById("player").style.display="none";
document.getElementById("gameframe").src="";
}

</script>

</body>
</html>
