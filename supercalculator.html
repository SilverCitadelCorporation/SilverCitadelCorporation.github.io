<!DOCTYPE html>
<html>
<head>
<title>Student Resource Center</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

h1{
padding:20px;
}

#library{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
max-width:1000px;
margin:auto;
padding:20px;
}

.game{
background:#1e293b;
padding:25px;
border-radius:10px;
cursor:pointer;
transition:.2s;
}

.game:hover{
background:#334155;
transform:scale(1.05);
}

#player{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
flex-direction:column;
}

#topbar{
background:#111;
padding:10px;
display:flex;
justify-content:space-between;
}

#close{
cursor:pointer;
}

canvas{
margin:auto;
background:#111;
}

</style>
</head>

<body>

<h1>Student Resource Center</h1>

<div id="library">

<div class="game" onclick="launch('dash')">
<h3>Geometry Runner</h3>
<p>Reaction training</p>
</div>

<div class="game" onclick="launch('obby')">
<h3>Platform Logic</h3>
<p>Movement practice</p>
</div>

<div class="game" onclick="launch('builder')">
<h3>Block Designer</h3>
<p>Creative grid builder</p>
</div>

</div>

<div id="player">

<div id="topbar">
<span>Interactive Module</span>
<span id="close" onclick="closeGame()">Exit</span>
</div>

<canvas id="game" width="900" height="500"></canvas>

</div>

<script>

let canvas=document.getElementById("game")
let ctx=canvas.getContext("2d")

let keys={}
let gameLoop=null
let currentGame=null

document.addEventListener("keydown",e=>keys[e.key]=true)
document.addEventListener("keyup",e=>keys[e.key]=false)

function launch(type){

document.getElementById("player").style.display="flex"

if(gameLoop) cancelAnimationFrame(gameLoop)

currentGame=type

if(type==="dash") startDash()
if(type==="obby") startObby()
if(type==="builder") startBuilder()

}

function closeGame(){

document.getElementById("player").style.display="none"
cancelAnimationFrame(gameLoop)

}







/* ---------------- GEOMETRY RUNNER ---------------- */

function startDash(){

let player={x:120,y:400,vy:0}
let obstacles=[{x:900}]

function loop(){

ctx.clearRect(0,0,900,500)

player.vy+=1
player.y+=player.vy

if((keys[" "]||keys["ArrowUp"]||keys["w"]) && player.y>=400){
player.vy=-15
}

ctx.fillStyle="cyan"
ctx.fillRect(player.x,player.y,40,40)

obstacles.forEach(o=>{

o.x-=7

ctx.fillStyle="red"
ctx.fillRect(o.x,420,40,80)

if(o.x<player.x+40 && o.x+40>player.x && player.y+40>420){
startDash()
}

})

if(obstacles[0].x<400) obstacles.push({x:900})
if(obstacles[0].x<-60) obstacles.shift()

gameLoop=requestAnimationFrame(loop)

}

loop()

}







/* ---------------- PLATFORM OBBY ---------------- */

function startObby(){

let player={x:50,y:400,vy:0}

let platforms=[
{x:0,y:450,w:900},
{x:200,y:380,w:140},
{x:420,y:310,w:140},
{x:650,y:250,w:140}
]

function loop(){

ctx.clearRect(0,0,900,500)

if(keys["a"]||keys["ArrowLeft"]) player.x-=5
if(keys["d"]||keys["ArrowRight"]) player.x+=5

player.vy+=1
player.y+=player.vy

if((keys[" "]||keys["ArrowUp"]||keys["w"]) && player.y>=400){
player.vy=-15
}

ctx.fillStyle="yellow"
ctx.fillRect(player.x,player.y,30,30)

ctx.fillStyle="white"

platforms.forEach(p=>{

ctx.fillRect(p.x,p.y,p.w,20)

if(player.x<p.x+p.w &&
player.x+30>p.x &&
player.y+30>p.y &&
player.y+30<p.y+20 &&
player.vy>=0){

player.y=p.y-30
player.vy=0

}

})

gameLoop=requestAnimationFrame(loop)

}

loop()

}







/* ---------------- BLOCK BUILDER ---------------- */

function startBuilder(){

let blocks=[]

canvas.onclick=function(e){

let rect=canvas.getBoundingClientRect()

let x=Math.floor((e.clientX-rect.left)/40)*40
let y=Math.floor((e.clientY-rect.top)/40)*40

blocks.push({x,y})

}

function loop(){

ctx.clearRect(0,0,900,500)

blocks.forEach(b=>{
ctx.fillStyle="lime"
ctx.fillRect(b.x,b.y,38,38)
})

gameLoop=requestAnimationFrame(loop)

}

loop()

}

</script>

</body>
</html>
