<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Resource Hub</title>

<style>

body{
margin:0;
font-family:Arial;
background:#e0e0e0;
}

header{
background:#2c3e50;
color:white;
padding:15px;
text-align:center;
font-size:24px;
}

#menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
padding:25px;
max-width:1100px;
margin:auto;
}

.gameCard{
background:white;
border-radius:10px;
overflow:hidden;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
transition:0.2s;
text-align:center;
}

.gameCard:hover{
transform:scale(1.05);
}

.gameCard img{
width:100%;
height:120px;
object-fit:cover;
}

.gameCard h3{
margin:10px;
}

#player{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
z-index:1000;
}

iframe{
width:100%;
height:100%;
border:none;
}

#closeBtn{
position:absolute;
top:15px;
right:20px;
font-size:20px;
background:red;
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
border-radius:6px;
}

</style>
</head>

<body>

<header>Student Tools</header>

<div id="menu">

<div class="gameCard" onclick="openGame('https://itch.io/embed-upload/10939176?color=333333')">
<img src="https://img.itch.zone/aW1nLzE0NTQ0NjQ1LnBuZw==/315x250%23c/geometry.png">
<h3>Geometry Style Runner</h3>
</div>

<div class="gameCard" onclick="openGame('https://itch.io/embed-upload/10075892?color=333333')">
<img src="https://img.itch.zone/aW1nLzEzNjk0NTU2LnBuZw==/315x250%23c/horror.png">
<h3>Night Shift Horror</h3>
</div>

<div class="gameCard" onclick="openGame('https://classic.minecraft.net')">
<img src="https://upload.wikimedia.org/wikipedia/en/5/51/Minecraft_cover.png">
<h3>Block Builder</h3>
</div>

<div class="gameCard" onclick="openGame('https://itch.io/embed-upload/10458993?color=333333')">
<img src="https://img.itch.zone/aW1nLzEzOTY5MjQxLnBuZw==/315x250%23c/platform.png">
<h3>Platform Adventure</h3>
</div>

<div class="gameCard" onclick="openGame('https://itch.io/embed-upload/10593020?color=333333')">
<img src="https://img.itch.zone/aW1nLzE0MDM1NjQ4LnBuZw==/315x250%23c/reaction.png">
<h3>Reaction Test</h3>
</div>

<div class="gameCard" onclick="openGame('https://itch.io/embed-upload/10462889?color=333333')">
<img src="https://img.itch.zone/aW1nLzEzOTcwMDU1LnBuZw==/315x250%23c/runner.png">
<h3>Speed Runner</h3>
</div>

</div>

<div id="player">

<button id="closeBtn" onclick="closeGame()">Close</button>

<iframe id="gameFrame"></iframe>

</div>

<script>

function openGame(url){
document.getElementById("player").style.display="block"
document.getElementById("gameFrame").src=url
}

function closeGame(){
document.getElementById("player").style.display="none"
document.getElementById("gameFrame").src=""
}

</script>

</body>
</html>
