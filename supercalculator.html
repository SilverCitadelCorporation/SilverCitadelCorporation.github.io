<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Resource Hub</title>

<style>
body{
margin:0;
font-family:Arial;
background:#e0e0e0;
}

header{
background:#2c3e50;
color:white;
padding:15px;
text-align:center;
font-size:24px;
}

#menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:20px;
padding:20px;
max-width:1000px;
margin:auto;
}

.gameCard{
background:white;
padding:15px;
border-radius:10px;
text-align:center;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
transition:0.2s;
}

.gameCard:hover{
transform:scale(1.05);
}

.gameCard img{
width:100%;
border-radius:8px;
margin-bottom:10px;
}

#player{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
z-index:1000;
}

iframe{
width:100%;
height:100%;
border:none;
}

#closeBtn{
position:absolute;
top:15px;
right:20px;
font-size:20px;
background:red;
color:white;
border:none;
padding:10px 14px;
cursor:pointer;
border-radius:6px;
}
</style>
</head>

<body>

<header>Student Tools</header>

<div id="menu">

<div class="gameCard" onclick="openGame('https://example.com/geometry-game')">
<h3>Geometry Dash</h3>
</div>

<div class="gameCard" onclick="openGame('https://example.com/fnaf-browser')">
<h3>Five Nights at Freddy's</h3>
</div>

<div class="gameCard" onclick="openGame('https://example.com/eaglercraft')">
<h3>Eaglercraft</h3>
</div>

<div class="gameCard" onclick="openGame('https://example.com/platformer')">
<h3>Platform Game</h3>
</div>

<div class="gameCard" onclick="openGame('https://example.com/reaction')">
<h3>Reaction Game</h3>
</div>

<div class="gameCard" onclick="openGame('https://example.com/block-builder')">
<h3>Block Builder</h3>
</div>

</div>

<div id="player">

<button id="closeBtn" onclick="closeGame()">Close</button>

<iframe id="gameFrame"></iframe>

</div>

<script>

function openGame(url){
document.getElementById("player").style.display="block"
document.getElementById("gameFrame").src=url
}

function closeGame(){
document.getElementById("player").style.display="none"
document.getElementById("gameFrame").src=""
}

</script>

</body>
</html>
