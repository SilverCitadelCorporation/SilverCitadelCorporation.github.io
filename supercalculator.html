<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Calculator</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
body { margin:0; font-family:'Arial', sans-serif; background:#f0f0f0; }
header { background:#4a235a; color:#d4af37; text-align:center; padding:15px; font-size:24px; font-weight:bold; }
#arcade { display:none; padding:20px; max-width:900px; margin:auto; }
#arcade h2 { text-align:center; color:#4a235a; margin-bottom:20px; }
.games-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:15px; }
.game-tile { background:#4a235a; color:#d4af37; padding:15px; text-align:center; border-radius:10px; cursor:pointer; font-weight:bold; transition:0.3s; }
.game-tile:hover { background:#d4af37; color:#4a235a; }
.game-frame { width:100%; height:500px; border:none; display:none; margin-top:20px; border-radius:10px; }
</style>
</head>
<body>

<header>
    <a href="#" onclick="logoClick(event)">
        <img src="logo.png" alt="Logo" style="width:50px; vertical-align:middle; margin-right:10px;">
    </a>
    Super Calculator
</header>

<!-- Arcade hidden initially -->
<div id="arcade">
    <h2>Super Calculator Arcade</h2>
    <div class="games-grid">
        <div class="game-tile" onclick="openGame('https://scratch.mit.edu/projects/633341882/embed')">Geometry Dash</div>
        <div class="game-tile" onclick="openGame('https://scratch.mit.edu/projects/623984167/embed')">Eagle Craft</div>
        <div class="game-tile" onclick="openGame('https://scratch.mit.edu/projects/617382715/embed')">Eagle Obby</div>
        <div class="game-tile" onclick="openGame('https://scratch.mit.edu/projects/618273145/embed')">Clicker Game</div>
        <div class="game-tile" onclick="openGame('https://scratch.mit.edu/projects/619283712/embed')">Dodge Game</div>
    </div>
    <iframe id="gameFrame" class="game-frame"></iframe>
</div>

<script>
let logoClickCount = 0;

// Triple click logo to unlock arcade
function logoClick(e) {
    e.preventDefault();
    logoClickCount++;
    if(logoClickCount >= 3) {
        document.getElementById("arcade").style.display = "block";
        logoClickCount = 0;
    }
}

// Open selected game in iframe
function openGame(url) {
    let frame = document.getElementById("gameFrame");
    frame.src = url;
    frame.style.display = "block";
    frame.scrollIntoView({behavior:'smooth'});
}
</script>

</body>
</html>
