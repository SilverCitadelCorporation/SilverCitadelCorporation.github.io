<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Resource Hub</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#e0e0e0;
}

header{
  background:#2c3e50;
  color:white;
  padding:15px;
  text-align:center;
  font-size:24px;
}

#menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:20px;
  padding:20px;
  max-width:900px;
  margin:auto;
}

.gameCard{
  background:white;
  padding:20px;
  border-radius:10px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
  transition:0.2s;
}

.gameCard:hover{
  transform:scale(1.05);
}

#player{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

#closeBtn{
  position:absolute;
  top:10px;
  right:20px;
  font-size:20px;
  background:red;
  color:white;
  border:none;
  padding:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>Student Tools</header>

<div id="menu">

  <div class="gameCard" onclick="openGame('school-tools/calculator.html')">
    Geometry Dash
  </div>

  <div class="gameCard" onclick="openGame('school-tools/reading-lab.html')">
    FNAF
  </div>

  <div class="gameCard" onclick="openGame('school-tools/code-lab.html')">
    Eagle Craft
  </div>

  <div class="gameCard" onclick="openGame('school-tools/physics-sim.html')">
    Platform Game
  </div>

  <div class="gameCard" onclick="openGame('school-tools/quick-math.html')">
    Reaction Game
  </div>

  <div class="gameCard" onclick="openGame('school-tools/virtual-builder.html')">
    Block Builder
  </div>

</div>

<div id="player">
  <button id="closeBtn" onclick="closeGame()">X</button>
  <iframe id="gameFrame"></iframe>
</div>

<script>
function openGame(url){
  document.getElementById("player").style.display="block"
  document.getElementById("gameFrame").src=url
}

function closeGame(){
  document.getElementById("player").style.display="none"
  document.getElementById("gameFrame").src=""
}
</script>

</body>
</html>
