<!DOCTYPE html>
<html>
<head>
<title>Student Arcade Hub</title>
<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f1720;
  color:white;
  text-align:center;
}
header{
  background:#111827;
  padding:20px;
  font-size:28px;
}
#menu{
  display:flex;
  justify-content:center;
  padding:50px;
}
.gameCard{
  background:#1f2933;
  padding:40px;
  border-radius:10px;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
  transition:.2s;
  font-size:24px;
}
.gameCard:hover{
  transform:scale(1.05);
  border:2px solid #00ffd5;
}
.stats{
  position:fixed;
  top:10px;
  right:10px;
  background:#111827;
  padding:10px 20px;
  border-radius:8px;
}
button{
  padding:10px 20px;
  margin-top:20px;
  cursor:pointer;
}
</style>
</head>
<body>

<header>Student Arcade</header>

<div class="stats">
Total Points: <span id="points">0</span>
</div>

<div id="menu">
  <div class="gameCard" onclick="playGame('snake.html')">🐍 Snake</div>
  <div class="gameCard" onclick="playGame('stats.html')">📊 Stats</div>
</div>

<a href="mailto:silvercitadelcorporation@gmail.com">
  <button>Report Bug</button>
</a>

<script>
let pts = Number(localStorage.getItem("points")||0);
document.getElementById("points").innerText = pts;

function playGame(file){
  window.location.href = file;
}
</script>

</body>
</html>
