<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Calculator</title>
<link rel="icon" type="image/png" href="logo.png">

<style>
body {
    margin:0;
    font-family:'Arial', sans-serif;
    background:#f0f0f0;
}

#calculator, #arcade {
    width:90%;
    max-width:700px;
    background:#fff;
    padding:20px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    margin:20px auto;
}

#display {
    width:100%;
    height:60px;
    font-size:28px;
    text-align:right;
    padding:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button {
    width:70px;
    height:50px;
    font-size:20px;
    margin:5px;
    border-radius:8px;
    cursor:pointer;
}

button.operator { background:#d4af37; color:#fff; }
button.equal { background:#4a235a; color:#d4af37; width:150px; }

#tabs { display:flex; justify-content:center; margin-bottom:10px; flex-wrap:wrap; }
#tabs button { margin:5px; flex:1 1 100px; }

.game { display:none; width:100%; text-align:center; }
canvas { border:1px solid #000; display:block; margin:auto; background:#111; width:100%; height:300px; }
.message { color:#d4af37; min-height:20px; margin-top:5px; text-align:center; font-weight:bold; }
</style>
</head>
<body>

<!-- Calculator -->
<div id="calculator">
    <input type="text" id="display" disabled>
    <div>
        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button class="operator" onclick="press('/')">/</button>
    </div>
    <div>
        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button class="operator" onclick="press('*')">*</button>
    </div>
    <div>
        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button class="operator" onclick="press('-')">-</button>
    </div>
    <div>
        <button onclick="press('0')">0</button>
        <button onclick="clearDisplay()">C</button>
        <button class="equal" onclick="unlock()">=</button>
        <button class="operator" onclick="press('+')">+</button>
    </div>
</div>

<!-- Arcade -->
<div id="arcade" style="display:none;">
    <div id="tabs">
        <button onclick="showGame('clicker')">Clicker</button>
        <button onclick="showGame('obby')">Obby</button>
        <button onclick="showGame('dodge')">Dodge</button>
        <button onclick="showGame('night')">Night Survival</button>
        <button onclick="showGame('builder')">Block Builder</button>
        <button onclick="showGame('geometry')">Geometry Dash</button>
    </div>

    <div id="clicker" class="game">
        <h3>Clicker Game</h3>
        <button onclick="addScore()">Click Me!</button>
        <p class="message">Score: <span id="score">0</span></p>
    </div>

    <div id="obby" class="game">
        <h3>Obby Game</h3>
        <canvas id="obbyCanvas" width="500" height="300"></canvas>
        <p class="message" id="obbyMessage"></p>
    </div>

    <div id="dodge" class="game">
        <h3>Dodge Game</h3>
        <canvas id="dodgeCanvas" width="500" height="300"></canvas>
        <p class="message" id="dodgeMessage"></p>
    </div>

    <div id="night" class="game">
        <h3>Night Survival</h3>
        <p id="powerText">Power: 100%</p>
        <button onclick="useDoor()">Use Door</button>
        <p class="message" id="nightMessage"></p>
    </div>

    <div id="builder" class="game">
        <h3>Block Builder</h3>
        <canvas id="buildCanvas" width="500" height="300"></canvas>
    </div>

    <div id="geometry" class="game">
        <h3>Geometry Dash</h3>
        <canvas id="geomDashCanvas" width="500" height="300"></canvas>
        <p class="message" id="geomDashMessage"></p>
    </div>
</div>

<script>
// Calculator
let input="";
let display=document.getElementById("display");
function press(val){ input+=val; display.value=input; }
function clearDisplay(){ input=""; display.value=""; }
function unlock(){
    if(input==="0000"){
        document.getElementById("calculator").style.display="none";
        document.getElementById("arcade").style.display="block";
        startGames();
    } else {
        try{ input=eval(input).toString(); display.value=input; } 
        catch{ display.value="Error"; input=""; }
    }
}

// Tabs
function showGame(id){
    document.querySelectorAll('.game').forEach(g=>g.style.display="none");
    document.getElementById(id).style.display="block";
}

// Clicker
let score=0;
function addScore(){ score++; document.getElementById("score").innerText=score; }

// Obby
let oCanvas=document.getElementById("obbyCanvas");
let oCtx=oCanvas.getContext("2d");
let player={x:20,y:150,size:20};
let goal={x:460,y:130,size:30};
let obbyMessage=document.getElementById("obbyMessage");
document.addEventListener("keydown",e=>{
    if(document.getElementById('obby').style.display!=='block') return;
    if(e.key==="ArrowUp") player.y-=10;
    if(e.key==="ArrowDown") player.y+=10;
    if(e.key==="ArrowLeft") player.x-=10;
    if(e.key==="ArrowRight") player.x+=10;
});
function drawObby(){
    oCtx.clearRect(0,0,oCanvas.width,oCanvas.height);
    oCtx.fillStyle="blue"; oCtx.fillRect(player.x,player.y,player.size,player.size);
    oCtx.fillStyle="green"; oCtx.fillRect(goal.x,goal.y,goal.size,goal.size);
    if(player.x<goal.x+goal.size && player.x+player.size>goal.x &&
       player.y<goal.y+goal.size && player.y+player.size>goal.y){
        obbyMessage.innerText="You Win!";
        player.x=20; player.y=150;
        setTimeout(()=>{obbyMessage.innerText="";},2000);
    }
    requestAnimationFrame(drawObby);
}
drawObby();

// Dodge
let dCanvas=document.getElementById("dodgeCanvas");
let dCtx=dCanvas.getContext("2d");
let dPlayer={x:250,y:250,size:20};
let enemy={x:Math.random()*480,y:0,size:20};
let dodgeMessage=document.getElementById("dodgeMessage");
document.addEventListener("keydown",e=>{
    if(document.getElementById('dodge').style.display!=='block') return;
    if(e.key==="a") dPlayer.x-=10;
    if(e.key==="d") dPlayer.x+=10;
});
function drawDodge(){
    dCtx.clearRect(0,0,dCanvas.width,dCanvas.height);
    dCtx.fillStyle="white"; dCtx.fillRect(dPlayer.x,dPlayer.y,dPlayer.size,dPlayer.size);
    dCtx.fillStyle="red"; dCtx.fillRect(enemy.x,enemy.y,enemy.size,enemy.size);
    enemy.y+=5;
    if(enemy.y>300){ enemy.y=0; enemy.x=Math.random()*480; }
    if(dPlayer.x < enemy.x+enemy.size && dPlayer.x+dPlayer.size > enemy.x &&
       dPlayer.y < enemy.y+enemy.size && dPlayer.y+dPlayer.size > enemy.y){
        dPlayer.x=250; dPlayer.y=250;
        enemy.y=0;
    }
    requestAnimationFrame(drawDodge);
}
drawDodge();

// Night Survival
let power=100;
let nightMessage=document.getElementById("nightMessage");
function useDoor(){
    if(power<=0){ nightMessage.innerText="Power Out! Game Over."; power=100; }
    else power-=10;
    document.getElementById("powerText").innerText="Power: "+power+"%";
    setTimeout(()=>{ nightMessage.innerText=""; },2000);
}

// Block Builder
let bCanvas=document.getElementById("buildCanvas");
let bCtx=bCanvas.getContext("2d");
bCanvas.addEventListener("click",e=>{
    let rect=bCanvas.getBoundingClientRect();
    let x=e.clientX-rect.left;
    let y=e.clientY-rect.top;
    bCtx.fillStyle="lime";
    bCtx.fillRect(x,y,20,20);
});

// Geometry Dash
let gCanvas=document.getElementById("geomDashCanvas");
let gCtx=gCanvas.getContext("2d");
let gPlayer={x:50,y:260,width:20,height:20,vy:0};
let gObstacles=[];
let gravity=0.8;
let speed=3;
let geomDashMessage=document.getElementById("geomDashMessage");
function spawnObstacle(){ gObstacles.push({x:500,y:260,width:20,height:40}); }
setInterval(spawnObstacle,1500);
document.addEventListener("keydown",e=>{
    if(document.getElementById('geometry').style.display!=='block') return;
    if(e.key===" ") gPlayer.vy=-12;
});
function drawGeomDash(){
    gCtx.clearRect(0,0,gCanvas.width,gCanvas.height);
    gPlayer.vy+=gravity;
    gPlayer.y+=gPlayer.vy;
    if(gPlayer.y>280) gPlayer.y=280;
    gCtx.fillStyle="yellow";
    gCtx.fillRect(gPlayer.x,gPlayer.y,gPlayer.width,gPlayer.height);
    for(let obs of gObstacles){
        obs.x-=speed;
        gCtx.fillStyle="red";
        gCtx.fillRect(obs.x,obs.y,obs.width,obs.height);
        if(gPlayer.x < obs.x+obs.width && gPlayer.x+gPlayer.width > obs.x &&
           gPlayer.y < obs.y+obs.height && gPlayer.y+gPlayer.height > obs.y){
               gPlayer.x=50; gPlayer.y=260; gPlayer.vy=0;
               gObstacles=[];
        }
    }
    requestAnimationFrame(drawGeomDash);
}
drawGeomDash();

function startGames(){ showGame('clicker'); }

</script>
</body>
</html>
