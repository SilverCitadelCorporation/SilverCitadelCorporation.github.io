<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Arcade Hub</title>

<style>

body{
margin:0;
background:#0f172a;
font-family:Arial;
color:white;
}

header{
background:#020617;
padding:15px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:2px solid #1e293b;
}

#logo{
font-size:22px;
font-weight:bold;
}

#search{
padding:8px;
width:250px;
border-radius:6px;
border:none;
}

/* CATEGORY BAR */

#categories{
display:flex;
gap:10px;
padding:10px 20px;
background:#020617;
}

.catBtn{
padding:6px 14px;
background:#1e293b;
border-radius:6px;
cursor:pointer;
}

/* GRID */

#games{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:20px;
padding:25px;
}

.card{
background:#1e293b;
border-radius:12px;
overflow:hidden;
cursor:pointer;
transition:.25s;
position:relative;
}

.card:hover{
transform:scale(1.06);
box-shadow:0 10px 25px rgba(0,0,0,.6);
}

.thumb{
height:120px;
background:#334155;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
}

.title{
padding:10px;
text-align:center;
}

.favorite{
position:absolute;
top:6px;
right:8px;
cursor:pointer;
font-size:18px;
}

/* PLAYER */

#player{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
flex-direction:column;
}

#topbar{
background:#020617;
padding:10px;
display:flex;
justify-content:space-between;
}

iframe{
flex:1;
border:none;
}

#loading{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:26px;
display:none;
}

</style>
</head>

<body>

<header>

<div id="logo">🎮 Arcade Hub</div>

<input id="search" placeholder="Search games..." onkeyup="searchGames()">

</header>


<div id="categories">

<div class="catBtn" onclick="filterGames('all')">All</div>
<div class="catBtn" onclick="filterGames('arcade')">Arcade</div>
<div class="catBtn" onclick="filterGames('puzzle')">Puzzle</div>
<div class="catBtn" onclick="filterGames('action')">Action</div>
<div class="catBtn" onclick="filterGames('skill')">Skill</div>

</div>


<div id="games">

<div class="card arcade" onclick="openGame('games/snake.html')">
<div class="favorite" onclick="toggleFav(event,this)">⭐</div>
<div class="thumb">🐍</div>
<div class="title">Snake Adventure</div>
</div>

<div class="card arcade" onclick="openGame('games/breakout.html')">
<div class="favorite" onclick="toggleFav(event,this)">⭐</div>
<div class="thumb">🧱</div>
<div class="title">Breakout</div>
</div>

<div class="card puzzle" onclick="openGame('games/tetris.html')">
<div class="favorite" onclick="toggleFav(event,this)">⭐</div>
<div class="thumb">⬛</div>
<div class="title">Tetris</div>
</div>

<div class="card skill" onclick="openGame('games/reaction.html')">
<div class="favorite" onclick="toggleFav(event,this)">⭐</div>
<div class="thumb">⚡</div>
<div class="title">Reaction Test</div>
</div>

<div class="card action" onclick="openGame('games/spaceshooter.html')">
<div class="favorite" onclick="toggleFav(event,this)">⭐</div>
<div class="thumb">🚀</div>
<div class="title">Space Shooter</div>
</div>

<div class="card arcade" onclick="openGame('games/flappy.html')">
<div class="favorite" onclick="toggleFav(event,this)">⭐</div>
<div class="thumb">🐦</div>
<div class="title">Flappy Flight</div>
</div>

<div class="card arcade" onclick="openGame('games/pacman.html')">
<div class="favorite" onclick="toggleFav(event,this)">⭐</div>
<div class="thumb">🟡</div>
<div class="title">Maze Chaser</div>
</div>

<div class="card puzzle" onclick="openGame('games/2048.html')">
<div class="favorite" onclick="toggleFav(event,this)">⭐</div>
<div class="thumb">🔢</div>
<div class="title">2048</div>
</div>

</div>


<div id="player">

<div id="topbar">

<button onclick="closeGame()">⬅ Back</button>

<div>Game Player</div>

</div>

<div id="loading">Loading Game...</div>

<iframe id="gameFrame"></iframe>

</div>


<script>

/* OPEN GAME */

function openGame(url){

document.getElementById("player").style.display="flex"

document.getElementById("loading").style.display="block"

document.getElementById("gameFrame").src=""

setTimeout(()=>{

document.getElementById("gameFrame").src=url

document.getElementById("loading").style.display="none"

},500)

}


/* CLOSE */

function closeGame(){

document.getElementById("player").style.display="none"

document.getElementById("gameFrame").src=""

}


/* SEARCH */

function searchGames(){

let input=document.getElementById("search").value.toLowerCase()

let cards=document.querySelectorAll(".card")

cards.forEach(card=>{

let title=card.innerText.toLowerCase()

card.style.display = title.includes(input) ? "block":"none"

})

}


/* FILTER */

function filterGames(cat){

let cards=document.querySelectorAll(".card")

cards.forEach(card=>{

if(cat=="all"){
card.style.display="block"
}else{
card.style.display = card.classList.contains(cat) ? "block":"none"
}

})

}


/* FAVORITES */

function toggleFav(event,star){

event.stopPropagation()

if(star.innerText=="⭐"){
star.innerText="🌟"
}else{
star.innerText="⭐"
}

}

</script>

</body>
</html>
