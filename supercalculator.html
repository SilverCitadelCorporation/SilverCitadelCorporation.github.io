<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Silver Citadel Arcade</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    text-align:center;
}

h1{
    padding:20px;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    padding:20px;
}

.game{
    background:#222;
    padding:20px;
    border-radius:10px;
    cursor:pointer;
    transition:0.2s;
}

.game:hover{
    transform:scale(1.05);
    background:#333;
}

#player{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    display:none;
}

#player iframe{
    width:100%;
    height:100%;
    border:none;
}

#close{
    position:absolute;
    top:15px;
    right:20px;
    font-size:20px;
    cursor:pointer;
    background:#222;
    padding:10px 15px;
    border-radius:6px;
}
</style>
</head>

<body>

<h1>Silver Citadel Arcade</h1>

<div class="games">

<div class="game" onclick="openGame('https://example.com/game1')">
<h3>Block Builder</h3>
<p>Minecraft‑style sandbox</p>
</div>

<div class="game" onclick="openGame('https://example.com/game2')">
<h3>Geometry Runner</h3>
<p>Dash and avoid obstacles</p>
</div>

<div class="game" onclick="openGame('https://example.com/game3')">
<h3>Obby Parkour</h3>
<p>Jump across platforms</p>
</div>

<div class="game" onclick="openGame('https://example.com/game4')">
<h3>Clicker Tycoon</h3>
<p>Earn coins and upgrade</p>
</div>

</div>

<div id="player">
<div id="close" onclick="closeGame()">Exit</div>
<iframe id="frame"></iframe>
</div>

<script>
function openGame(url){
    document.getElementById("player").style.display="block";
    document.getElementById("frame").src=url;
}

function closeGame(){
    document.getElementById("player").style.display="none";
    document.getElementById("frame").src="";
}
</script>

</body>
</html>
