<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Resource Hub</title>

<style>
body{
margin:0;
font-family:Arial;
background:#e0e0e0;
}

header{
background:#2c3e50;
color:white;
padding:15px;
text-align:center;
font-size:24px;
}

#menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:20px;
padding:20px;
max-width:900px;
margin:auto;
}

.gameCard{
background:white;
padding:20px;
border-radius:10px;
text-align:center;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.gameCard:hover{
transform:scale(1.05);
}
</style>
</head>

<body>

<header>Student Tools</header>

<div id="menu">

<div class="gameCard" onclick="window.location.href='games/snake.html'">
Snake Adventure
</div>

<div class="gameCard" onclick="window.location.href='games/miniDash.html'">
Mini Dash
</div>

<div class="gameCard" onclick="window.location.href='games/reaction.html'">
Reaction Game
</div>

<div class="gameCard" onclick="window.location.href='games/eagleCraft.html'">
EagleCraft
</div>

<div class="gameCard" onclick="window.location.href='games/geometry.html'">
Geometry Game
</div>

</div>

</body>
</html>
