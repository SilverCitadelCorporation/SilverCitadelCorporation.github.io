<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Learning Lab</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f4f6f9;
}

header{
background:#34495e;
color:white;
padding:15px;
text-align:center;
font-size:22px;
}

#tabs{
display:flex;
justify-content:center;
flex-wrap:wrap;
margin-top:10px;
}

#tabs button{
margin:5px;
padding:10px 15px;
border:none;
background:#3498db;
color:white;
cursor:pointer;
border-radius:5px;
}

#tabs button.active{
background:#2c3e50;
}

.game{
display:none;
text-align:center;
margin-top:20px;
}

canvas{
background:#111;
border:1px solid black;
}

</style>
</head>

<body>

<header>Student Learning Lab</header>

<div id="tabs">

<button class="active" onclick="show('clicker',this)">Reaction Trainer</button>
<button onclick="show('geometry',this)">Shape Runner</button>
<button onclick="show('builder',this)">Block Simulator</button>

</div>

<div class="game" id="clicker">

<h3>Reaction Speed Trainer</h3>

<button onclick="score++">Click</button>
<p id="score">0</p>

</div>

<div class="game" id="geometry">

<h3>Shape Runner</h3>

<canvas id="geom" width="500" height="300"></canvas>

</div>

<div class="game" id="builder">

<h3>Block Simulator</h3>

<canvas id="build" width="500" height="300"></canvas>

</div>

<script>

function show(id,btn){

document.querySelectorAll('.game').forEach(g=>g.style.display='none')
document.getElementById(id).style.display='block'

document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'))
btn.classList.add('active')

}

show("clicker",document.querySelector("#tabs button"))

let score=0
setInterval(()=>{document.getElementById("score").innerText=score},100)

let canvas=document.getElementById("geom")
let ctx=canvas.getContext("2d")

let player={x:50,y:260,vy:0}

let obstacles=[]

document.addEventListener("keydown",e=>{
if(e.key===" ") player.vy=-10
})

setInterval(()=>{
obstacles.push({x:500})
},1500)

function loop(){

ctx.clearRect(0,0,500,300)

player.vy+=0.8
player.y+=player.vy

if(player.y>260) player.y=260

ctx.fillStyle="yellow"
ctx.fillRect(player.x,player.y,20,20)

for(let o of obstacles){

o.x-=4

ctx.fillStyle="red"
ctx.fillRect(o.x,260,20,40)

if(player.x<o.x+20 && player.x+20>o.x && player.y+20>260){

player.y=260
player.vy=0
obstacles=[]

}

}

requestAnimationFrame(loop)

}

loop()

let build=document.getElementById("build")
let bctx=build.getContext("2d")

build.addEventListener("click",e=>{

let r=build.getBoundingClientRect()

let x=e.clientX-r.left
let y=e.clientY-r.top

bctx.fillStyle="lime"
bctx.fillRect(x,y,20,20)

})

</script>

</body>
</html>
