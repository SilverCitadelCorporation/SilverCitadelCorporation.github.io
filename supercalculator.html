<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Arcade Hub</title>

<style>

body{
margin:0;
background:#0f172a;
font-family:Arial;
color:white;
}

/* HEADER */

header{
background:#020617;
padding:15px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:2px solid #1e293b;
}

#logo{
font-size:22px;
font-weight:bold;
}

#search{
padding:8px;
width:250px;
border-radius:6px;
border:none;
}

/* GRID */

#games{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:20px;
padding:30px;
}

/* GAME CARD */

.card{
background:#1e293b;
border-radius:12px;
overflow:hidden;
cursor:pointer;
transition:0.25s;
}

.card:hover{
transform:scale(1.05);
box-shadow:0 10px 25px rgba(0,0,0,.5);
}

.thumb{
height:120px;
background:#334155;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
}

.title{
padding:10px;
text-align:center;
}

/* PLAYER */

#player{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
flex-direction:column;
}

#topbar{
background:#020617;
padding:10px;
display:flex;
justify-content:space-between;
}

iframe{
flex:1;
border:none;
}

/* LOADING */

#loading{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:24px;
display:none;
}

</style>
</head>

<body>

<header>

<div id="logo">Arcade Hub</div>

<input id="search" placeholder="Search games..." onkeyup="searchGames()">

</header>


<div id="games">

<div class="card" onclick="openGame('games/snake.html')">
<div class="thumb">🐍</div>
<div class="title">Snake Adventure</div>
</div>

<div class="card" onclick="openGame('games/breakout.html')">
<div class="thumb">🧱</div>
<div class="title">Breakout</div>
</div>

<div class="card" onclick="openGame('games/tetris.html')">
<div class="thumb">⬛</div>
<div class="title">Tetris</div>
</div>

<div class="card" onclick="openGame('games/maze.html')">
<div class="thumb">🧭</div>
<div class="title">Maze Escape</div>
</div>

<div class="card" onclick="openGame('games/reaction.html')">
<div class="thumb">⚡</div>
<div class="title">Reaction Test</div>
</div>

<div class="card" onclick="openGame('games/runner.html')">
<div class="thumb">🏃</div>
<div class="title">Rhythm Runner</div>
</div>

<div class="card" onclick="openGame('games/platform.html')">
<div class="thumb">🕹</div>
<div class="title">Platform Adventure</div>
</div>

<div class="card" onclick="openGame('games/builder.html')">
<div class="thumb">🧱</div>
<div class="title">Block Builder</div>
</div>

<div class="card" onclick="openGame('games/2048.html')">
<div class="thumb">🔢</div>
<div class="title">2048</div>
</div>

<div class="card" onclick="openGame('games/spaceshooter.html')">
<div class="thumb">🚀</div>
<div class="title">Space Shooter</div>
</div>

</div>


<!-- GAME PLAYER -->

<div id="player">

<div id="topbar">
<button onclick="closeGame()">Back</button>
<div>Game Player</div>
</div>

<div id="loading">Loading...</div>

<iframe id="gameFrame"></iframe>

</div>


<script>

function openGame(url){

document.getElementById("player").style.display="flex"

document.getElementById("loading").style.display="block"

document.getElementById("gameFrame").src=""

setTimeout(()=>{
document.getElementById("gameFrame").src=url
document.getElementById("loading").style.display="none"
},500)

}


function closeGame(){

document.getElementById("player").style.display="none"

document.getElementById("gameFrame").src=""

}


function searchGames(){

let input=document.getElementById("search").value.toLowerCase()

let cards=document.querySelectorAll(".card")

cards.forEach(card=>{

let title=card.innerText.toLowerCase()

card.style.display = title.includes(input) ? "block":"none"

})

}

</script>

</body>
</html>
