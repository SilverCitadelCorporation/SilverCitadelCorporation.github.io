<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Resource Hub</title>

<style>

body{
margin:0;
font-family:Arial;
background:#e0e0e0;
}

header{
background:#2c3e50;
color:white;
padding:15px;
text-align:center;
font-size:24px;
}

#search{
width:90%;
max-width:500px;
display:block;
margin:20px auto;
padding:10px;
font-size:16px;
border-radius:6px;
border:none;
}

#menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
padding:25px;
max-width:1100px;
margin:auto;
}

.gameCard{
background:white;
border-radius:10px;
padding:15px;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
transition:.2s;
text-align:center;
position:relative;
}

.gameCard:hover{
transform:scale(1.05);
}

.gameCard img{
width:100%;
border-radius:6px;
margin-bottom:10px;
}

.favorite{
position:absolute;
top:8px;
right:10px;
font-size:20px;
color:gold;
cursor:pointer;
}

.category{
font-size:12px;
color:#777;
margin-top:4px;
}

#player{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
z-index:1000;
}

iframe{
width:100%;
height:100%;
border:6px solid white;
}

#closeBtn{
position:absolute;
top:15px;
right:20px;
font-size:20px;
background:red;
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
border-radius:6px;
z-index:2000;
}

#fullscreenBtn{
position:absolute;
top:15px;
right:120px;
font-size:18px;
background:#3498db;
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
border-radius:6px;
z-index:2000;
}

#loading{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
color:white;
font-size:24px;
display:none;
}

</style>
</head>

<body>

<header>Student Tools</header>

<input id="search" placeholder="Search games..." onkeyup="searchGames()">

<div id="menu">

<div class="gameCard" data-game="games/snake.html">
<span class="favorite">☆</span>
<img src="thumbs/snake.png">
<h3>Snake Adventure</h3>
<div class="category">Arcade</div>
</div>

<div class="gameCard" data-game="games/breakout.html">
<span class="favorite">☆</span>
<img src="thumbs/breakout.png">
<h3>Breakout</h3>
<div class="category">Arcade</div>
</div>

<div class="gameCard" data-game="games/tetris.html">
<span class="favorite">☆</span>
<img src="thumbs/tetris.png">
<h3>Tetris</h3>
<div class="category">Puzzle</div>
</div>

<div class="gameCard" data-game="games/maze.html">
<span class="favorite">☆</span>
<img src="thumbs/maze.png">
<h3>Maze Escape</h3>
<div class="category">Skill</div>
</div>

<div class="gameCard" data-game="games/runner.html">
<span class="favorite">☆</span>
<img src="thumbs/runner.png">
<h3>Rhythm Runner</h3>
<div class="category">Skill</div>
</div>

<div class="gameCard" data-game="games/platform.html">
<span class="favorite">☆</span>
<img src="thumbs/platform.png">
<h3>Platform Adventure</h3>
<div class="category">Arcade</div>
</div>

<div class="gameCard" data-game="games/reaction.html">
<span class="favorite">☆</span>
<img src="thumbs/reaction.png">
<h3>Reaction Test</h3>
<div class="category">Skill</div>
</div>

<div class="gameCard" data-game="games/builder.html">
<span class="favorite">☆</span>
<img src="thumbs/builder.png">
<h3>Block Builder</h3>
<div class="category">Sandbox</div>
</div>

<div class="gameCard" data-game="games/2048.html">
<span class="favorite">☆</span>
<img src="thumbs/2048.png">
<h3>2048 Challenge</h3>
<div class="category">Puzzle</div>
</div>

</div>

<div id="player">

<button id="closeBtn" onclick="closeGame()">Close</button>
<button id="fullscreenBtn" onclick="fullscreen()">Fullscreen</button>

<div id="loading">Loading...</div>

<iframe id="gameFrame"></iframe>

</div>

<script>

function openGame(url){

document.getElementById("player").style.display="block"

document.getElementById("loading").style.display="block"

let frame=document.getElementById("gameFrame")

frame.src=url

frame.onload=function(){
document.getElementById("loading").style.display="none"
}

}

function closeGame(){
document.getElementById("player").style.display="none"
document.getElementById("gameFrame").src=""
}

function fullscreen(){
document.getElementById("gameFrame").requestFullscreen()
}

function searchGames(){

let input=document.getElementById("search").value.toLowerCase()

document.querySelectorAll(".gameCard").forEach(card=>{

let name=card.querySelector("h3").innerText.toLowerCase()

card.style.display=name.includes(input)?"block":"none"

})

}

function toggleFav(el,game){

let favs=JSON.parse(localStorage.getItem("favorites")||"[]")

if(favs.includes(game)){
favs=favs.filter(x=>x!==game)
el.innerText="☆"
}
else{
favs.push(game)
el.innerText="★"
}

localStorage.setItem("favorites",JSON.stringify(favs))

}

window.onload=function(){

document.querySelectorAll(".gameCard").forEach(card=>{

let fav=card.querySelector(".favorite")

let game=card.dataset.game

card.addEventListener("click",e=>{
if(e.target!==fav){
openGame(game)
}
})

fav.addEventListener("click",e=>{
e.stopPropagation()
toggleFav(fav,game)
})

})

}

</script>

</body>
</html>
