<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Studie Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#e0e0e0;
  transition:.3s;
}
.dark{background:#111;color:white;}
header{
  background:#2c3e50;
  color:white;
  padding:15px;
  text-align:center;
  font-size:24px;
}
#search{
  display:block;
  margin:15px auto;
  padding:10px;
  width:250px;
  font-size:16px;
  border-radius:6px;
  border:none;
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}
#menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:15px;
  padding:20px;
  max-width:1200px;
  margin:auto;
}
.card{
  background:white;
  padding:12px;
  border-radius:10px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 4px 8px rgba(0,0,0,.2);
  transition:.2s;
}
.dark .card{background:#1e1e1e;}
.card:hover{transform:scale(1.05);}
.card img{width:100%;border-radius:6px;}
.score{font-size:12px;opacity:.6;}
#player{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  z-index:999;
}
iframe{
  width:100%;
  height:100%;
  border:none;
}
#close{
  position:absolute;
  top:10px;
  right:20px;
  background:red;
  color:white;
  border:none;
  padding:10px;
  cursor:pointer;
  border-radius:6px;
}
#darkBtn{
  position:fixed;
  bottom:20px;
  left:20px;
  background:#34495e;
  color:white;
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin-bottom:5px;
}
#studentBtn{
  position:fixed;
  bottom:60px; /* under dark mode */
  left:20px;
  background:red;
  color:white;
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
#reportBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  padding:12px 20px;
  background:#f39c12;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 4px 6px rgba(0,0,0,0.3);
  transition:.2s;
}
#reportBtn:hover{ background:#e67e22; }
</style>
</head>
<body>

<header id="title">Student Studie Hub</header>

<button id="darkBtn" onclick="toggleDark()">Dark Mode</button>
<button id="studentBtn" onclick="toggleStudent()">Student Mode</button>
<input id="search" placeholder="Search games..." onkeyup="searchGames()">

<div id="menu">
  <div class="card" data-name="snake" onclick="openGame('games/snake.html')">
    <img src="images/snake.png" alt="Snake"><br>
    Snake<br><span class="score">High Score: <span id="snakeScore">0</span></span>
  </div>
  <div class="card" data-name="flappy bird" onclick="openGame('games/flappy-bird.html')">
    <img src="images/flappy.png" alt="Flappy Bird"><br>
    Flappy Bird<br><span class="score">High Score: <span id="flappyScore">0</span></span>
  </div>
  <div class="card" data-name="pacman" onclick="openGame('games/pack-man.html')">
    <img src="images/pacman.png" alt="Pac-Man"><br>
    Pac-Man<br><span class="score">High Score: <span id="pacScore">0</span></span>
  </div>
  <!-- add more game cards as needed -->
</div>

<div id="player">
  <button id="close" onclick="closeGame()">X</button>
  <iframe id="gameFrame"></iframe>
</div>

<button id="reportBtn" onclick="reportBug()">Report Bug</button>

<script>
let student=false;

// Open/Close Game
function openGame(url){
  document.getElementById("player").style.display="block";
  document.getElementById("gameFrame").src=url;
  setTimeout(()=>document.getElementById("gameFrame").focus(),200);
}
function closeGame(){
  document.getElementById("player").style.display="none";
  document.getElementById("gameFrame").src="";
}

// Student Mode Toggle
function toggleStudent(){
  student=!student;
  if(student){
    document.getElementById("title").innerText="Student Learning Portal";
    document.getElementById("menu").innerHTML=`
      <div class="card">Algebra Practice</div>
      <div class="card">Reading Tools</div>
      <div class="card">Science Simulations</div>
      <div class="card">Geometry Tools</div>
    `;
  } else {
    location.reload();
  }
}

// Dark Mode Toggle
function toggleDark(){
  document.body.classList.toggle("dark");
}

// Search Games
function searchGames(){
  let input = document.getElementById("search").value.toLowerCase();
  document.querySelectorAll(".card").forEach(card=>{
    let name = card.dataset.name || "";
    card.style.display = name.includes(input) ? "block" : "none";
  });
}

// High Scores
document.getElementById("snakeScore").innerText=localStorage.getItem("snakeHighScore")||0;
document.getElementById("flappyScore").innerText=localStorage.getItem("flappyHighScore")||0;
document.getElementById("pacScore").innerText=localStorage.getItem("pacHighScore")||0;

// Report Bug
function reportBug(){
  window.location.href="mailto:silvercitadelcorporation@gmail.com?subject=Student Studie Hub Bug Report&body=Describe the issue...";
}
</script>
</body>
</html>
