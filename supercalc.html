<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Math Portal</title>

<style>
body{
margin:0;
font-family:Arial;
background:#eef2f7;
}

header{
background:#2c3e50;
color:white;
padding:15px;
text-align:center;
font-size:22px;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
margin-bottom:20px;
}

#calc{
width:100%;
font-size:26px;
padding:10px;
margin-bottom:10px;
text-align:right;
}

.buttons{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

.buttons button{
padding:15px;
font-size:18px;
border:none;
border-radius:6px;
background:#3498db;
color:white;
cursor:pointer;
}

.buttons button:hover{
background:#2980b9;
}

.info{
color:#555;
font-size:14px;
margin-top:10px;
}
</style>
</head>

<body>

<header>Student Mathematics Utility</header>

<div class="container">

<div class="card">

<h3>Standard Calculator</h3>

<input id="calc" readonly>

<div class="buttons">

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button onclick="add('/')">÷</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button onclick="add('*')">×</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button onclick="add('-')">−</button>

<button onclick="add('0')">0</button>
<button onclick="clearCalc()">C</button>
<button onclick="calculate()">=</button>
<button onclick="add('+')">+</button>

</div>

<div class="info">
Tip: This calculator supports standard arithmetic expressions.
</div>

</div>

<div class="card">

<h3>Common Math Formula</h3>

<p>Pythagorean Theorem</p>


::contentReference[oaicite:0]{index=0}


</div>

</div>

<script>

let display = document.getElementById("calc")

function add(val){
display.value += val
}

function clearCalc(){
display.value=""
}

function calculate(){

if(display.value === "0000"){
window.location.href="supercalculator.html"
return
}

try{
display.value = eval(display.value)
}catch{
display.value="Error"
}

}

</script>

</body>
</html>
