<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mega Arcade Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#e0e0e0;
  transition:.3s;
}
.dark{background:#111;color:white;}
header{
  background:#2c3e50;
  color:white;
  padding:15px;
  text-align:center;
  font-size:24px;
}
#search{
  display:block;
  margin:15px auto;
  padding:10px;
  width:250px;
  font-size:16px;
  border-radius:6px;
  border:none;
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}
#menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:15px;
  padding:20px;
  max-width:1200px;
  margin:auto;
}
.card{
  background:white;
  padding:12px;
  border-radius:10px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 4px 8px rgba(0,0,0,.2);
  transition:.2s;
}
.dark .card{background:#1e1e1e;}
.card:hover{transform:scale(1.05);}
.card img{width:100%;border-radius:6px;}
.score{font-size:12px;opacity:.6;}
#player{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  z-index:999;
}
iframe{
  width:100%;
  height:100%;
  border:none;
}
#close{
  position:absolute;
  top:10px;
  right:20px;
  background:red;
  color:white;
  border:none;
  padding:10px;
  cursor:pointer;
  border-radius:6px;
}
#studentBtn{
  position:fixed;
  top:20px;
  left:20px;
  background:red;
  color:white;
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
#darkBtn{
  position:fixed;
  bottom:80px;
  left:20px;
  background:#34495e;
  color:white;
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
#reportBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  padding:12px 20px;
  background:#f39c12;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 4px 6px rgba(0,0,0,0.3);
  transition:.2s;
}
#reportBtn:hover{ background:#e67e22; }
#joystick{
  position:fixed;
  bottom:20px;
  left:20px;
  width:120px;
  height:120px;
  background:rgba(0,0,0,.2);
  border-radius:50%;
  touch-action:none;
}
#actionBtn{
  position:fixed;
  bottom:20px;
  right:140px;
  width:80px;
  height:80px;
  background:red;
  border-radius:50%;
  touch-action:none;
}
@media(max-width:600px){
  #search{width:90%;}
  #menu{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));}
}
</style>
</head>
<body>

<header id="title">Mega Arcade Hub</header>

<button id="studentBtn" onclick="toggleStudent()">Student Mode</button>
<button id="darkBtn" onclick="toggleDark()">Dark Mode</button>
<input id="search" placeholder="Search games..." onkeyup="searchGames()">

<div id="menu">
  <div class="card" data-name="snake" onclick="openGame('games/snake.html')">
    Snake<br><span class="score">High Score: <span id="snakeScore">0</span></span>
  </div>
  <div class="card" data-name="flappy bird" onclick="openGame('games/flappy-bird.html')">
    Flappy Bird<br><span class="score">High Score: <span id="flappyScore">0</span></span>
  </div>
  <div class="card" data-name="pacman" onclick="openGame('games/pack-man.html')">
    Pac-Man<br><span class="score">High Score: <span id="pacScore">0</span></span>
  </div>
  <!-- Add more game cards as needed -->
</div>

<div id="player">
  <button id="close" onclick="closeGame()">X</button>
  <iframe id="gameFrame"></iframe>
</div>

<div id="joystick"></div>
<div id="actionBtn">Space</div>
<button id="reportBtn" onclick="reportBug()">Report Bug</button>

<script>
let student=false;

// Open/Close Game
function openGame(url){
  document.getElementById("player").style.display="block";
  document.getElementById("gameFrame").src=url;
  setTimeout(()=>document.getElementById("gameFrame").focus(),200);
}
function closeGame(){
  document.getElementById("player").style.display="none";
  document.getElementById("gameFrame").src="";
}

// Student Mode Toggle
function toggleStudent(){
  student=!student;
  if(student){
    document.getElementById("title").innerText="Student Learning Portal";
    document.getElementById("menu").innerHTML=`
      <div class="card">Algebra Practice</div>
      <div class="card">Reading Tools</div>
      <div class="card">Science Simulations</div>
      <div class="card">Geometry Tools</div>
    `;
  } else {
    location.reload();
  }
}

// Dark Mode Toggle
function toggleDark(){
  document.body.classList.toggle("dark");
}

// Search Games
function searchGames(){
  let input = document.getElementById("search").value.toLowerCase();
  document.querySelectorAll(".card").forEach(card=>{
    let name = card.dataset.name || "";
    card.style.display = name.includes(input) ? "block" : "none";
  });
}

// High Scores
document.getElementById("snakeScore").innerText=localStorage.getItem("snakeHighScore")||0;
document.getElementById("flappyScore").innerText=localStorage.getItem("flappyHighScore")||0;
document.getElementById("pacScore").innerText=localStorage.getItem("pacHighScore")||0;

// Mobile Joystick
let joystick = document.getElementById("joystick");
let actionBtn = document.getElementById("actionBtn");
if(/Mobi|Android/i.test(navigator.userAgent)){
  joystick.style.display="block";
  actionBtn.style.display="block";
}

// Touch joystick events
let startX,startY,direction;
joystick.addEventListener("touchstart",e=>{
  let t = e.touches[0];
  startX=t.clientX; startY=t.clientY;
});
joystick.addEventListener("touchmove",e=>{
  let t = e.touches[0];
  let dx=t.clientX-startX;
  let dy=t.clientY-startY;
  if(Math.abs(dx)>Math.abs(dy)){
    direction = dx>0?'ArrowRight':'ArrowLeft';
  } else { direction = dy>0?'ArrowDown':'ArrowUp'; }
  document.getElementById("gameFrame").contentWindow.postMessage({key:direction},'*');
});
joystick.addEventListener("touchend",e=>{
  direction=null;
});

// Action button for space / click
actionBtn.addEventListener("touchstart",()=>{
  document.getElementById("gameFrame").contentWindow.postMessage({key:' '},'*');
});

// Keyboard events forwarding
window.addEventListener("keydown",e=>{
  document.getElementById("gameFrame").contentWindow.postMessage({key:e.key},'*');
});

// Report Bug
function reportBug(){
  window.location.href="mailto:silvercitadelcorporation@gmail.com?subject=Mega Arcade Bug Report&body=Describe the issue...";
}

// Controller Support
window.addEventListener("gamepadconnected",e=>{
  console.log("Controller connected:", e.gamepad.id);
});
</script>
</body>
</html>
