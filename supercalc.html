<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperCalc</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* CALCULATOR */
#calculator{
    background:#222;
    padding:20px;
    border-radius:12px;
    width:300px;
}

#display{
    width:100%;
    height:50px;
    font-size:22px;
    margin-bottom:10px;
    text-align:right;
    padding:5px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button{
    padding:15px;
    font-size:16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

/* ARCADE */
#arcade{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#111;
    color:white;
    text-align:center;
    overflow:auto;
    padding:20px;
}
</style>
</head>

<body>

<div id="calculator">
    <input type="text" id="display" readonly>

    <div class="buttons">
        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button onclick="press('/')">/</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('*')">*</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="press('-')">-</button>

        <button onclick="press('0')">0</button>
        <button onclick="clearDisplay()">C</button>
        <button onclick="unlock()">=</button>
        <button onclick="press('+')">+</button>
    </div>
</div>

<div id="arcade">
    <h1>Arcade Unlocked</h1>
    <p>Welcome.</p>
</div>

<script>
let input = "";
let display = document.getElementById("display");

function press(val){
    input += val;
    display.value = input;
}

function clearDisplay(){
    input = "";
    display.value = "";
}

function unlock(){
    if(input === "0000"){
        document.getElementById("calculator").style.display="none";
        document.getElementById("arcade").style.display="block";
    } else {
        try{
            input = eval(input).toString();
            display.value = input;
        } catch {
            display.value = "Error";
            input = "";
        }
    }
}
</script>

</body>
</html>
