<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silver Citadel Arcade</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
body{margin:0;font-family:Garamond,serif;background:#111;color:white;text-align:center;}
h1{margin-top:20px;}
#calculator{margin-top:20px;}
#calculator input{width:200px;font-size:20px;text-align:right;}
#calculator button{margin:2px;padding:10px 15px;font-size:16px;cursor:pointer;}
#arcade{display:none;margin-top:30px;}
.arcade-menu button{margin:5px;padding:10px 20px;font-size:16px;border-radius:6px;cursor:pointer;}
.game{display:none;margin-top:20px;}
canvas{border:1px solid white;background:#222;}
</style>
</head>
<body>

<h1>SuperCalc</h1>
<p>A normal calculator for math...</p>

<!-- Calculator -->
<div id="calculator">
<input type="text" id="display" readonly><br>
<button onclick="press('7')">7</button>
<button onclick="press('8')">8</button>
<button onclick="press('9')">9</button>
<button onclick="press('/')">/</button><br>
<button onclick="press('4')">4</button>
<button onclick="press('5')">5</button>
<button onclick="press('6')">6</button>
<button onclick="press('*')">*</button><br>
<button onclick="press('1')">1</button>
<button onclick="press('2')">2</button>
<button onclick="press('3')">3</button>
<button onclick="press('-')">-</button><br>
<button onclick="press('0')">0</button>
<button onclick="clearDisplay()">C</button>
<button onclick="calculate()">=</button>
<button onclick="press('+')">+</button>
</div>

<!-- Arcade -->
<div id="arcade">
<div class="arcade-menu">
<button onclick="showGame('clicker')">Focus Clicker</button>
<button onclick="showGame('obby')">Logic Obby</button>
<button onclick="showGame('dodge')">Reaction Trainer</button>
<button onclick="showGame('survival')">Night Survival</button>
<button onclick="showGame('builder')">Block Builder</button>
<button onclick="showGame('tasks')">Task Challenge</button>
</div>

<div id="clicker" class="game">
<h2>Focus Clicker</h2>
Score: <span id="score">0</span><br><br>
<button onclick="addScore()">Click Me!</button>
</div>

<div id="obby" class="game">
<h2>Logic Obby</h2>
<canvas id="obbyCanvas" width="500" height="300"></canvas>
<p>Use arrow keys to reach the green block.</p>
</div>

<div id="dodge" class="game">
<h2>Reaction Trainer</h2>
<canvas id="dodgeCanvas" width="500" height="300"></canvas>
<p>Use A/D keys to avoid red blocks.</p>
</div>

<div id="survival" class="game">
<h2>Night Survival</h2>
Power: <span id="powerText">100%</span><br>
<button onclick="useDoor()">Close Door (-10%)</button>
</div>

<div id="builder" class="game">
<h2>Block Builder</h2>
<canvas id="buildCanvas" width="500" height="300"></canvas>
<p>Click to place green blocks.</p>
</div>

<div id="tasks" class="game">
<h2>Task Challenge</h2>
<p id="taskStatus">Tasks Done: 0/3</p>
<button onclick="completeTask()">Do Task</button>
</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", ()=>{
let input="";
const display=document.getElementById("display");

// Calculator functions
window.press=val=>{ input+=val; display.value=input; };
window.clearDisplay=()=>{ input=""; display.value=""; };

window.calculate=()=>{
    if(input==="0000"){ // secret arcade unlock
        document.getElementById("calculator").style.display="none";
        document.getElementById("arcade").style.display="block";
        input=""; display.value="";
        return;
    }
    try{
        input=eval(input).toString();
        display.value=input;
    } catch{
        display.value="Error";
        input="";
    }
};

// Arcade menu functions
window.showGame=id=>{
    document.querySelectorAll('.game').forEach(g=>g.style.display="none");
    document.getElementById(id).style.display="block";
};

// Clicker Game
let score=Number(localStorage.getItem("score")||0);
document.getElementById("score").innerText=score;
window.addScore=()=>{ score++; localStorage.setItem("score",score); document.getElementById("score").innerText=score; };

// Obby
const oCanvas=document.getElementById("obbyCanvas");
const oCtx=oCanvas.getContext("2d");
const player={x:20,y:150,size:20};
const goal={x:460,y:130,size:30};
document.addEventListener("keydown", e=>{
    if(document.getElementById('obby').style.display!=='block') return;
    if(e.key==="ArrowUp") player.y-=10;
    if(e.key==="ArrowDown") player.y+=10;
    if(e.key==="ArrowLeft") player.x-=10;
    if(e.key==="ArrowRight") player.x+=10;
});
function drawObby(){
    oCtx.clearRect(0,0,500,300);
    oCtx.fillStyle="blue"; oCtx.fillRect(player.x,player.y,player.size,player.size);
    oCtx.fillStyle="green"; oCtx.fillRect(goal.x,goal.y,goal.size,goal.size);
    if(player.x<goal.x+goal.size && player.x+player.size>goal.x &&
       player.y<goal.y+goal.size && player.y+player.size>goal.y){
        alert("You Win!"); player.x=20; player.y=150;
    }
    requestAnimationFrame(drawObby);
}
drawObby();

// Dodge
const dCanvas=document.getElementById("dodgeCanvas");
const dCtx=dCanvas.getContext("2d");
const dPlayer={x:250,y:250,size:20};
let enemy={x:Math.random()*480,y:0,size:20};
document.addEventListener("keydown", e=>{
    if(document.getElementById('dodge').style.display!=='block') return;
    if(e.key==="a") dPlayer.x-=10;
    if(e.key==="d") dPlayer.x+=10;
});
function drawDodge(){
    dCtx.clearRect(0,0,500,300);
    dCtx.fillStyle="white"; dCtx.fillRect(dPlayer.x,dPlayer.y,dPlayer.size,dPlayer.size);
    dCtx.fillStyle="red"; dCtx.fillRect(enemy.x,enemy.y,enemy.size,enemy.size);
    enemy.y+=5;
    if(enemy.y>300){ enemy.y=0; enemy.x=Math.random()*480; }
    if(dPlayer.x<enemy.x+enemy.size && dPlayer.x+dPlayer.size>enemy.x &&
       dPlayer.y<enemy.y+enemy.size && dPlayer.y+dPlayer.size>enemy.y){ alert("Game Over!"); enemy.y=0; }
    requestAnimationFrame(drawDodge);
}
drawDodge();

// Night Survival
let power=100;
window.useDoor=()=>{ 
    if(power<=0){ alert("Power Out! Game Over."); power=100; } 
    else power-=10; 
    document.getElementById("powerText").innerText="Power: "+power+"%"; 
};

// Block Builder
const bCanvas=document.getElementById("buildCanvas");
const bCtx=bCanvas.getContext("2d");
bCanvas.addEventListener("click", e=>{
    const rect=bCanvas.getBoundingClientRect();
    const x=e.clientX-rect.left;
    const y=e.clientY-rect.top;
    bCtx.fillStyle="lime"; bCtx.fillRect(x,y,20,20);
});

// Task Challenge
let tasks=0;
window.completeTask=()=>{
    if(tasks<3){ tasks++; 
        document.getElementById("taskStatus").innerText="Tasks Done: "+tasks+"/3";
        if(tasks===3) alert("All Tasks Complete!");
    }
};
});
</script>
</body>
</html>
