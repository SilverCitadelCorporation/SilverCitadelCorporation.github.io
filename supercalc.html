<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperCalc</title>
<link rel="icon" type="image/png" href="logo.png">

<style>
body{
    margin:0;
    background:#2f2f2f;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial, sans-serif;
}

/* Calculator Body */
.calculator{
    background:#d4d4d4;
    padding:20px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.6);
    width:280px;
}

/* Display */
.display{
    width:100%;
    height:60px;
    background:#1a1a1a;
    color:#00ff88;
    font-size:28px;
    text-align:right;
    padding:10px;
    border-radius:8px;
    margin-bottom:15px;
    border:none;
}

/* Buttons Grid */
.buttons{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:10px;
}

button{
    height:55px;
    font-size:18px;
    border:none;
    border-radius:8px;
    background:#f0f0f0;
    cursor:pointer;
    transition:0.1s;
}

button:active{
    transform:scale(0.95);
}

.operator{
    background:#bdbdbd;
}

.equal{
    background:#ff9500;
    color:white;
}

.clear{
    background:#ff3b30;
    color:white;
}

.zero{
    grid-column: span 2;
}

/* Hidden Arcade */
#arcade{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#111;
    color:white;
    text-align:center;
    overflow:auto;
    padding-top:40px;
}
.arcade-menu button{
    margin:5px;
    padding:10px 20px;
    border-radius:6px;
}
.game{ display:none; margin-top:20px; }
canvas{ border:1px solid white; background:#222; }
</style>
</head>
<body>

<!-- Calculator -->
<div class="calculator" id="calculator">
<input type="text" id="display" class="display" readonly>

<div class="buttons">
<button class="clear" onclick="clearDisplay()">AC</button>
<button class="operator" onclick="press('/')">÷</button>
<button class="operator" onclick="press('*')">×</button>
<button class="operator" onclick="press('-')">−</button>

<button onclick="press('7')">7</button>
<button onclick="press('8')">8</button>
<button onclick="press('9')">9</button>
<button class="operator" onclick="press('+')">+</button>

<button onclick="press('4')">4</button>
<button onclick="press('5')">5</button>
<button onclick="press('6')">6</button>
<button class="equal" onclick="calculate()">=</button>

<button onclick="press('1')">1</button>
<button onclick="press('2')">2</button>
<button onclick="press('3')">3</button>

<button class="zero" onclick="press('0')">0</button>
<button onclick="press('.')">.</button>
</div>
</div>

<!-- Hidden Arcade -->
<div id="arcade">
<h1>🎮 Arcade Unlocked</h1>

<div class="arcade-menu">
<button onclick="showGame('clicker')">Clicker</button>
<button onclick="showGame('obby')">Obby</button>
</div>

<div id="clicker" class="game">
<h2>Clicker</h2>
Score: <span id="score">0</span><br><br>
<button onclick="addScore()">Click</button>
</div>

<div id="obby" class="game">
<h2>Obby</h2>
<canvas id="obbyCanvas" width="500" height="300"></canvas>
<p>Use Arrow Keys</p>
</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", ()=>{

let input="";
const display=document.getElementById("display");

/* Calculator Logic */
window.press=val=>{
    input+=val;
    display.value=input;
};

window.clearDisplay=()=>{
    input="";
    display.value="";
};

window.calculate=()=>{
    if(input==="0000"){  // SECRET CODE
        document.getElementById("calculator").style.display="none";
        document.getElementById("arcade").style.display="block";
        input="";
        display.value="";
        return;
    }

    try{
        input=eval(input).toString();
        display.value=input;
    }catch{
        display.value="Error";
        input="";
    }
};

/* Arcade */
window.showGame=id=>{
    document.querySelectorAll('.game').forEach(g=>g.style.display="none");
    document.getElementById(id).style.display="block";
};

/* Clicker */
let score=0;
document.getElementById("score").innerText=score;
window.addScore=()=>{
    score++;
    document.getElementById("score").innerText=score;
};

/* Simple Obby */
const canvas=document.getElementById("obbyCanvas");
const ctx=canvas.getContext("2d");
const player={x:20,y:150,size:20};
const goal={x:460,y:130,size:30};

document.addEventListener("keydown", e=>{
    if(document.getElementById('obby').style.display!=='block') return;
    if(e.key==="ArrowUp") player.y-=10;
    if(e.key==="ArrowDown") player.y+=10;
    if(e.key==="ArrowLeft") player.x-=10;
    if(e.key==="ArrowRight") player.x+=10;
});

function draw(){
    ctx.clearRect(0,0,500,300);
    ctx.fillStyle="blue";
    ctx.fillRect(player.x,player.y,player.size,player.size);
    ctx.fillStyle="green";
    ctx.fillRect(goal.x,goal.y,goal.size,goal.size);

    if(player.x<goal.x+goal.size &&
       player.x+player.size>goal.x &&
       player.y<goal.y+goal.size &&
       player.y+player.size>goal.y){
        alert("You Win!");
        player.x=20; player.y=150;
    }

    requestAnimationFrame(draw);
}
draw();

});
</script>

</body>
</html>
