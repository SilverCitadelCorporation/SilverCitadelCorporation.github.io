<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Calculator Arcade</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
body { margin:0; font-family:'Arial', sans-serif; background:#e0e0e0; }
header { background:#4a235a; color:#d4af37; text-align:center; padding:15px; font-size:24px; font-weight:bold; }
#arcade { width:90%; max-width:900px; margin:20px auto; }
#tabs { display:flex; justify-content:center; margin-bottom:10px; flex-wrap:wrap; }
#tabs button { margin:5px; flex:1 1 100px; background:#4a235a; color:#d4af37; border:none; border-radius:8px; cursor:pointer; }
#tabs button.active { background:#d4af37; color:#4a235a; }
.game { display:none; width:100%; text-align:center; }
canvas { border:1px solid #000; display:block; margin:auto; background:#111; width:100%; height:300px; }
.message { color:#d4af37; min-height:20px; margin-top:5px; font-weight:bold; text-align:center; }
button { cursor:pointer; margin:5px; padding:10px 20px; border-radius:8px; }
</style>
</head>
<body>

<header>Super Calculator Arcade</header>

<div id="arcade">
    <div id="tabs">
        <button class="active" onclick="showGame('clicker', this)">Clicker</button>
        <button onclick="showGame('obby', this)">Obby</button>
        <button onclick="showGame('dodge', this)">Dodge</button>
        <button onclick="showGame('builder', this)">Block Builder</button>
        <button onclick="showGame('geometry', this)">Geometry Dash</button>
        <button onclick="showGame('minecraft', this)">Eagle Craft</button>
        <button onclick="showGame('roblox', this)">Eagle Obby</button>
    </div>

    <!-- Clicker -->
    <div id="clicker" class="game">
        <h3>Clicker Game</h3>
        <button onclick="addScore()">Click Me!</button>
        <p class="message">Score: <span id="score">0</span></p>
    </div>

    <!-- Obby -->
    <div id="obby" class="game">
        <h3>Obby</h3>
        <canvas id="obbyCanvas" width="500" height="300"></canvas>
        <p class="message" id="obbyMessage"></p>
    </div>

    <!-- Dodge -->
    <div id="dodge" class="game">
        <h3>Dodge</h3>
        <canvas id="dodgeCanvas" width="500" height="300"></canvas>
        <p class="message" id="dodgeMessage"></p>
    </div>

    <!-- Block Builder -->
    <div id="builder" class="game">
        <h3>Block Builder</h3>
        <canvas id="buildCanvas" width="500" height="300"></canvas>
    </div>

    <!-- Geometry Dash -->
    <div id="geometry" class="game">
        <h3>Geometry Dash</h3>
        <canvas id="geomCanvas" width="500" height="300"></canvas>
    </div>

    <!-- Minecraft -->
    <div id="minecraft" class="game">
        <h3>Eagle Craft</h3>
        <canvas id="mcCanvas" width="500" height="300"></canvas>
    </div>

    <!-- Roblox -->
    <div id="roblox" class="game">
        <h3>Eagle Obby</h3>
        <canvas id="rbCanvas" width="500" height="300"></canvas>
    </div>
</div>

<script>
// Tabs
function showGame(id, btn){
    document.querySelectorAll('.game').forEach(g=>g.style.display='none');
    document.getElementById(id).style.display='block';
    document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
}

// Clicker
let score=0;
function addScore(){ score++; document.getElementById("score").innerText=score; }

// Obby
let oCanvas=document.getElementById("obbyCanvas");
let oCtx=oCanvas.getContext("2d");
let player={x:20,y:150,size:20};
let goal={x:460,y:130,size:30};
let obbyMsg=document.getElementById("obbyMessage");
document.addEventListener("keydown",e=>{
    if(document.getElementById('obby').style.display!=='block') return;
    if(e.key==="ArrowUp") player.y-=10;
    if(e.key==="ArrowDown") player.y+=10;
    if(e.key==="ArrowLeft") player.x-=10;
    if(e.key==="ArrowRight") player.x+=10;
});
function drawObby(){
    oCtx.clearRect(0,0,oCanvas.width,oCanvas.height);
    oCtx.fillStyle="blue"; oCtx.fillRect(player.x,player.y,player.size,player.size);
    oCtx.fillStyle="green"; oCtx.fillRect(goal.x,goal.y,goal.size,goal.size);
    if(player.x<goal.x+goal.size && player.x+player.size>goal.x &&
       player.y<goal.y+goal.size && player.y+player.size>goal.y){
        obbyMsg.innerText="You Win!";
        player.x=20; player.y=150;
        setTimeout(()=>{obbyMsg.innerText="";},1500);
    }
    requestAnimationFrame(drawObby);
}
drawObby();

// Dodge
let dCanvas=document.getElementById("dodgeCanvas");
let dCtx=dCanvas.getContext("2d");
let dPlayer={x:250,y:250,size:20};
let enemy={x:Math.random()*480,y:0,size:20};
document.addEventListener("keydown",e=>{
    if(document.getElementById('dodge').style.display!=='block') return;
    if(e.key==="a") dPlayer.x-=10;
    if(e.key==="d") dPlayer.x+=10;
});
function drawDodge(){
    dCtx.clearRect(0,0,dCanvas.width,dCanvas.height);
    dCtx.fillStyle="white"; dCtx.fillRect(dPlayer.x,dPlayer.y,dPlayer.size,dPlayer.size);
    dCtx.fillStyle="red"; dCtx.fillRect(enemy.x,enemy.y,enemy.size,enemy.size);
    enemy.y+=5;
    if(enemy.y>300){ enemy.y=0; enemy.x=Math.random()*480; }
    if(dPlayer.x < enemy.x+enemy.size && dPlayer.x+dPlayer.size > enemy.x &&
       dPlayer.y < enemy.y+enemy.size && dPlayer.y+dPlayer.size > enemy.y){
        dPlayer.x=250; dPlayer.y=250;
        enemy.y=0;
    }
    requestAnimationFrame(drawDodge);
}
drawDodge();

// Block Builder
let bCanvas=document.getElementById("buildCanvas");
let bCtx=bCanvas.getContext("2d");
bCanvas.addEventListener("click", e=>{
    let rect=bCanvas.getBoundingClientRect();
    let x=e.clientX-rect.left;
    let y=e.clientY-rect.top;
    bCtx.fillStyle="lime";
    bCtx.fillRect(x,y,20,20);
});

// Geometry Dash
let gCanvas=document.getElementById("geomCanvas");
let gCtx=gCanvas.getContext("2d");
let gPlayer={x:50,y:260,width:20,height:20,vy:0};
let gObstacles=[];
let gravity=0.8;
let speed=3;
function spawnObstacle(){ gObstacles.push({x:500,y:260,width:20,height:40}); }
setInterval(spawnObstacle,1500);
document.addEventListener("keydown",e=>{
    if(document.getElementById('geometry').style.display!=='block') return;
    if(e.key===" ") gPlayer.vy=-12;
});
function drawGeom(){
    gCtx.clearRect(0,0,gCanvas.width,gCanvas.height);
    gPlayer.vy+=gravity; gPlayer.y+=gPlayer.vy;
    if(gPlayer.y>280) gPlayer.y=280;
    gCtx.fillStyle="yellow"; gCtx.fillRect(gPlayer.x,gPlayer.y,gPlayer.width,gPlayer.height);
    for(let obs of gObstacles){
        obs.x-=speed;
        gCtx.fillStyle="red"; gCtx.fillRect(obs.x,obs.y,obs.width,obs.height);
        if(gPlayer.x < obs.x+obs.width && gPlayer.x+gPlayer.width > obs.x &&
           gPlayer.y < obs.y+obs.height && gPlayer.y+gPlayer.height > obs.y){
               gPlayer.x=50; gPlayer.y=260; gPlayer.vy=0; gObstacles=[];
        }
    }
    requestAnimationFrame(drawGeom);
}
drawGeom();

// Minecraft / Eagle Craft
let mcCanvas=document.getElementById("mcCanvas");
let mcCtx=mcCanvas.getContext("2d");
let mcBlocks=[];
mcCanvas.addEventListener("click",e=>{
    let rect=mcCanvas.getBoundingClientRect();
    let x=e.clientX-rect.left;
    let y=e.clientY-rect.top;
    mcCtx.fillStyle="green";
    mcCtx.fillRect(x-10,y-10,20,20);
    mcBlocks.push({x:x-10,y:y-10});
});

// Roblox / Eagle Obby
let rbCanvas=document.getElementById("rbCanvas");
let rbCtx=rbCanvas.getContext("2d");
let rbPlayer={x:50,y:260,width:20,height:20,vy:0};
let rbPlatforms=[{x:0,y:280,width:500,height:20}];
document.addEventListener("keydown",e=>{
    if(document.getElementById('roblox').style.display!=='block') return;
    if(e.key===" ") rbPlayer.vy=-12;
    if(e.key==="ArrowLeft") rbPlayer.x-=5;
    if(e.key==="ArrowRight") rbPlayer.x+=5;
});
function drawRoblox(){
    rbCtx.clearRect(0,0,rbCanvas.width,rbCanvas.height);
    rbPlayer.vy+=gravity; rbPlayer.y+=rbPlayer.vy;
    if(rbPlayer.y>280) rbPlayer.y=280;
    rbCtx.fillStyle="blue"; rbCtx.fillRect(rbPlayer.x,rbPlayer.y,rbPlayer.width,rbPlayer.height);
    for(let p of rbPlatforms){
        rbCtx.fillStyle="orange"; rbCtx.fillRect(p.x,p.y,p.width,p.height);
        if(rbPlayer.x < p.x+p.width && rbPlayer.x+rbPlayer.width > p.x &&
           rbPlayer.y+rbPlayer.height>p.y && rbPlayer.y+rbPlayer.height<p.y+p.height){
            rbPlayer.vy=0;
            rbPlayer.y=p.y-rbPlayer.height;
        }
    }
    requestAnimationFrame(drawRoblox);
}
drawRoblox();

// Start first tab
showGame('clicker', document.querySelector('#tabs button'));
</script>
</body>
</html>
