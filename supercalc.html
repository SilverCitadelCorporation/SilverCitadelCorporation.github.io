<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperCalc</title>
<style>
body{
    margin:0;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial,sans-serif;
}
#calculator{
    width:340px;
    background:#2c2c2c;
    padding:25px;
    border-radius:25px;
    box-shadow:0 15px 50px rgba(0,0,0,0.7);
}
#display{
    width:100%;
    height:70px;
    font-size:36px;
    text-align:right;
    padding:15px;
    border:none;
    border-radius:15px;
    margin-bottom:20px;
    background:#0d0d0d;
    color:#00ff99;
    box-sizing:border-box;
}
.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}
button{
    height:60px;
    font-size:22px;
    border:none;
    border-radius:12px;
    background:#3a3a3a;
    color:white;
    cursor:pointer;
    transition:0.15s;
}
button:hover{ background:#4a4a4a; }
.operator{ background:#ff9500; }
.operator:hover{ background:#ffaa33; }
.equal{ background:#00c853; }
.equal:hover{ background:#00e676; }
.zero{ grid-column: span 2; }
#arcade{
    display:none;
    position:fixed;
    inset:0;
    background:black;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    flex-direction: column;
}
</style>
</head>

<body>
<div id="calculator">
    <input id="display" readonly>
    <div class="buttons">
        <button onclick="clearDisplay()">C</button>
        <button class="operator" onclick="press('/')">÷</button>
        <button class="operator" onclick="press('*')">×</button>
        <button class="operator" onclick="press('-')">−</button>

        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button class="operator" onclick="press('+')">+</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button class="equal" onclick="calculate()">=</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="press('.')">.</button>

        <button onclick="press('0')" class="zero">0</button>
    </div>
</div>

<div id="arcade">
    <h1>🎮 Arcade Unlocked!</h1>
    <p>Enjoy your secret games.</p>
</div>

<script>
let input = "";

function press(val){
    input += val;
    document.getElementById("display").value = input;
}

function clearDisplay(){
    input = "";
    document.getElementById("display").value = "";
}

function calculate(){
    // Only unlock arcade if user presses "="
    if(input === "0000"){
        document.getElementById("calculator").style.display = "none";
        document.getElementById("arcade").style.display = "flex";
        input = "";
        document.getElementById("display").value = "";
        return;
    }

    try{
        input = eval(input).toString();
        document.getElementById("display").value = input;
    }catch{
        document.getElementById("display").value = "Error";
        input = "";
    }
}

document.addEventListener("keydown", function(e){
    if(e.key === "Enter") calculate();
});
</script>
</body>
</html>
