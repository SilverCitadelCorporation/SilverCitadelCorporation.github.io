<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Calculator</title>
<link rel="icon" type="image/png" href="logo.png">

<style>
body {
    margin:0;
    font-family:'Arial', sans-serif;
    background:#f0f0f0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

#calculator{
    width:320px;
    background:#fff;
    padding:20px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

#display{
    width:100%;
    height:60px;
    font-size:28px;
    text-align:right;
    padding:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button.calc-btn{
    height:55px;
    font-size:20px;
    border:none;
    border-radius:8px;
    background:#e0e0e0;
    cursor:pointer;
    transition:0.15s;
}

button.calc-btn:hover{ background:#d0d0d0; }
.operator{ background:#f9a825; color:#fff; }
.operator:hover{ background:#fbc02d; }
.equal{ background:#43a047; color:#fff; }
.equal:hover{ background:#66bb6a; }
.zero{ grid-column: span 2; }
</style>
</head>

<body>

<div id="calculator">
    <input id="display" readonly placeholder="Enter numbers">
    <div class="buttons">
        <button class="calc-btn" onclick="clearDisplay()">C</button>
        <button class="calc-btn operator" onclick="press('/')">÷</button>
        <button class="calc-btn operator" onclick="press('*')">×</button>
        <button class="calc-btn operator" onclick="press('-')">−</button>

        <button class="calc-btn" onclick="press('7')">7</button>
        <button class="calc-btn" onclick="press('8')">8</button>
        <button class="calc-btn" onclick="press('9')">9</button>
        <button class="calc-btn operator" onclick="press('+')">+</button>

        <button class="calc-btn" onclick="press('4')">4</button>
        <button class="calc-btn" onclick="press('5')">5</button>
        <button class="calc-btn" onclick="press('6')">6</button>
        <button class="calc-btn equal" onclick="calculate()">=</button>

        <button class="calc-btn" onclick="press('1')">1</button>
        <button class="calc-btn" onclick="press('2')">2</button>
        <button class="calc-btn" onclick="press('3')">3</button>
        <button class="calc-btn" onclick="press('.')">.</button>

        <button class="calc-btn zero" onclick="press('0')">0</button>
    </div>
</div>

<script>
// --- Calculator logic ---
let input = "";
function press(val){
    input += val;
    document.getElementById("display").value = input;
}

function clearDisplay(){
    input="";
    document.getElementById("display").value="";
}

function calculate(){
    if(input === "0000"){ // secret code unlocks arcade
        window.location.href="arcade.html"; // hidden arcade page
        input="";
        return;
    }
    try{
        input = eval(input).toString();
        document.getElementById("display").value = input;
    } catch{
        document.getElementById("display").value="Error";
        input="";
    }
}
</script>

</body>
</html>
