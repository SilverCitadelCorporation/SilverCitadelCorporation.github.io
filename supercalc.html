<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Resource Hub</title>
<style>
body {
  margin: 0;
  font-family: Arial;
  background: #e0e0e0;
}
header {
  background: #2c3e50;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 24px;
}
#menu {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 20px;
  padding: 20px;
  max-width: 900px;
  margin: auto;
}
.gameCard {
  background: white;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: 0.2s;
}
.gameCard:hover {
  transform: scale(1.05);
}
#player {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  z-index: 1000;
}
iframe {
  width: 100%;
  height: 100%;
  border: none;
}
#closeBtn {
  position: absolute;
  top: 10px;
  right: 20px;
  font-size: 20px;
  background: red;
  color: white;
  border: none;
  padding: 10px;
  cursor: pointer;
}
#reportBtn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 12px 20px;
  background: #f39c12;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  transition: 0.2s;
}
#reportBtn:hover { background: #e67e22; }
</style>
</head>

<body>

<header>Student Resource Hub</header>

<div id="menu">

  <div class="gameCard" onclick="openGame('games/snake/index.html')">Snake</div>
  <div class="gameCard" onclick="openGame('games/2048/index.html')">2048</div>
  <div class="gameCard" onclick="openGame('flappyInternal')">Flappy Bird</div>
  <div class="gameCard" onclick="openGame('games/tetris/index.html')">Tetris</div>
  <div class="gameCard" onclick="openGame('games/pacman/index.html')">Pac‑Man</div>
  <div class="gameCard" onclick="openGame('games/slope/index.html')">Slope</div>
  <div class="gameCard" onclick="openGame('games/geometry-dash/index.html')">Geometry Dash</div>
  <div class="gameCard" onclick="openGame('games/eaglecraft.html')">Block Builder</div>
  <div class="gameCard" onclick="openGame('games/algebra-night.html')">Algebra Night</div>

</div>

<div id="player">
  <button id="closeBtn" onclick="closeGame()">X</button>
  <iframe id="gameFrame"></iframe>
  <canvas id="flappyCanvas" width="400" height="600" style="display:none; margin:auto; background:#70c5ce;"></canvas>
  <div id="flappyScore" style="position:absolute; top:10px; left:50%; transform:translateX(-50%); font-size:24px; color:white; text-shadow:2px 2px 4px #000;"></div>
</div>

<button id="reportBtn" onclick="reportBug()">Report a Bug</button>

<script>
// Open game or internal Flappy
function openGame(url){
  document.getElementById("player").style.display="block";
  if(url === "flappyInternal"){
    document.getElementById("gameFrame").style.display="none";
    document.getElementById("flappyCanvas").style.display="block";
    document.getElementById("flappyScore").innerText="Score: 0";
    startFlappy();
  } else {
    document.getElementById("gameFrame").style.display="block";
    document.getElementById("flappyCanvas").style.display="none";
    document.getElementById("gameFrame").src = url;
  }
}

function closeGame(){
  document.getElementById("player").style.display="none";
  document.getElementById("gameFrame").src = "";
  document.getElementById("flappyCanvas").style.display="none";
  cancelAnimationFrame(flappyFrame);
}

// Report bug
function reportBug(){
  window.location.href="mailto:silvercitadelcorporation@gmail.com?subject=Bug Report from Student Hub&body=Describe the issue here...";
}

// ===== Simple Flappy Bird inside hub =====
let flappyFrame;
function startFlappy(){
  const canvas = document.getElementById('flappyCanvas');
  const ctx = canvas.getContext('2d');
  let bird = { x:50, y:300, w:30, h:30, v:0 };
  const gravity = 0.6;
  const jump = -10;
  const pipes = [];
  const pipeWidth = 50;
  const pipeGap = 150;
  let frame = 0;
  let score = 0;
  let gameOver = false;

  function loop(){
    if(gameOver){ drawGameOver(); return; }
    ctx.clearRect(0,0,canvas.width,canvas.height);
    frame++;

    // Bird
    bird.v += gravity;
    bird.y += bird.v;
    ctx.fillStyle='yellow';
    ctx.fillRect(bird.x,bird.y,bird.w,bird.h);

    // Pipes
    if(frame % 90 === 0){
      const topH = Math.random() * (canvas.height - pipeGap - 50) + 50;
      pipes.push({ x:canvas.width, topH, passed:false });
    }

    for(let i=0;i<pipes.length;i++){
      const p = pipes[i];
      p.x -= 2;
      ctx.fillStyle='green';
      ctx.fillRect(p.x,0,pipeWidth,p.topH);
      ctx.fillRect(p.x,p.topH+pipeGap,pipeWidth,canvas.height-p.topH-pipeGap);

      // Collision
      if(bird.x < p.x+pipeWidth && bird.x+bird.w>p.x && (bird.y < p.topH || bird.y+bird.h > p.topH+pipeGap)){
        gameOver=true;
      }

      // Score
      if(!p.passed && p.x+pipeWidth<bird.x){ score++; p.passed=true; }
    }

    // Floor & ceiling
    if(bird.y + bird.h>canvas.height || bird.y<0){ gameOver=true; }

    document.getElementById('flappyScore').innerText='Score: '+score;
    flappyFrame = requestAnimationFrame(loop);
  }

  function drawGameOver(){
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='white';
    ctx.font='36px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('Game Over', canvas.width/2, canvas.height/2-20);
    ctx.font='24px sans-serif';
    ctx.fillText('Score: '+score, canvas.width/2, canvas.height/2+20);
    ctx.fillText('Click or Space to Restart', canvas.width/2, canvas.height/2+60);
    document.addEventListener('keydown', restartHandler);
    document.addEventListener('click', restartHandler);
  }

  function restartHandler(){
    document.removeEventListener('keydown', restartHandler);
    document.removeEventListener('click', restartHandler);
    bird={ x:50, y:300, w:30, h:30, v:0 };
    pipes.length=0; score=0; gameOver=false; frame=0;
    loop();
  }

  document.addEventListener('keydown', e=>{ if(e.code==='Space'){ bird.v=jump; } });
  document.addEventListener('click', e=>{ bird.v=jump; });
  loop();
}
</script>

</body>
</html>
