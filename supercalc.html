<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Resource Hub</title>
<style>
body{margin:0;font-family:Arial;background:#e0e0e0;}
header{background:#2c3e50;color:white;padding:15px;text-align:center;font-size:24px;}
#menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;padding:20px;max-width:900px;margin:auto;}
.gameCard{background:white;padding:20px;border-radius:10px;text-align:center;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.2);transition:0.2s;}
.gameCard:hover{transform:scale(1.05);}
#player{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:black;z-index:1000;}
iframe{width:100%;height:100%;border:none;}
#closeBtn{position:absolute;top:10px;right:20px;font-size:20px;background:red;color:white;border:none;padding:10px;cursor:pointer;}
#reportBtn{position:fixed;bottom:20px;right:20px;padding:12px 20px;background:#f39c12;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer;box-shadow:0 4px 6px rgba(0,0,0,0.3);transition:0.2s;}
#reportBtn:hover{background:#e67e22;}
</style>
</head>
<body>

<header>Student Resource Hub</header>

<div id="menu">
  <div class="gameCard" onclick="openGame('games/snake/index.html')">Snake</div>
  <div class="gameCard" onclick="openGame('games/flappy-bird.html')">Flappy Bird</div>
  <div class="gameCard" onclick="openGame('games/pack-man.html')">Pac‑Man</div>
  <div class="gameCard" onclick="openGame('games/2048/index.html')">2048</div>
  <div class="gameCard" onclick="openGame('games/tetris/index.html')">Tetris</div>
  <div class="gameCard" onclick="openGame('games/pacman/index.html')">Pac‑Man Classic</div>
  <div class="gameCard" onclick="openGame('games/slope/index.html')">Slope</div>
  <div class="gameCard" onclick="openGame('games/geometry-dash/index.html')">Geometry Dash</div>
  <div class="gameCard" onclick="openGame('games/eaglecraft.html')">Block Builder</div>
  <div class="gameCard" onclick="openGame('games/algebra-night.html')">Algebra Night</div>
</div>

<div id="player">
  <button id="closeBtn" onclick="closeGame()">X</button>
  <iframe id="gameFrame"></iframe>
</div>

<button id="reportBtn" onclick="reportBug()">Report a Bug</button>

<script>
function openGame(url){
  const iframe = document.getElementById("gameFrame");
  document.getElementById("player").style.display="block";
  iframe.src=url;
  
  // Focus the iframe to receive key events
  iframe.contentWindow.focus();
}
function closeGame(){
  document.getElementById("player").style.display="none";
  document.getElementById("gameFrame").src="";
}
function reportBug(){
  window.location.href="mailto:silvercitadelcorporation@gmail.com?subject=Bug Report from Student Hub&body=Describe the issue here...";
}
</script>

</body>
</html>
