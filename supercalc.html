<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SuperCalc | Student Math Tool</title>
<link rel="icon" href="logo.png">

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#eef2f7;
}

/* SCHOOL HEADER */

.header{
background:#2c3e50;
color:white;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.sub{
font-size:13px;
opacity:.8;
}

/* MAIN AREA */

.container{
display:flex;
justify-content:center;
align-items:center;
height:85vh;
}

/* CALCULATOR */

#calculator{
background:white;
width:340px;
padding:20px;
border-radius:12px;
box-shadow:0 8px 25px rgba(0,0,0,0.15);
}

/* DISPLAY */

#display{
width:100%;
height:60px;
font-size:30px;
text-align:right;
padding:10px;
border:2px solid #d0d6e0;
border-radius:8px;
margin-bottom:15px;
box-sizing:border-box;
}

/* BUTTON GRID */

.buttons{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

button{
height:55px;
font-size:18px;
border:none;
border-radius:8px;
background:#e4e8ef;
cursor:pointer;
}

button:hover{
background:#d6dbe5;
}

.operator{
background:#bfc9d9;
}

.equals{
background:#4a90e2;
color:white;
}

.equals:hover{
background:#3c7ed0;
}

.clear{
background:#ff7675;
color:white;
}

.clear:hover{
background:#e05d5c;
}

</style>
</head>

<body>

<div class="header">
SuperCalc Student Tool
<div class="sub">Educational Mathematics Calculator</div>
</div>

<div class="container">

<div id="calculator">

<input id="display" disabled>

<div class="buttons">

<button onclick="press('7')">7</button>
<button onclick="press('8')">8</button>
<button onclick="press('9')">9</button>
<button class="operator" onclick="press('/')">÷</button>

<button onclick="press('4')">4</button>
<button onclick="press('5')">5</button>
<button onclick="press('6')">6</button>
<button class="operator" onclick="press('*')">×</button>

<button onclick="press('1')">1</button>
<button onclick="press('2')">2</button>
<button onclick="press('3')">3</button>
<button class="operator" onclick="press('-')">−</button>

<button onclick="press('0')">0</button>
<button onclick="press('.')">.</button>
<button class="equals" onclick="calculate()">=</button>
<button class="operator" onclick="press('+')">+</button>

<button class="clear" onclick="clearDisplay()" style="grid-column:span 4;">Clear</button>

</div>

</div>
</div>

<script>

let display = document.getElementById("display")

function press(val){
display.value += val
}

function clearDisplay(){
display.value=""
}

function calculate(){

/* SECRET CODE */
if(display.value === "0000"){
window.location.href="supercalculator.html"
return
}

try{
display.value = eval(display.value)
}
catch{
display.value="Error"
}

}

</script>

</body>
</html>
