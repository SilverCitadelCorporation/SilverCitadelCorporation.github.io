<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Resource Hub</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#e0e0e0;
}

header{
  background:#2c3e50;
  color:white;
  padding:15px;
  text-align:center;
  font-size:24px;
}

#menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:20px;
  padding:20px;
  max-width:900px;
  margin:auto;
}

.gameCard{
  background:white;
  padding:20px;
  border-radius:10px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
  transition:0.2s;
}

.gameCard:hover{
  transform:scale(1.05);
}

#player{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  z-index:1000;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

#closeBtn{
  position:absolute;
  top:10px;
  right:20px;
  font-size:20px;
  background:red;
  color:white;
  border:none;
  padding:10px;
  cursor:pointer;
}

/* Report Button */
#reportBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  padding:12px 20px;
  background:#f39c12;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 4px 6px rgba(0,0,0,0.3);
  transition:0.2s;
}
#reportBtn:hover{
  background:#e67e22;
}
</style>
</head>

<body>

<header>Student Resource Hub</header>

<div id="menu">

  <!-- Local games open inside iframe -->
  <div class="gameCard" onclick="openGame('games/snake.html')">Snake</div>
  <div class="gameCard" onclick="openGame('games/runner.html')">Runner</div>
  <div class="gameCard" onclick="openGame('games/eaglecraft.html')">Block Builder (Eaglecraft)</div>
  <div class="gameCard" onclick="openGame('games/algebra-night.html')">Algebra Night (FNAF)</div>

  <!-- Online games open in new tab -->
  <div class="gameCard" onclick="window.open('https://ubg365.github.io/geometry-dash/', '_blank')">Geometry Dash</div>
  <div class="gameCard" onclick="window.open('https://ubg365.github.io/slope/', '_blank')">Slope</div>
  <div class="gameCard" onclick="window.open('https://ubg365.github.io/flappy-bird/', '_blank')">Flappy Bird</div>
  <div class="gameCard" onclick="window.open('https://ubg365.github.io/tetris/', '_blank')">Tetris</div>
  <div class="gameCard" onclick="window.open('https://ubg365.github.io/2048/', '_blank')">2048</div>
  <div class="gameCard" onclick="window.open('https://ubg365.github.io/pacman/', '_blank')">Pac-Man</div>

</div>

<!-- iframe player for local games -->
<div id="player">
  <button id="closeBtn" onclick="closeGame()">X</button>
  <iframe id="gameFrame"></iframe>
</div>

<!-- Report / Contact Bug Button -->
<button id="reportBtn" onclick="reportBug()">Report a Bug</button>

<script>
function openGame(url){
  document.getElementById("player").style.display="block";
  document.getElementById("gameFrame").src=url;
}

function closeGame(){
  document.getElementById("player").style.display="none";
  document.getElementById("gameFrame").src="";
}

// Report bug function
function reportBug(){
  window.location.href="mailto:silvercitadelcorporation@gmail.com?subject=Bug Report from Student Hub&body=Describe the issue here...";
}
</script>

</body>
</html>
