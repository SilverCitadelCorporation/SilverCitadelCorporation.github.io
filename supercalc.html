<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Resource Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial;
background:#e0e0e0;
transition:.3s;
}

.dark{
background:#121212;
color:white;
}

header{
background:#2c3e50;
color:white;
padding:15px;
text-align:center;
font-size:24px;
}

#menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:20px;
padding:20px;
max-width:1000px;
margin:auto;
}

.gameCard{
background:white;
padding:10px;
border-radius:10px;
text-align:center;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
transition:.2s;
}

.dark .gameCard{
background:#1e1e1e;
}

.gameCard:hover{
transform:scale(1.05);
}

.gameCard img{
width:100%;
border-radius:8px;
}

#player{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
z-index:1000;
}

iframe{
width:100%;
height:100%;
border:none;
}

#closeBtn{
position:absolute;
top:10px;
right:20px;
font-size:20px;
background:red;
color:white;
border:none;
padding:10px;
cursor:pointer;
border-radius:6px;
}

#reportBtn{
position:fixed;
bottom:20px;
right:20px;
padding:12px 20px;
background:#f39c12;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

#darkBtn{
position:fixed;
bottom:20px;
left:20px;
padding:12px 20px;
background:#34495e;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

#studentBtn{
position:fixed;
top:20px;
left:20px;
background:red;
color:white;
border:none;
padding:12px 20px;
font-size:16px;
border-radius:8px;
cursor:pointer;
}

</style>
</head>

<body>

<header id="title">Student Resource Hub</header>

<button id="studentBtn" onclick="studentMode()">Student Mode</button>

<div id="menu">

<div class="gameCard" onclick="openGame('games/snake.html')">
<img src="https://i.imgur.com/1X4J8yN.png">
Snake
</div>

<div class="gameCard" onclick="openGame('games/flappy-bird.html')">
<img src="https://i.imgur.com/8Q1Z4qM.png">
Flappy Bird
</div>

<div class="gameCard" onclick="openGame('games/pack-man.html')">
<img src="https://i.imgur.com/t9qH3VN.png">
Pac-Man
</div>

</div>

<div id="player">
<button id="closeBtn" onclick="closeGame()">X</button>
<iframe id="gameFrame" tabindex="0"></iframe>
</div>

<button id="reportBtn" onclick="reportBug()">Report Bug</button>
<button id="darkBtn" onclick="toggleDark()">Dark Mode</button>

<audio id="clickSound">
<source src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3">
</audio>

<script>

function openGame(url){

document.getElementById("clickSound").play()

const iframe=document.getElementById("gameFrame")

document.getElementById("player").style.display="block"

iframe.src=url

setTimeout(()=>{
iframe.focus()
},200)

}

function closeGame(){

document.getElementById("player").style.display="none"

document.getElementById("gameFrame").src=""

}

function reportBug(){

window.location.href="mailto:silvercitadelcorporation@gmail.com?subject=Bug Report"

}

function toggleDark(){

document.body.classList.toggle("dark")

}

function studentMode(){

document.getElementById("title").innerText="Student Learning Portal"

document.getElementById("menu").innerHTML=`

<div class="gameCard">Algebra Practice</div>
<div class="gameCard">Reading Tools</div>
<div class="gameCard">Science Simulations</div>
<div class="gameCard">Geometry Practice</div>

`

}

</script>

</body>
</html>
