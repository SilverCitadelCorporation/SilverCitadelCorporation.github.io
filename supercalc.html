<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Calculator</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
body {
    margin:0;
    font-family:'Arial', sans-serif;
    background:#f0f0f0;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

#calculator, #arcade {
    width:350px;
    background:#fff;
    padding:20px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

#display {
    width:100%;
    height:60px;
    font-size:28px;
    text-align:right;
    padding:10px;
    margin-bottom:10px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button {
    width:70px;
    height:50px;
    font-size:20px;
    margin:5px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    transition:0.2s;
}

button:hover {
    background:#4a235a;
    color:#f0f0f0;
}

#arcade {
    display:none;
    width:800px;
    max-width:95%;
    height:600px;
    overflow:auto;
    background:black;
    color:#fff;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

/* Arcade game containers */
.game { display:none; margin-top:20px; }
#obbyCanvas, #dodgeCanvas, #buildCanvas { border:2px solid #fff; background:#111; }
</style>
</head>
<body>

<!-- Calculator -->
<div id="calculator">
    <input type="text" id="display" readonly>
    <div>
        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button onclick="clearDisplay()">C</button>
    </div>
    <div>
        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('+')">+</button>
    </div>
    <div>
        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="press('-')">-</button>
    </div>
    <div>
        <button onclick="press('0')">0</button>
        <button onclick="press('.')">.</button>
        <button onclick="unlock()">=</button>
        <button onclick="press('*')">*</button>
    </div>
</div>

<!-- Arcade Hub -->
<div id="arcade">
    <h1 style="color:#0f0;">Welcome to the Secret Arcade!</h1>
    <div>
        <button onclick="showGame('clicker')">Clicker</button>
        <button onclick="showGame('obby')">Obby</button>
        <button onclick="showGame('dodge')">Dodge</button>
        <button onclick="showGame('night')">Night Survival</button>
        <button onclick="showGame('builder')">Block Builder</button>
        <button onclick="showGame('tasks')">Tasks</button>
        <button onclick="showGame('geometry')">Geometry Puzzle</button>
    </div>

    <!-- Clicker Game -->
    <div id="clicker" class="game">
        <h2>Clicker Game</h2>
        <button onclick="addScore()">Click Me!</button>
        <p>Score: <span id="score">0</span></p>
    </div>

    <!-- Obby Game -->
    <div id="obby" class="game">
        <h2>Obby</h2>
        <canvas id="obbyCanvas" width="500" height="300"></canvas>
        <p>Use arrow keys to reach the green goal!</p>
    </div>

    <!-- Dodge Game -->
    <div id="dodge" class="game">
        <h2>Dodge</h2>
        <canvas id="dodgeCanvas" width="500" height="300"></canvas>
        <p>Use "A" and "D" to move!</p>
    </div>

    <!-- Night Survival -->
    <div id="night" class="game">
        <h2>Night Survival</h2>
        <p id="powerText">Power: 100%</p>
        <button onclick="useDoor()">Use Door</button>
    </div>

    <!-- Block Builder -->
    <div id="builder" class="game">
        <h2>Block Builder</h2>
        <canvas id="buildCanvas" width="500" height="300"></canvas>
        <p>Click to place blocks!</p>
    </div>

    <!-- Tasks -->
    <div id="tasks" class="game">
        <h2>Tasks Mini-Game</h2>
        <button onclick="completeTask()">Complete Task</button>
        <p id="taskStatus">Tasks Done: 0/3</p>
    </div>

    <!-- Geometry Puzzle -->
    <div id="geometry" class="game">
        <h2>Geometry Puzzle</h2>
        <p id="geomQuestion"></p>
        <input type="number" id="geomAnswer" placeholder="Your answer">
        <button onclick="checkGeom()">Submit</button>
        <p id="geomFeedback"></p>
    </div>
</div>

<script>
// --- Calculator logic ---
let input = "";
let display = document.getElementById("display");

function press(val){
    input += val;
    display.value = input;
}
function clearDisplay(){
    input = "";
    display.value = "";
}
function unlock(){
    if(input === "0000"){
        document.getElementById("calculator").style.display="none";
        document.getElementById("arcade").style.display="block";
        startGames();
    } else {
        try{
            input = eval(input).toString();
            display.value = input;
        } catch{
            display.value="Error";
            input="";
        }
    }
}

// --- Arcade Menu ---
function showGame(id){
    document.querySelectorAll('.game').forEach(g => g.style.display="none");
    document.getElementById(id).style.display="block";
}

// --- Clicker Game ---
let score = 0;
document.getElementById("score").innerText = score;
function addScore(){
    score++;
    document.getElementById("score").innerText = score;
}

// --- Obby Game ---
let oCanvas = document.getElementById("obbyCanvas");
let oCtx = oCanvas.getContext("2d");
let player = {x:20,y:150,size:20};
let goal = {x:460,y:130,size:30};
function drawObby(){
    oCtx.clearRect(0,0,oCanvas.width,oCanvas.height);
    oCtx.fillStyle="blue";
    oCtx.fillRect(player.x,player.y,player.size,player.size);
    oCtx.fillStyle="green";
    oCtx.fillRect(goal.x,goal.y,goal.size,goal.size);
    if(player.x < goal.x+goal.size &&
       player.x+player.size > goal.x &&
       player.y < goal.y+goal.size &&
       player.y+player.size > goal.y){
        alert("You Win!");
        player.x=20; player.y=150;
    }
    requestAnimationFrame(drawObby);
}
document.addEventListener("keydown", e=>{
    if(document.getElementById('obby').style.display!=='block') return;
    if(e.key==="ArrowUp") player.y-=10;
    if(e.key==="ArrowDown") player.y+=10;
    if(e.key==="ArrowLeft") player.x-=10;
    if(e.key==="ArrowRight") player.x+=10;
});
drawObby();

// --- Dodge Game ---
let dCanvas = document.getElementById("dodgeCanvas");
let dCtx = dCanvas.getContext("2d");
let dPlayer = {x:250,y:250,size:20};
let enemy = {x:Math.random()*480,y:0,size:20};
function drawDodge(){
    dCtx.clearRect(0,0,dCanvas.width,dCanvas.height);
    dCtx.fillStyle="white";
    dCtx.fillRect(dPlayer.x,dPlayer.y,dPlayer.size,dPlayer.size);
    dCtx.fillStyle="red";
    dCtx.fillRect(enemy.x,enemy.y,enemy.size,enemy.size);
    enemy.y+=5;
    if(enemy.y>300){
        enemy.y=0;
        enemy.x=Math.random()*480;
    }
    if(dPlayer.x < enemy.x+enemy.size &&
       dPlayer.x+dPlayer.size > enemy.x &&
       dPlayer.y < enemy.y+enemy.size &&
       dPlayer.y+dPlayer.size > enemy.y){
        alert("Game Over!");
        enemy.y=0;
    }
    requestAnimationFrame(drawDodge);
}
document.addEventListener("keydown", e=>{
    if(document.getElementById('dodge').style.display!=='block') return;
    if(e.key==="a") dPlayer.x-=10;
    if(e.key==="d") dPlayer.x+=10;
});
drawDodge();

// --- Night Survival ---
let power = 100;
function useDoor(){
    if(power<=0){ alert("Power Out! Game Over."); power=100; }
    else power-=10;
    document.getElementById("powerText").innerText = "Power: "+power+"%";
}

// --- Block Builder ---
let bCanvas = document.getElementById("buildCanvas");
let bCtx = bCanvas.getContext("2d");
bCanvas.addEventListener("click", e=>{
    let rect = bCanvas.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;
    bCtx.fillStyle="lime";
    bCtx.fillRect(x,y,20,20);
});

// --- Task System ---
let tasks = 0;
function completeTask(){
    if(tasks<3){
        tasks++;
        document.getElementById("taskStatus").innerText = "Tasks Done: "+tasks+"/3";
    }
}

// --- Geometry Puzzle ---
let geomQuestionElem = document.getElementById("geomQuestion");
let geomFeedbackElem = document.getElementById("geomFeedback");
let geomAnswerElem = document.getElementById("geomAnswer");
let currentGeomAnswer = 0;
function generateGeom(){
    let a = Math.floor(Math.random()*10)+1;
    let b = Math.floor(Math.random()*10)+1;
    currentGeomAnswer = a*b;
    geomQuestionElem.innerText = `What is ${a} × ${b}?`;
}
function checkGeom(){
    if(parseInt(geomAnswerElem.value)===currentGeomAnswer){
        geomFeedbackElem.innerText="Correct!";
    } else {
        geomFeedbackElem.innerText=`Wrong! Answer was ${currentGeomAnswer}`;
    }
    geomAnswerElem.value="";
    generateGeom();
}

// --- Start all games when arcade opens ---
function startGames(){
    showGame('clicker');
    generateGeom();
}
</script>
</body>
</html>
