<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperCalc - Student Calculator</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

#calc{
margin-top:100px;
}

input{
width:300px;
padding:10px;
font-size:18px;
}

button{
padding:10px 20px;
margin:5px;
font-size:16px;
cursor:pointer;
}

#secretRoom{
display:none;
background:black;
color:#d4af37;
min-height:100vh;
padding-top:40px;
}

.gameCard{
background:#111;
padding:20px;
margin:15px;
display:inline-block;
border:1px solid #d4af37;
cursor:pointer;
}
canvas{
display:none;
margin:auto;
background:black;
border:3px solid gold;
}
#panic{
position:fixed;
top:10px;
right:10px;
background:red;
color:white;
border:none;
padding:5px 10px;
display:none;
}
</style>
</head>
<body>

<div id="calc">
<h1>SuperCalc</h1>
<p>Academic Calculator Tool</p>

<input type="text" id="display" readonly><br>

<button onclick="press('7')">7</button>
<button onclick="press('8')">8</button>
<button onclick="press('9')">9</button>
<button onclick="press('/')">÷</button><br>

<button onclick="press('4')">4</button>
<button onclick="press('5')">5</button>
<button onclick="press('6')">6</button>
<button onclick="press('*')">×</button><br>

<button onclick="press('1')">1</button>
<button onclick="press('2')">2</button>
<button onclick="press('3')">3</button>
<button onclick="press('-')">−</button><br>

<button onclick="press('0')">0</button>
<button onclick="calculate()">=</button>
<button onclick="press('+')">+</button>
<button onclick="clearDisplay()">C</button>

</div>

<div id="secretRoom">
<h1>⚔ Hidden Citadel ⚔</h1>

<div>
<div class="gameCard" onclick="startGame('snake')">🐍 Serpent</div>
<div class="gameCard" onclick="startGame('craft')">🦅 Eagle Craft</div>
<div class="gameCard" onclick="startGame('space')">🚀 Space Run</div>
</div>

<canvas id="gameCanvas" width="900" height="500"></canvas>
<button id="panic" onclick="panicMode()">Back to Calculator</button>
</div>

<script>
//////////////////
// CALCULATOR
//////////////////
function press(val){
document.getElementById("display").value+=val;
}

function calculate(){
try{
document.getElementById("display").value=
eval(document.getElementById("display").value);
}catch{
document.getElementById("display").value="Error";
}
}

function clearDisplay(){
document.getElementById("display").value="";
}

//////////////////
// SECRET UNLOCK
//////////////////

// TYPE 9999 TO UNLOCK
document.getElementById("display").addEventListener("input",function(){
if(this.value==="9999"){
unlock();
}
});

// KEYBOARD SHORTCUT: CTRL + SHIFT + S
document.addEventListener("keydown",function(e){
if(e.ctrlKey && e.shiftKey && e.key==="S"){
unlock();
}
});

function unlock(){
document.getElementById("calc").style.display="none";
document.getElementById("secretRoom").style.display="block";
document.getElementById("panic").style.display="block";
}

function panicMode(){
location.reload();
}

//////////////////
// GAME SYSTEM
//////////////////

let canvas=document.getElementById("gameCanvas");
let ctx=canvas.getContext("2d");
let keys={};

document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

function startGame(type){
canvas.style.display="block";

if(type==="snake") snakeGame();
if(type==="craft") craftGame();
if(type==="space") spaceGame();
}

//////////////////
// SNAKE
//////////////////
function snakeGame(){
let snake=[{x:200,y:200}];
let food={x:300,y:300};
let dx=20,dy=0;

function loop(){
ctx.clearRect(0,0,900,500);

if(keys["ArrowUp"]){dx=0;dy=-20;}
if(keys["ArrowDown"]){dx=0;dy=20;}
if(keys["ArrowLeft"]){dx=-20;dy=0;}
if(keys["ArrowRight"]){dx=20;dy=0;}

let head={x:snake[0].x+dx,y:snake[0].y+dy};
snake.unshift(head);

if(head.x===food.x && head.y===food.y){
food.x=Math.floor(Math.random()*40)*20;
food.y=Math.floor(Math.random()*25)*20;
}else{
snake.pop();
}

ctx.fillStyle="lime";
snake.forEach(s=>ctx.fillRect(s.x,s.y,20,20));
ctx.fillStyle="red";
ctx.fillRect(food.x,food.y,20,20);

requestAnimationFrame(loop);
}
loop();
}

//////////////////
// EAGLE CRAFT
//////////////////
function craftGame(){
let blocks=[];
for(let x=0;x<45;x++)
for(let y=0;y<25;y++)
blocks.push({x:x*20,y:y*20});

canvas.onclick=function(e){
let rect=canvas.getBoundingClientRect();
let mx=Math.floor((e.clientX-rect.left)/20)*20;
let my=Math.floor((e.clientY-rect.top)/20)*20;
blocks=blocks.filter(b=>!(b.x===mx&&b.y===my));
};

function loop(){
ctx.clearRect(0,0,900,500);
ctx.fillStyle="brown";
blocks.forEach(b=>ctx.fillRect(b.x,b.y,20,20));
requestAnimationFrame(loop);
}
loop();
}

//////////////////
// SPACE RUN
//////////////////
function spaceGame(){
let player={x:100,y:100};
let enemy={x:700,y:300};

function loop(){
ctx.clearRect(0,0,900,500);

if(keys["ArrowUp"]) player.y-=4;
if(keys["ArrowDown"]) player.y+=4;
if(keys["ArrowLeft"]) player.x-=4;
if(keys["ArrowRight"]) player.x+=4;

enemy.x+=(player.x-enemy.x)*0.02;
enemy.y+=(player.y-enemy.y)*0.02;

if(Math.abs(player.x-enemy.x)<20 && Math.abs(player.y-enemy.y)<20){
alert("Caught.");
panicMode();
}

ctx.fillStyle="blue";
ctx.fillRect(player.x,player.y,20,20);
ctx.fillStyle="red";
ctx.fillRect(enemy.x,enemy.y,20,20);

requestAnimationFrame(loop);
}
loop();
}
</script>

</body>
</html>
