<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Silver Citadel Secret Arcade</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    background:black;
    color:#d4af37;
    font-family:Garamond, serif;
    text-align:center;
}

h1 {
    margin-top:30px;
}

.game-container {
    display:none;
    margin-top:30px;
}

button {
    background:#4a235a;
    color:#d4af37;
    border:none;
    padding:10px 20px;
    margin:10px;
    cursor:pointer;
    border-radius:6px;
}

button:hover {
    background:#d4af37;
    color:black;
}

canvas {
    background:#111;
    margin-top:20px;
    border:2px solid #d4af37;
}
</style>
</head>

<body>

<h1>⚔ Silver Citadel Secret Arcade ⚔</h1>

<div>
    <button onclick="startObby()">🏃 Knight Obby</button>
    <button onclick="startBlock()">🧱 Block Builder</button>
    <button onclick="startEagle()">🦅 Eagle Flight</button>
    <button onclick="startImpostor()">👤 Space Impostor</button>
    <button onclick="startGuard()">👁 Night Guard</button>
</div>

<canvas id="gameCanvas" width="600" height="400"></canvas>

<script>
let canvas = document.getElementById("gameCanvas");
let ctx = canvas.getContext("2d");
let gameLoop;

function clearGame(){
    cancelAnimationFrame(gameLoop);
    ctx.clearRect(0,0,canvas.width,canvas.height);
}

/* =====================
   KNIGHT OBBY GAME
===================== */
function startObby(){
    clearGame();
    let x=50, y=300, gravity=0, jumping=false;

    document.onkeydown = function(e){
        if(e.code==="Space" && !jumping){
            gravity=-10;
            jumping=true;
        }
    };

    function draw(){
        ctx.clearRect(0,0,600,400);
        ctx.fillStyle="gold";
        ctx.fillRect(x,y,30,30);
        ctx.fillRect(0,350,600,50);

        gravity+=0.5;
        y+=gravity;

        if(y>=300){
            y=300;
            jumping=false;
        }

        gameLoop=requestAnimationFrame(draw);
    }
    draw();
}

/* =====================
   BLOCK BUILDER
===================== */
function startBlock(){
    clearGame();
    canvas.onclick=function(e){
        let rect=canvas.getBoundingClientRect();
        let x=e.clientX-rect.left;
        let y=e.clientY-rect.top;
        ctx.fillStyle="green";
        ctx.fillRect(x,y,20,20);
    };
}

/* =====================
   EAGLE FLIGHT
===================== */
function startEagle(){
    clearGame();
    let y=200;
    document.onkeydown=function(e){
        if(e.code==="ArrowUp") y-=20;
        if(e.code==="ArrowDown") y+=20;
    };
    function draw(){
        ctx.clearRect(0,0,600,400);
        ctx.fillStyle="white";
        ctx.beginPath();
        ctx.arc(100,y,20,0,Math.PI*2);
        ctx.fill();
        gameLoop=requestAnimationFrame(draw);
    }
    draw();
}

/* =====================
   SPACE IMPOSTOR
===================== */
function startImpostor(){
    clearGame();
    ctx.fillStyle="red";
    ctx.fillText("Find the fake knight!",200,200);

    canvas.onclick=function(){
        alert("You found the impostor!");
    };
}

/* =====================
   NIGHT GUARD
===================== */
function startGuard(){
    clearGame();
    let darkness=0;

    function draw(){
        ctx.fillStyle="rgba(0,0,0,0.1)";
        ctx.fillRect(0,0,600,400);
        darkness+=0.01;
        if(darkness>0.8){
            alert("A creature got you!");
            clearGame();
        }
        gameLoop=requestAnimationFrame(draw);
    }
    draw();
}
</script>

</body>
</html>
