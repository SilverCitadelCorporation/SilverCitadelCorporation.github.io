<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Silver Citadel Arcade</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:#0b0b0f;
    color:#d4af37;
    font-family:Garamond, serif;
    text-align:center;
}

h1{margin:20px;}

button{
    background:#4a235a;
    color:#d4af37;
    border:none;
    padding:10px 20px;
    margin:10px;
    cursor:pointer;
    border-radius:6px;
    font-size:16px;
}

button:hover{
    background:#d4af37;
    color:black;
}

canvas{
    background:#111;
    border:2px solid #d4af37;
    display:block;
    margin:20px auto;
}

#menu{
    margin-top:30px;
}
</style>
</head>
<body>

<h1>⚔ Silver Citadel Secret Arcade ⚔</h1>

<div id="menu">
    <button onclick="startRunner()">🏃 Knight Runner</button>
</div>

<canvas id="gameCanvas" width="800" height="400" style="display:none;"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");

let player, gravity, obstacles, speed, score, gameOver, animation;

function startRunner(){
    menu.style.display = "none";
    canvas.style.display = "block";

    player = {x:100,y:300,w:40,h:40,dy:0,onGround:false};
    gravity = 0.6;
    obstacles = [];
    speed = 6;
    score = 0;
    gameOver = false;

    document.addEventListener("keydown", jump);

    spawnObstacle();
    update();
}

function jump(e){
    if(e.code==="Space" && player.onGround){
        player.dy = -14;
        player.onGround = false;
    }
}

function spawnObstacle(){
    let height = 40 + Math.random()*20;
    obstacles.push({
        x:800,
        y:360-height,
        w:30,
        h:height
    });
}

function update(){
    ctx.clearRect(0,0,800,400);

    // ground
    ctx.fillStyle="#222";
    ctx.fillRect(0,360,800,40);

    // player physics
    player.dy += gravity;
    player.y += player.dy;

    if(player.y >= 320){
        player.y = 320;
        player.dy = 0;
        player.onGround = true;
    }

    // draw player
    ctx.fillStyle="gold";
    ctx.fillRect(player.x,player.y,player.w,player.h);

    // obstacles
    ctx.fillStyle="red";
    obstacles.forEach(o=>{
        o.x -= speed;
        ctx.fillRect(o.x,o.y,o.w,o.h);

        // collision
        if(player.x < o.x + o.w &&
           player.x + player.w > o.x &&
           player.y < o.y + o.h &&
           player.y + player.h > o.y){
            endGame();
        }
    });

    obstacles = obstacles.filter(o => o.x > -50);

    if(Math.random() < 0.02){
        spawnObstacle();
    }

    score++;
    speed += 0.002;

    ctx.fillStyle="#d4af37";
    ctx.fillText("Score: "+score,20,30);

    if(!gameOver){
        animation = requestAnimationFrame(update);
    }
}

function endGame(){
    gameOver = true;
    cancelAnimationFrame(animation);

    ctx.fillStyle="rgba(0,0,0,0.7)";
    ctx.fillRect(0,0,800,400);

    ctx.fillStyle="gold";
    ctx.font="30px Garamond";
    ctx.fillText("Game Over",320,180);
    ctx.fillText("Final Score: "+score,300,220);

    ctx.font="18px Garamond";
    ctx.fillText("Click to Restart",330,260);

    canvas.onclick = function(){
        canvas.onclick=null;
        startRunner();
    };
}
</script>

</body>
</html>
