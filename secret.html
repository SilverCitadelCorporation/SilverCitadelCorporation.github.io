<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>???</title>

<style>
body{
margin:0;
background:black;
color:#d4af37;
font-family:'Garamond',serif;
overflow:hidden;
}

#menu{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:40px;
}

.card{
background:#111;
padding:20px;
border:1px solid #d4af37;
border-radius:10px;
cursor:pointer;
transition:.3s;
width:200px;
text-align:center;
}

.card:hover{
background:#d4af37;
color:black;
transform:scale(1.05);
}

canvas{
display:none;
margin:auto;
background:black;
border:3px solid #d4af37;
}

#back{
display:none;
margin:20px auto;
padding:10px 20px;
background:#d4af37;
border:none;
cursor:pointer;
}
</style>
</head>
<body>

<h1 style="text-align:center;margin-top:20px;">⚔ The Hidden Citadel ⚔</h1>

<div id="menu">
<div class="card" onclick="startGame('craft')">🦅 Eagle Craft</div>
<div class="card" onclick="startGame('space')">🚀 Space Sus</div>
<div class="card" onclick="startGame('night')">👁 Night Watch</div>
<div class="card" onclick="startGame('obby')">🏃 Citadel Trials</div>
<div class="card" onclick="startGame('snake')">🐍 Serpent</div>
<div class="card" onclick="startGame('breaker')">🧱 Block Breaker</div>
</div>

<canvas id="gameCanvas" width="900" height="550"></canvas>
<button id="back" onclick="location.reload()">Return to Shadows</button>

<script>
let canvas=document.getElementById("gameCanvas");
let ctx=canvas.getContext("2d");
let keys={};

document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

function startGame(type){
document.getElementById("menu").style.display="none";
canvas.style.display="block";
document.getElementById("back").style.display="block";

if(type==="snake") snakeGame();
if(type==="obby") obbyGame();
if(type==="craft") craftGame();
if(type==="space") spaceGame();
if(type==="night") nightGame();
if(type==="breaker") breakerGame();
}

/////////////////////////
// 🐍 Snake
/////////////////////////
function snakeGame(){
let snake=[{x:200,y:200}];
let food={x:300,y:300};
let dx=20,dy=0;

function loop(){
ctx.clearRect(0,0,900,550);

if(keys["ArrowUp"]){dx=0;dy=-20;}
if(keys["ArrowDown"]){dx=0;dy=20;}
if(keys["ArrowLeft"]){dx=-20;dy=0;}
if(keys["ArrowRight"]){dx=20;dy=0;}

let head={x:snake[0].x+dx,y:snake[0].y+dy};
snake.unshift(head);

if(head.x===food.x && head.y===food.y){
food.x=Math.floor(Math.random()*40)*20;
food.y=Math.floor(Math.random()*25)*20;
}else{
snake.pop();
}

ctx.fillStyle="lime";
snake.forEach(s=>ctx.fillRect(s.x,s.y,20,20));
ctx.fillStyle="red";
ctx.fillRect(food.x,food.y,20,20);

requestAnimationFrame(loop);
}
loop();
}

/////////////////////////
// 🏃 Obby
/////////////////////////
function obbyGame(){
let player={x:50,y:450,dy:0};
let gravity=0.7;

function loop(){
ctx.clearRect(0,0,900,550);
player.dy+=gravity;
player.y+=player.dy;

if(keys[" "] && player.y>400) player.dy=-12;
if(player.y>520){alert("You Fell.");location.reload();}

ctx.fillStyle="white";
ctx.fillRect(0,500,900,50);

ctx.fillStyle="cyan";
ctx.fillRect(player.x,player.y,20,20);
player.x+=3;

if(player.x>850){alert("Victory.");location.reload();}

requestAnimationFrame(loop);
}
loop();
}

/////////////////////////
// 🦅 Eagle Craft
/////////////////////////
function craftGame(){
let blocks=[];
for(let x=0;x<45;x++)
for(let y=0;y<27;y++)
blocks.push({x:x*20,y:y*20});

canvas.onclick=function(e){
let rect=canvas.getBoundingClientRect();
let mx=Math.floor((e.clientX-rect.left)/20)*20;
let my=Math.floor((e.clientY-rect.top)/20)*20;
blocks=blocks.filter(b=>!(b.x===mx&&b.y===my));
};

function loop(){
ctx.clearRect(0,0,900,550);
ctx.fillStyle="brown";
blocks.forEach(b=>ctx.fillRect(b.x,b.y,20,20));
requestAnimationFrame(loop);
}
loop();
}

/////////////////////////
// 🚀 Space Survival
/////////////////////////
function spaceGame(){
let player={x:100,y:100};
let enemy={x:700,y:400};

function loop(){
ctx.clearRect(0,0,900,550);

if(keys["ArrowUp"]) player.y-=4;
if(keys["ArrowDown"]) player.y+=4;
if(keys["ArrowLeft"]) player.x-=4;
if(keys["ArrowRight"]) player.x+=4;

enemy.x+=(player.x-enemy.x)*0.02;
enemy.y+=(player.y-enemy.y)*0.02;

if(Math.abs(player.x-enemy.x)<20 && Math.abs(player.y-enemy.y)<20){
alert("Caught.");
location.reload();
}

ctx.fillStyle="blue";
ctx.fillRect(player.x,player.y,20,20);
ctx.fillStyle="red";
ctx.fillRect(enemy.x,enemy.y,20,20);

requestAnimationFrame(loop);
}
loop();
}

/////////////////////////
// 👁 Night Watch
/////////////////////////
function nightGame(){
let timer=0;
function loop(){
ctx.fillStyle="black";
ctx.fillRect(0,0,900,550);

ctx.fillStyle="white";
ctx.fillText("Survive...",400,250);

timer++;
if(timer>600){
alert("You Survived.");
location.reload();
}

requestAnimationFrame(loop);
}
loop();
}

/////////////////////////
// 🧱 Block Breaker
/////////////////////////
function breakerGame(){
let ball={x:450,y:250,dx:4,dy:4};

function loop(){
ctx.clearRect(0,0,900,550);
ball.x+=ball.dx;
ball.y+=ball.dy;

if(ball.x<0||ball.x>900) ball.dx*=-1;
if(ball.y<0||ball.y>550) ball.dy*=-1;

ctx.beginPath();
ctx.arc(ball.x,ball.y,10,0,Math.PI*2);
ctx.fillStyle="white";
ctx.fill();

requestAnimationFrame(loop);
}
loop();
}
</script>

</body>
</html>
