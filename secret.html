<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Silver Citadel Secret Arcade</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:black;
    color:#d4af37;
    font-family:Garamond, serif;
    text-align:center;
}

h1{margin:20px;}

button{
    background:#4a235a;
    color:#d4af37;
    border:none;
    padding:10px 20px;
    margin:5px;
    cursor:pointer;
    border-radius:6px;
}

button:hover{
    background:#d4af37;
    color:black;
}

canvas{
    background:#111;
    border:2px solid #d4af37;
    margin-top:20px;
}
</style>
</head>

<body>

<h1>⚔ Silver Citadel Secret Arcade ⚔</h1>

<div>
    <button onclick="startObby()">🏃 Knight Obby</button>
    <button onclick="startMiner()">🧱 Block Miner</button>
    <button onclick="startNight()">👁 Night Watch</button>
</div>

<canvas id="gameCanvas" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let animation;
let keys = {};

document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

function clearGame(){
    cancelAnimationFrame(animation);
    ctx.clearRect(0,0,canvas.width,canvas.height);
}

/* =========================
   🏃 KNIGHT OBBY (REAL)
========================= */
function startObby(){
    clearGame();

    let player = {x:100, y:300, w:30, h:30, dy:0, onGround:false};
    let gravity = 0.5;
    let platforms = [
        {x:0,y:350,w:800,h:50},
        {x:300,y:280,w:120,h:20},
        {x:500,y:220,w:120,h:20},
        {x:700,y:160,w:100,h:20}
    ];

    function update(){
        ctx.clearRect(0,0,800,400);

        // movement
        if(keys["ArrowRight"]) player.x += 5;
        if(keys["ArrowLeft"]) player.x -= 5;
        if(keys["Space"] && player.onGround){
            player.dy = -12;
            player.onGround = false;
        }

        player.dy += gravity;
        player.y += player.dy;

        player.onGround = false;

        // collision
        for(let p of platforms){
            ctx.fillStyle="#444";
            ctx.fillRect(p.x,p.y,p.w,p.h);

            if(player.x < p.x + p.w &&
               player.x + player.w > p.x &&
               player.y < p.y + p.h &&
               player.y + player.h > p.y){

                player.y = p.y - player.h;
                player.dy = 0;
                player.onGround = true;
            }
        }

        ctx.fillStyle="gold";
        ctx.fillRect(player.x,player.y,player.w,player.h);

        if(player.x > 750){
            alert("YOU BEAT THE OBBY ⚔");
            clearGame();
            return;
        }

        animation = requestAnimationFrame(update);
    }

    update();
}

/* =========================
   🧱 BLOCK MINER
========================= */
function startMiner(){
    clearGame();

    let score = 0;
    let blocks = [];

    for(let i=0;i<20;i++){
        blocks.push({
            x:Math.random()*760,
            y:Math.random()*360,
            size:20
        });
    }

    canvas.onclick = function(e){
        let rect = canvas.getBoundingClientRect();
        let mx = e.clientX - rect.left;
        let my = e.clientY - rect.top;

        for(let i=blocks.length-1;i>=0;i--){
            let b = blocks[i];
            if(mx > b.x && mx < b.x+b.size &&
               my > b.y && my < b.y+b.size){
                blocks.splice(i,1);
                score++;
            }
        }
    }

    function update(){
        ctx.clearRect(0,0,800,400);

        ctx.fillStyle="green";
        blocks.forEach(b=>{
            ctx.fillRect(b.x,b.y,b.size,b.size);
        });

        ctx.fillStyle="gold";
        ctx.fillText("Score: "+score,10,20);

        if(blocks.length===0){
            alert("YOU MINED EVERYTHING 🧱");
            clearGame();
            return;
        }

        animation=requestAnimationFrame(update);
    }

    update();
}

/* =========================
   👁 NIGHT WATCH (SURVIVE)
========================= */
function startNight(){
    clearGame();

    let time = 0;
    let enemyX = 0;

    function update(){
        ctx.fillStyle="rgba(0,0,0,0.2)";
        ctx.fillRect(0,0,800,400);

        ctx.fillStyle="red";
        ctx.fillRect(enemyX,200,40,40);

        enemyX += 2;

        ctx.fillStyle="gold";
        ctx.fillText("Survive: "+Math.floor(time/60)+"s",10,20);

        time++;

        if(enemyX > 800){
            alert("YOU SURVIVED THE NIGHT 👁");
            clearGame();
            return;
        }

        animation=requestAnimationFrame(update);
    }

    update();
}
</script>

</body>
</html>
