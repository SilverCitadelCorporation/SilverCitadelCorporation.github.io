<!DOCTYPE html>
<html>
<head>
<title>Silver Citadel Arcade</title>
<style>
body{
    margin:0;
    background:#111;
    font-family:Arial;
    color:white;
    text-align:center;
}

h1{
    padding:20px;
}

#menu{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
}

button{
    padding:15px 25px;
    font-size:16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:gold;
}

canvas{
    background:black;
    display:none;
    margin:auto;
    border:3px solid gold;
}

#backBtn{
    display:none;
    margin:20px;
}
</style>
</head>
<body>

<h1>⚔ Silver Citadel Arcade ⚔</h1>

<div id="menu">
<button onclick="startGame('obby')">Obby Run</button>
<button onclick="startGame('miner')">Block Miner</button>
<button onclick="startGame('impostor')">Space Survival</button>
<button onclick="startGame('night')">Night Guard</button>
<button onclick="startGame('eagle')">Eagle Flight</button>
<button onclick="startGame('snake')">Snake</button>
<button onclick="startGame('memory')">Memory</button>
<button onclick="startGame('breakout')">Breakout</button>
</div>

<button id="backBtn" onclick="goBack()">Back to Arcade</button>
<canvas id="gameCanvas" width="800" height="500"></canvas>

<script>
let canvas = document.getElementById("gameCanvas");
let ctx = canvas.getContext("2d");
let currentGame = "";
let keys = {};

document.addEventListener("keydown", e=>keys[e.key]=true);
document.addEventListener("keyup", e=>keys[e.key]=false);

function startGame(game){
    document.getElementById("menu").style.display="none";
    document.getElementById("backBtn").style.display="block";
    canvas.style.display="block";
    currentGame=game;
    if(game==="snake") startSnake();
    if(game==="obby") startObby();
    if(game==="miner") startMiner();
    if(game==="impostor") startImpostor();
    if(game==="night") startNight();
    if(game==="eagle") startEagle();
    if(game==="memory") startMemory();
    if(game==="breakout") startBreakout();
}

function goBack(){
    location.reload();
}

/////////////////////////////////
// 🐍 SNAKE
/////////////////////////////////
function startSnake(){
    let snake=[{x:200,y:200}];
    let food={x:300,y:300};
    let dx=20,dy=0;

    function loop(){
        if(keys["ArrowUp"]){dx=0;dy=-20;}
        if(keys["ArrowDown"]){dx=0;dy=20;}
        if(keys["ArrowLeft"]){dx=-20;dy=0;}
        if(keys["ArrowRight"]){dx=20;dy=0;}

        let head={x:snake[0].x+dx,y:snake[0].y+dy};
        snake.unshift(head);

        if(head.x===food.x && head.y===food.y){
            food.x=Math.floor(Math.random()*40)*20;
            food.y=Math.floor(Math.random()*25)*20;
        } else snake.pop();

        ctx.clearRect(0,0,800,500);
        ctx.fillStyle="lime";
        snake.forEach(p=>ctx.fillRect(p.x,p.y,20,20));
        ctx.fillStyle="red";
        ctx.fillRect(food.x,food.y,20,20);
        requestAnimationFrame(loop);
    }
    loop();
}

/////////////////////////////////
// 🏃 OBBY
/////////////////////////////////
function startObby(){
    let player={x:50,y:400,w:30,h:30,dy:0};
    let gravity=0.5;
    function loop(){
        ctx.clearRect(0,0,800,500);
        player.dy+=gravity;
        player.y+=player.dy;

        if(keys[" "] && player.y>350) player.dy=-10;

        if(player.y>450){alert("You fell!");goBack();}

        ctx.fillStyle="white";
        ctx.fillRect(0,450,800,50);
        ctx.fillStyle="cyan";
        ctx.fillRect(player.x,player.y,player.w,player.h);

        requestAnimationFrame(loop);
    }
    loop();
}

/////////////////////////////////
// ⛏ MINER
/////////////////////////////////
function startMiner(){
    let blocks=[];
    for(let i=0;i<40;i++)
        for(let j=0;j<25;j++)
            blocks.push({x:i*20,y:j*20});

    canvas.onclick=function(e){
        let rect=canvas.getBoundingClientRect();
        let x=Math.floor((e.clientX-rect.left)/20)*20;
        let y=Math.floor((e.clientY-rect.top)/20)*20;
        blocks=blocks.filter(b=>!(b.x===x&&b.y===y));
    }

    function loop(){
        ctx.clearRect(0,0,800,500);
        ctx.fillStyle="brown";
        blocks.forEach(b=>ctx.fillRect(b.x,b.y,20,20));
        requestAnimationFrame(loop);
    }
    loop();
}

/////////////////////////////////
// 🚀 IMPOSTOR SURVIVAL
/////////////////////////////////
function startImpostor(){
    let player={x:100,y:100};
    let enemy={x:600,y:300};

    function loop(){
        ctx.clearRect(0,0,800,500);

        if(keys["ArrowUp"]) player.y-=4;
        if(keys["ArrowDown"]) player.y+=4;
        if(keys["ArrowLeft"]) player.x-=4;
        if(keys["ArrowRight"]) player.x+=4;

        enemy.x += (player.x-enemy.x)*0.02;
        enemy.y += (player.y-enemy.y)*0.02;

        if(Math.abs(player.x-enemy.x)<20 && Math.abs(player.y-enemy.y)<20){
            alert("Impostor caught you!");
            goBack();
        }

        ctx.fillStyle="blue";
        ctx.fillRect(player.x,player.y,20,20);
        ctx.fillStyle="red";
        ctx.fillRect(enemy.x,enemy.y,20,20);

        requestAnimationFrame(loop);
    }
    loop();
}

/////////////////////////////////
// 👁 NIGHT GUARD
/////////////////////////////////
function startNight(){
    let time=0;
    function loop(){
        ctx.fillStyle="black";
        ctx.fillRect(0,0,800,500);
        ctx.fillStyle="white";
        ctx.fillText("Survive 10 seconds...",300,250);
        time++;
        if(time>600){
            alert("You survived the night!");
            goBack();
        }
        requestAnimationFrame(loop);
    }
    loop();
}

/////////////////////////////////
// 🦅 EAGLE FLIGHT
/////////////////////////////////
function startEagle(){
    let y=250;
    function loop(){
        ctx.clearRect(0,0,800,500);
        if(keys["ArrowUp"]) y-=5;
        if(keys["ArrowDown"]) y+=5;
        ctx.fillStyle="gold";
        ctx.fillRect(200,y,40,20);
        requestAnimationFrame(loop);
    }
    loop();
}

/////////////////////////////////
// 🧠 MEMORY
/////////////////////////////////
function startMemory(){
    alert("Memory Game Coming Soon Upgrade!");
    goBack();
}

/////////////////////////////////
// 🧱 BREAKOUT
/////////////////////////////////
function startBreakout(){
    let ball={x:400,y:250,dx:4,dy:4};
    function loop(){
        ctx.clearRect(0,0,800,500);
        ball.x+=ball.dx;
        ball.y+=ball.dy;
        if(ball.x<0||ball.x>800) ball.dx*=-1;
        if(ball.y<0||ball.y>500) ball.dy*=-1;
        ctx.fillStyle="white";
        ctx.beginPath();
        ctx.arc(ball.x,ball.y,10,0,Math.PI*2);
        ctx.fill();
        requestAnimationFrame(loop);
    }
    loop();
}
</script>

</body>
</html>
