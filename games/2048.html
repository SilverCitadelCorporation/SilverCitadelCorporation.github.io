<!DOCTYPE html>
<html>
<head>
<style>
body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial;color:white}
#box{border:6px solid white;position:relative}
canvas{background:black}
#over{position:absolute;top:0;left:0;width:100%;height:100%;background:#000c;display:none;flex-direction:column;justify-content:center;align-items:center}
button{padding:10px 20px;font-size:18px;margin-top:10px}
</style>
</head>
<body>

<div id="box">
<canvas id="game" width="800" height="500"></canvas>

<div id="over">
<h1>Game Over</h1>
<button onclick="restart()">Restart</button>
</div>

</div>

<script>

let c=document.getElementById("game")
let ctx=c.getContext("2d")

let ball={x:400,y:250,dx:4,dy:-4,r:10}

let paddle={x:350,w:100}

let bricks=[]

for(let r=0;r<5;r++){
for(let c=0;c<10;c++){
bricks.push({x:c*75+20,y:r*30+40})
}
}

function draw(){

ctx.fillStyle="black"
ctx.fillRect(0,0,800,500)

ctx.fillStyle="white"
ctx.fillRect(paddle.x,470,paddle.w,10)

ctx.beginPath()
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2)
ctx.fill()

bricks.forEach(b=>{
ctx.fillRect(b.x,b.y,70,20)
})

ball.x+=ball.dx
ball.y+=ball.dy

if(ball.x<0||ball.x>800) ball.dx*=-1
if(ball.y<0) ball.dy*=-1

if(ball.y>470 && ball.x>paddle.x && ball.x<paddle.x+paddle.w){
ball.dy*=-1
}

if(ball.y>500) gameOver()

requestAnimationFrame(draw)

}

document.addEventListener("mousemove",e=>{
paddle.x=e.clientX-50
})

function gameOver(){
document.getElementById("over").style.display="flex"
}

function restart(){
location.reload()
}

draw()

</script>
</body>
</html>
