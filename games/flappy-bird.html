<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>
<style>
body{margin:0;font-family:Arial;background:#70c5ce;display:flex;justify-content:center;align-items:center;height:100vh;}
canvas{background:#70c5ce;display:block;margin:auto;border:2px solid #000;}
.screen{
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.6);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  color:white;font-size:24px;
}
button{padding:12px 25px;font-size:18px;margin:10px;cursor:pointer;border:none;border-radius:6px;}
select{padding:6px;margin:10px;font-size:16px;border-radius:6px;}
h1{margin-bottom:20px;}
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="startScreen" class="screen">
  <h1>Flappy Bird</h1>
  <button onclick="startGame()">Play</button>
  <button onclick="openSettings()">Settings</button>
  <button onclick="exitGame()">Exit</button>
</div>

<!-- SETTINGS SCREEN -->
<div id="settingsScreen" class="screen" style="display:none;">
  <h1>Settings</h1>
  <label>Bird Color:</label>
  <select id="birdColor">
    <option value="#ff0">Yellow</option>
    <option value="#f00">Red</option>
    <option value="#0f0">Green</option>
    <option value="#00f">Blue</option>
  </select>
  <br>
  <label>Bird Type:</label>
  <select id="birdType">
    <option value="circle" selected>Circle</option>
    <option value="triangle">Triangle</option>
    <option value="square">Square</option>
  </select>
  <br>
  <label>Difficulty:</label>
  <select id="difficulty">
    <option value="easy">Easy</option>
    <option value="normal" selected>Normal</option>
    <option value="hard">Hard</option>
  </select>
  <br>
  <button onclick="closeSettings()">Back</button>
</div>

<!-- GAME OVER SCREEN -->
<div id="gameOver" class="screen" style="display:none;">
  <h1>Game Over</h1>
  <p id="finalScore"></p>
  <button onclick="restartGame()">Restart</button>
  <button onclick="exitGame()">Exit</button>
</div>

<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let bird, pipes=[], score, highScore=0, gravity, lift, speed, gap, running=false, difficulty, birdType;

// Initialize game variables
function initGame(){
  bird={
    x:50,
    y:300,
    radius:15,
    color:document.getElementById("birdColor").value,
    velocity:0,
    type:document.getElementById("birdType").value
  };
  pipes=[];
  score=0;
  gravity=difficulty==="easy"?0.4:difficulty==="normal"?0.6:0.8;
  lift=-8;
  speed=difficulty==="easy"?2:difficulty==="normal"?3:4;
  gap=120;
  running=true;
}

// Start game
function startGame(){
  difficulty=document.getElementById("difficulty").value;
  birdType=document.getElementById("birdType").value;
  initGame();
  document.getElementById("startScreen").style.display="none";
  loop();
}

// Settings
function openSettings(){document.getElementById("startScreen").style.display="none";document.getElementById("settingsScreen").style.display="flex";}
function closeSettings(){document.getElementById("settingsScreen").style.display="none";document.getElementById("startScreen").style.display="flex";}

// Restart & Exit
function restartGame(){initGame();document.getElementById("gameOver").style.display="none";loop();}
function exitGame(){window.location.href="supercalculator.html";}

// Key controls
document.addEventListener("keydown",e=>{
  if(["ArrowUp","w"," ","W"].includes(e.key)){bird.velocity=lift;}
});

// Game loop
let frame=0;
function loop(){
  if(!running) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  update();
  draw();
  requestAnimationFrame(loop);
}

function update(){
  bird.velocity+=gravity;
  bird.y+=bird.velocity;

  // Add pipes
  if(frame%90===0){
    let topHeight=Math.random()*(canvas.height-gap-60)+30;
    pipes.push({x:canvas.width, top:topHeight, bottom:topHeight+gap});
  }

  // Move pipes
  for(let i=pipes.length-1;i>=0;i--){
    pipes[i].x-=speed;

    // Check collision
    if(bird.x+bird.radius>pipes[i].x && bird.x-bird.radius<pipes[i].x+50){
      if(bird.y-bird.radius<pipes[i].top || bird.y+bird.radius>pipes[i].bottom){
        endGame();
      }
    }

    // Score
    if(pipes[i].x+50<bird.x && !pipes[i].scored){
      score++;
      pipes[i].scored=true;
      if(score>highScore){highScore=score;}
    }

    // Remove offscreen pipes
    if(pipes[i].x+50<0){pipes.splice(i,1);}
  }

  // Check floor/ceiling
  if(bird.y+bird.radius>canvas.height || bird.y-bird.radius<0){endGame();}
  frame++;
}

function draw(){
  // Draw bird based on type
  ctx.fillStyle=bird.color;
  if(bird.type==="circle"){
    ctx.beginPath();
    ctx.arc(bird.x,bird.y,bird.radius,0,Math.PI*2);
    ctx.fill();
  } else if(bird.type==="triangle"){
    ctx.beginPath();
    ctx.moveTo(bird.x,bird.y-bird.radius);
    ctx.lineTo(bird.x-bird.radius,bird.y+bird.radius);
    ctx.lineTo(bird.x+bird.radius,bird.y+bird.radius);
    ctx.closePath();
    ctx.fill();
  } else if(bird.type==="square"){
    ctx.fillRect(bird.x-bird.radius,bird.y-bird.radius,bird.radius*2,bird.radius*2);
  }

  // Draw pipes
  ctx.fillStyle="#0a0";
  pipes.forEach(p=>{
    ctx.fillRect(p.x,0,50,p.top);
    ctx.fillRect(p.x,p.bottom,50,canvas.height-p.bottom);
  });

  // Draw score
  ctx.fillStyle="#fff";
  ctx.font="24px Arial";
  ctx.fillText("Score: "+score,10,30);
  ctx.fillText("High Score: "+highScore,10,60);
}

// End game
function endGame(){
  running=false;
  document.getElementById("finalScore").innerText="Score: "+score;
  document.getElementById("gameOver").style.display="flex";
}
</script>
</body>
</html>
