<!DOCTYPE html>
<html>
<head>
<title>Flappy Bird</title>
<style>
body{margin:0;background:#70c5ce;overflow:hidden;font-family:sans-serif;touch-action:none;}
canvas{display:block;margin:auto;}
.screen{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
button{padding:12px 25px;font-size:18px;margin:8px;cursor:pointer;}
#mobileTap{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:transparent;}
</style>
</head>
<body>

<div id="startScreen" class="screen">
<h1>Flappy Bird</h1>
<button onclick="startGame()">Play</button>
<button onclick="exitGame()">Exit</button>
</div>

<canvas id="gameCanvas" width="480" height="640"></canvas>
<div id="mobileTap" ontouchstart="flap()"></div>

<script>
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
let bird, pipes, score, gravity=0.6, lift=-12, running=false;

// Start game
function startGame(){
  bird={x:100,y:320,vy:0,r:15};
  pipes=[];
  score=0;
  running=true;
  document.getElementById("startScreen").style.display="none";
  if(window.innerWidth<700) document.getElementById("mobileTap").style.display="block";
  loop();
}

// Controls
function flap(){bird.vy=lift;}
function handleKey(key){if(key==' '||key=='ArrowUp'||key=='w'||key=='W') flap();}
document.addEventListener('keydown',e=>handleKey(e.key));
window.addEventListener('message',e=>{if(e.data.key) handleKey(e.data.key); if(e.data.exit) exitGame();});
function exitGame(){window.parent.postMessage({exit:true},'*');}

// Game loop
function loop(){if(!running) return; update(); draw(); requestAnimationFrame(loop);}

// Update
function update(){
  bird.vy+=gravity; bird.y+=bird.vy;
  if(Math.random()<0.02){let h=Math.random()*300+100; pipes.push({x:canvas.width,y:0,height:h}); pipes.push({x:canvas.width,y:h+120,height:canvas.height-h-120});}
  for(let i=pipes.length-1;i>=0;i--){
    pipes[i].x-=2;
    if(pipes[i].x+50<0) pipes.splice(i,1);
    if(bird.x+bird.r>pipes[i].x && bird.x-bird.r<pipes[i].x+50 && bird.y+bird.r>pipes[i].y && bird.y-bird.r<pipes[i].y+pipes[i].height) endGame();
  }
  if(bird.y+bird.r>canvas.height||bird.y-bird.r<0) endGame();
  score++;
}

// Draw
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="yellow"; ctx.beginPath(); ctx.arc(bird.x,bird.y,bird.r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="green"; pipes.forEach(p=>ctx.fillRect(p.x,p.y,50,p.height));
  ctx.fillStyle="white"; ctx.font="24px Arial"; ctx.fillText("Score: "+score,10,30);
}

// End
function endGame(){
  running=false; alert("Game Over! Score: "+score);
  let high=Number(localStorage.getItem("flappyHighScore")||0);
  if(score>high) localStorage.setItem("flappyHighScore",score);
}
</script>

</body>
</html>
