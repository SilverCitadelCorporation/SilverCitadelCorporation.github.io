<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#70c5ce;font-family:sans-serif;overflow:hidden;}
canvas{display:block;margin:auto;background:#70c5ce;}
.screen{
  position:fixed;top:0;left:0;width:100%;height:100%;display:flex;
  flex-direction:column;justify-content:center;align-items:center;
  background:rgba(0,0,0,0.5);color:white;font-size:24px;
}
button{padding:12px 25px;font-size:18px;margin:10px;cursor:pointer;border:none;border-radius:6px;}
</style>
</head>
<body>

<div id="startScreen" class="screen">
<h1>Flappy Bird</h1>
<button onclick="startGame()">Start</button>
</div>

<div id="gameOverScreen" class="screen" style="display:none;">
<h1>Game Over</h1>
<p id="finalScore"></p>
<button onclick="restartGame()">Restart</button>
</div>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let bird, pipes, gravity, jumpPower, score, gameRunning;

function initGame(){
  bird = {x:50, y:300, width:30, height:30, velocity:0};
  pipes = [];
  gravity = 0.5;
  jumpPower = -10;
  score = 0;
  gameRunning = false;
}

function startGame(){
  document.getElementById("startScreen").style.display = "none";
  initGame();
  gameRunning = true;
  spawnPipe();
  loop();
}

function restartGame(){
  document.getElementById("gameOverScreen").style.display="none";
  startGame();
}

function spawnPipe(){
  const gap = 120;
  const topHeight = Math.random()*(canvas.height-gap-100)+50;
  pipes.push({x:canvas.width, topHeight:topHeight, gap:gap});
}

function update(){
  // Bird physics
  bird.velocity += gravity;
  bird.y += bird.velocity;

  // Pipe movement
  for(let i=pipes.length-1;i>=0;i--){
    pipes[i].x -= 3;
    // Remove offscreen
    if(pipes[i].x + 60 < 0) pipes.splice(i,1);
  }

  // Spawn new pipe
  if(pipes.length === 0 || pipes[pipes.length-1].x < canvas.width - 200){
    spawnPipe();
  }

  // Collision detection
  for(let pipe of pipes){
    if(bird.x < pipe.x+60 && bird.x+bird.width>pipe.x){
      if(bird.y<pipe.topHeight || bird.y+bird.height>pipe.topHeight+pipe.gap){
        endGame();
      }
    }
  }

  // Ground and ceiling
  if(bird.y+bird.height > canvas.height || bird.y < 0){
    endGame();
  }

  // Score
  pipes.forEach(p=>{if(!p.passed && p.x+60<bird.x){score++;p.passed=true;}});
}

function draw(){
  // Clear
  ctx.fillStyle="#70c5ce";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Pipes
  ctx.fillStyle="#0f0";
  pipes.forEach(pipe=>{
    ctx.fillRect(pipe.x,0,60,pipe.topHeight);
    ctx.fillRect(pipe.x,pipe.topHeight+pipe.gap,60,canvas.height-pipe.topHeight-pipe.gap);
  });

  // Bird
  ctx.fillStyle="#ff0";
  ctx.fillRect(bird.x,bird.y,bird.width,bird.height);

  // Score
  ctx.fillStyle="#000";
  ctx.font="24px Arial";
  ctx.fillText("Score: "+score,10,30);
}

function loop(){
  if(!gameRunning) return;
  update();
  draw();
  requestAnimationFrame(loop);
}

function endGame(){
  gameRunning=false;
  document.getElementById("gameOverScreen").style.display="flex";
  document.getElementById("finalScore").innerText="Score: "+score;
  // Store high score
  let high = localStorage.getItem("flappyHighScore")||0;
  if(score>high) localStorage.setItem("flappyHighScore",score);
}

// Controls
document.addEventListener("keydown", e=>{
  if(e.key===" " || e.key==="ArrowUp") bird.velocity=jumpPower;
});
canvas.addEventListener("click",()=>bird.velocity=jumpPower);
canvas.addEventListener("touchstart",()=>bird.velocity=jumpPower);
</script>

</body>
</html>
