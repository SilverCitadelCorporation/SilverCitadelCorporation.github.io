<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>

<style>
body{margin:0;background:black}
canvas{display:block;margin:auto;background:#70c5ce}
</style>

</head>

<body>

<canvas id="game" width="400" height="500"></canvas>

<script>

const canvas=document.getElementById("game")
const ctx=canvas.getContext("2d")

let bird={x:80,y:200,v:0}
let pipes=[]
let score=0

function spawnPipe(){

let gap=120
let top=Math.random()*250

pipes.push({
x:400,
top:top,
bottom:top+gap,
w:60
})

}

setInterval(spawnPipe,2000)

function flap(){
bird.v=-8
}

document.addEventListener("keydown",e=>{
if(e.key===" "||e.key==="w"||e.key==="ArrowUp"){
flap()
}
})

canvas.addEventListener("click",flap)
canvas.addEventListener("touchstart",flap)

function update(){

bird.v+=0.5
bird.y+=bird.v

if(bird.y>500||bird.y<0){
location.reload()
}

pipes.forEach(p=>{

p.x-=2

if(
bird.x+20>p.x &&
bird.x<p.x+p.w &&
(bird.y<p.top || bird.y>p.bottom)
){
location.reload()
}

if(p.x+p.w<bird.x && !p.pass){
score++
p.pass=true
}

})

}

function draw(){

ctx.fillStyle="#70c5ce"
ctx.fillRect(0,0,400,500)

ctx.fillStyle="yellow"
ctx.beginPath()
ctx.arc(bird.x,bird.y,15,0,Math.PI*2)
ctx.fill()

ctx.fillStyle="green"

pipes.forEach(p=>{
ctx.fillRect(p.x,0,p.w,p.top)
ctx.fillRect(p.x,p.bottom,p.w,500)
})

ctx.fillStyle="black"
ctx.font="20px Arial"
ctx.fillText("Score "+score,10,30)

}

function loop(){

update()
draw()
requestAnimationFrame(loop)

}

loop()

</script>

</body>
</html>
