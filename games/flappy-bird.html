<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
body {
  margin:0;
  font-family: Arial;
  background:#70c5ce;
  overflow: hidden;
}
canvas { display:block; margin:auto; background:#70c5ce; }
.screen {
  position:fixed; top:0; left:0; width:100%; height:100%;
  display:flex; justify-content:center; align-items:center; flex-direction:column;
  background: rgba(0,0,0,0.7);
  color:white; font-size:24px;
}
button { padding:12px 25px; margin:8px; font-size:18px; cursor:pointer; }
select { margin:10px; padding:6px; font-size:16px; }
h1,h2 { margin:10px; }
#scoreBoard {
  position: absolute; top:20px; left:50%; transform:translateX(-50%);
  color:white; font-size:28px; text-shadow: 2px 2px #000;
}
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="startScreen" class="screen">
  <h1>Flappy Bird</h1>
  <button onclick="startGame()">Start</button>
  <button onclick="openSettings()">Settings</button>
</div>

<!-- SETTINGS SCREEN -->
<div id="settingsScreen" class="screen" style="display:none">
  <h2>Settings</h2>
  <label>Character Color: </label>
  <select id="birdColorSelect">
    <option value="yellow">Yellow</option>
    <option value="red">Red</option>
    <option value="blue">Blue</option>
    <option value="green">Green</option>
  </select>
  <br>
  <label>Difficulty: </label>
  <select id="difficultySelect">
    <option value="easy">Easy</option>
    <option value="normal" selected>Normal</option>
    <option value="hard">Hard</option>
  </select>
  <br>
  <button onclick="closeSettings()">Back</button>
</div>

<!-- GAME OVER SCREEN -->
<div id="gameOver" class="screen" style="display:none">
  <h1>Game Over</h1>
  <p id="finalScore"></p>
  <button onclick="restartGame()">Restart</button>
  <button onclick="exitGame()">Exit</button>
</div>

<canvas id="gameCanvas" width="480" height="640"></canvas>
<div id="scoreBoard">0 | High: 0</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let bird, pipes, score, highScore, gameInterval, gravity, jump, pipeGap, pipeSpeed;

// Default Settings
let birdColor = "yellow";
let difficulty = "normal";

// Bird object
function resetBird() {
  bird = { x:80, y:canvas.height/2, w:34, h:24, dy:0 };
  gravity = 0.5;
  jump = -8;
  switch(difficulty){
    case "easy": pipeGap = 180; pipeSpeed = 2; break;
    case "normal": pipeGap = 140; pipeSpeed = 3; break;
    case "hard": pipeGap = 120; pipeSpeed = 4; break;
  }
}

// Pipe management
function resetPipes() {
  pipes = [];
  for(let i=0;i<3;i++){
    let topH = Math.random()*(canvas.height-pipeGap-100)+50;
    pipes.push({x:canvas.width + i*200, top:topH, bottom:topH+pipeGap});
  }
}

function startGame() {
  document.getElementById("startScreen").style.display="none";
  document.getElementById("settingsScreen").style.display="none";
  document.getElementById("gameOver").style.display="none";
  score=0;
  highScore = parseInt(localStorage.getItem("flappyHighScore")||0);
  resetBird();
  resetPipes();
  gameInterval = setInterval(gameLoop, 20);
  updateScore();
}

function restartGame(){
  startGame();
}

function exitGame(){
  location.href = "supercalculator.html"; // change to hub if needed
}

function openSettings(){
  document.getElementById("startScreen").style.display="none";
  document.getElementById("settingsScreen").style.display="flex";
}
function closeSettings(){
  document.getElementById("settingsScreen").style.display="none";
  document.getElementById("startScreen").style.display="flex";
}

// Controls
function flap(){ bird.dy = jump; }
document.addEventListener("keydown", e => { if(e.code=="Space"||e.code=="ArrowUp") flap(); });
canvas.addEventListener("click", flap);
window.addEventListener("touchstart", flap);

// Game loop
function gameLoop() {
  // Update
  bird.dy += gravity;
  bird.y += bird.dy;

  for(let p of pipes){ 
    p.x -= pipeSpeed; 
    if(p.x + 50 < 0){
      p.x = canvas.width;
      let topH = Math.random()*(canvas.height-pipeGap-100)+50;
      p.top = topH;
      p.bottom = topH+pipeGap;
      score++;
      updateScore();
    }
    // Collision
    if(bird.x < p.x+50 && bird.x+bird.w>p.x && (bird.y< p.top || bird.y+bird.h>p.bottom)) endGame();
  }
  if(bird.y+bird.h > canvas.height || bird.y<0) endGame();

  // Draw
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // Pipes
  ctx.fillStyle="green";
  for(let p of pipes){
    ctx.fillRect(p.x,0,50,p.top);
    ctx.fillRect(p.x,p.bottom,50,canvas.height-p.bottom);
  }
  // Bird
  ctx.fillStyle = birdColor;
  ctx.fillRect(bird.x, bird.y, bird.w, bird.h);
}

function updateScore(){
  document.getElementById("scoreBoard").innerText = score + " | High: " + highScore;
}

function endGame(){
  clearInterval(gameInterval);
  if(score>highScore){
    highScore = score;
    localStorage.setItem("flappyHighScore", highScore);
  }
  document.getElementById("finalScore").innerText = "Score: " + score + " | High: " + highScore;
  document.getElementById("gameOver").style.display="flex";
}

// Apply Settings
document.getElementById("birdColorSelect").addEventListener("change", e=>{ birdColor=e.target.value; });
document.getElementById("difficultySelect").addEventListener("change", e=>{ difficulty=e.target.value; });

</script>
</body>
</html>
