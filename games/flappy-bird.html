<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>
<style>
body{margin:0;background:#70c5ce;font-family:Arial;overflow:hidden;}
canvas{display:block;margin:auto;background:#70c5ce;}
.screen{
  position:fixed;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#000a;color:white;
}
button, select, input{padding:10px;margin:6px;font-size:16px;cursor:pointer;border-radius:6px;}
#gameCanvas{background:#70c5ce;display:block;margin:auto;}
</style>
</head>
<body>

<div id="startScreen" class="screen">
<h1>Flappy Bird</h1>
<label>Bird Color: <input type="color" id="birdColor" value="#ff0"></label><br>
<label>Difficulty: 
<select id="difficulty">
<option value="3">Easy</option>
<option value="5" selected>Normal</option>
<option value="8">Hard</option>
</select>
</label><br>
<button onclick="startGame()">Start</button>
</div>

<div id="gameOverScreen" class="screen" style="display:none;">
<h1>Game Over</h1>
<p id="finalScore"></p>
<button onclick="restartGame()">Restart</button>
</div>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let bird, pipes, score, gameInterval, gravity, jumpHeight, pipeWidth=60, pipeGap;
let running=false;

// Start Screen Settings
let birdColorInput = document.getElementById("birdColor");
let difficultySelect = document.getElementById("difficulty");

function startGame(){
  bird = {x:80,y:300,vy:0,color:birdColorInput.value,r:15};
  gravity = Number(difficultySelect.value);
  jumpHeight = -10;
  pipeGap = 150; // space between pipes
  pipes = [];
  score = 0;
  running = true;
  document.getElementById('startScreen').style.display='none';
  document.getElementById('gameOverScreen').style.display='none';
  gameInterval = setInterval(loop,20);
  spawnPipe();
}

// Restart
function restartGame(){
  startGame();
}

// Loop
function loop(){
  update();
  draw();
}

// Update bird and pipes
function update(){
  bird.vy += gravity*0.2;
  bird.y += bird.vy;

  // Add pipes
  if(pipes.length===0 || pipes[pipes.length-1].x<canvas.width-200){
    spawnPipe();
  }

  // Move pipes
  for(let i=pipes.length-1;i>=0;i--){
    pipes[i].x -= 2;
    if(pipes[i].x+pipeWidth<0){
      pipes.splice(i,1);
      score++;
    }
  }

  // Collision
  for(let p of pipes){
    if(bird.x + bird.r > p.x && bird.x - bird.r < p.x + pipeWidth){
      if(bird.y - bird.r < p.top || bird.y + bird.r > canvas.height - p.bottom){
        endGame();
      }
    }
  }

  // Hit ground or ceiling
  if(bird.y + bird.r > canvas.height || bird.y - bird.r < 0){
    endGame();
  }
}

// Draw everything
function draw(){
  ctx.fillStyle = '#70c5ce';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Pipes
  ctx.fillStyle='green';
  for(let p of pipes){
    ctx.fillRect(p.x,0,pipeWidth,p.top);
    ctx.fillRect(p.x,canvas.height-p.bottom,pipeWidth,p.bottom);
  }

  // Bird
  ctx.fillStyle = bird.color;
  ctx.beginPath();
  ctx.arc(bird.x,bird.y,bird.r,0,Math.PI*2);
  ctx.fill();

  // Score
  ctx.fillStyle='white';
  ctx.font='30px Arial';
  ctx.fillText(score,canvas.width/2,50);
}

// Spawn a pipe
function spawnPipe(){
  let topHeight = Math.random()*(canvas.height - pipeGap - 100)+50;
  let bottomHeight = canvas.height - topHeight - pipeGap;
  pipes.push({x:canvas.width,top:topHeight,bottom:bottomHeight});
}

// Bird jump
document.addEventListener('keydown',e=>{
  if(e.key===' ' || e.key==='ArrowUp' || e.key==='w'){bird.vy=jumpHeight;}
});
canvas.addEventListener('mousedown',()=>{bird.vy=jumpHeight;});
canvas.addEventListener('touchstart',()=>{bird.vy=jumpHeight;});

// End game
function endGame(){
  running=false;
  clearInterval(gameInterval);
  document.getElementById('finalScore').innerText='Score: '+score;
  document.getElementById('gameOverScreen').style.display='flex';
}
</script>
</body>
</html>
