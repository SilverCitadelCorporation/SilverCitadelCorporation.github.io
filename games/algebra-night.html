<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Algebra Night (Mini FNAF)</title>
<style>
body { margin:0; font-family: Arial; background: black; color: white; text-align:center; }
#gameArea { position: relative; width: 400px; height: 600px; margin: 50px auto; background: #111; border: 3px solid #555; overflow: hidden; }
.animatronic { position: absolute; width: 60px; height: 60px; background: red; top: 0; left: 0; border-radius: 10px; }
button { padding:10px 20px; margin:5px; font-size:16px; cursor:pointer; }
#gameOver { display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); color:white; font-size:32px; display:flex; justify-content:center; align-items:center; flex-direction:column; }
</style>
</head>
<body>

<h1>Algebra Night</h1>
<div id="gameArea">
  <div id="anim1" class="animatronic"></div>
  <div id="anim2" class="animatronic"></div>
  <div id="gameOver">
    <div id="gameOverText">GAME OVER</div>
    <button onclick="startGame()">Restart</button>
  </div>
</div>

<div>
  <button id="doorBtn">Close Door</button>
  <button id="lightBtn">Turn On Light</button>
</div>
<div id="score">Time Survived: 0s</div>

<script>
let anim1 = document.getElementById('anim1');
let anim2 = document.getElementById('anim2');
let gameOverDiv = document.getElementById('gameOver');
let scoreDiv = document.getElementById('score');
let doorBtn = document.getElementById('doorBtn');
let lightBtn = document.getElementById('lightBtn');

let gameInterval;
let animSpeed1, animSpeed2;
let doorClosed = false;
let lightOn = false;
let score = 0;
let gameRunning = false;

function startGame() {
  anim1.style.top = '0px';
  anim1.style.left = Math.random()*340+'px';
  anim2.style.top = '0px';
  anim2.style.left = Math.random()*340+'px';
  animSpeed1 = 1 + Math.random()*1.5;
  animSpeed2 = 1 + Math.random()*1.5;
  doorClosed = false;
  lightOn = false;
  score = 0;
  gameOverDiv.style.display = 'none';
  gameRunning = true;

  if(gameInterval) clearInterval(gameInterval);
  gameInterval = setInterval(gameLoop, 20);
}

doorBtn.onclick = ()=>{ doorClosed = !doorClosed; doorBtn.innerText = doorClosed ? "Door Closed" : "Close Door"; }
lightBtn.onclick = ()=>{ lightOn = !lightOn; lightBtn.innerText = lightOn ? "Light On" : "Turn On Light"; }

function gameLoop(){
  if(!gameRunning) return;

  // Move animatronics
  anim1.style.top = parseFloat(anim1.style.top) + animSpeed1 + 'px';
  anim2.style.top = parseFloat(anim2.style.top) + animSpeed2 + 'px';

  // If light is on, slow them
  if(lightOn){
    animSpeed1 = Math.max(animSpeed1-0.05,0.5);
    animSpeed2 = Math.max(animSpeed2-0.05,0.5);
  }

  // If door is closed, stop them
  if(doorClosed){
    animSpeed1 = 0;
    animSpeed2 = 0;
  } else {
    animSpeed1 = 1 + Math.random()*1.5;
    animSpeed2 = 1 + Math.random()*1.5;
  }

  // Check collision with bottom
  if(parseFloat(anim1.style.top) > 540 || parseFloat(anim2.style.top) > 540){
    endGame();
  }

  // Update score
  score += 0.02;
  scoreDiv.innerText = 'Time Survived: '+Math.floor(score)+'s';
}

function endGame(){
  gameRunning = false;
  clearInterval(gameInterval);
  gameOverDiv.style.display = 'flex';
}

// Start immediately
startGame();
</script>

</body>
</html>
