<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pac-Man Lite</title>

<style>
body{
margin:0;
background:black;
color:white;
text-align:center;
font-family:sans-serif;
}

canvas{
background:#111;
display:block;
margin:auto;
}

.controls{
margin-top:10px;
}

button{
font-size:20px;
padding:10px;
margin:5px;
}
</style>
</head>

<body>

<h2>Pac-Man Lite</h2>
<p>WASD / Arrows / Space / Mouse / Touch</p>

<canvas id="game" width="400" height="400"></canvas>

<div class="controls">
<button onclick="move('up')">⬆️</button><br>
<button onclick="move('left')">⬅️</button>
<button onclick="move('down')">⬇️</button>
<button onclick="move('right')">➡️</button>
</div>

<script>

const canvas = document.getElementById("game")
const ctx = canvas.getContext("2d")

let pac = {x:200,y:200,size:20,dx:0,dy:0}
let food = []

let paused = false

for(let i=0;i<20;i++){
food.push({
x:Math.random()*380,
y:Math.random()*380
})
}

function draw(){

ctx.clearRect(0,0,400,400)

ctx.fillStyle="yellow"
ctx.beginPath()
ctx.arc(pac.x,pac.y,pac.size,0,Math.PI*2)
ctx.fill()

ctx.fillStyle="white"

food.forEach((f,i)=>{
ctx.beginPath()
ctx.arc(f.x,f.y,5,0,Math.PI*2)
ctx.fill()

if(Math.hypot(pac.x-f.x,pac.y-f.y)<20){
food.splice(i,1)
}
})

if(!paused){
pac.x+=pac.dx
pac.y+=pac.dy
}

if(pac.x<0)pac.x=400
if(pac.x>400)pac.x=0
if(pac.y<0)pac.y=400
if(pac.y>400)pac.y=0

requestAnimationFrame(draw)

}

draw()

function move(dir){

if(dir==="up"){pac.dx=0;pac.dy=-3}
if(dir==="down"){pac.dx=0;pac.dy=3}
if(dir==="left"){pac.dx=-3;pac.dy=0}
if(dir==="right"){pac.dx=3;pac.dy=0}

}

document.addEventListener("keydown",e=>{

if(e.key==="ArrowUp"||e.key==="w")move("up")
if(e.key==="ArrowDown"||e.key==="s")move("down")
if(e.key==="ArrowLeft"||e.key==="a")move("left")
if(e.key==="ArrowRight"||e.key==="d")move("right")

if(e.key===" "){
paused=!paused
}

})

canvas.addEventListener("click",e=>{
pac.x=e.offsetX
pac.y=e.offsetY
})

let touchStartX=0
let touchStartY=0

canvas.addEventListener("touchstart",e=>{
touchStartX=e.touches[0].clientX
touchStartY=e.touches[0].clientY
})

canvas.addEventListener("touchend",e=>{

let dx=e.changedTouches[0].clientX-touchStartX
let dy=e.changedTouches[0].clientY-touchStartY

if(Math.abs(dx)>Math.abs(dy)){
if(dx>0)move("right")
else move("left")
}else{
if(dy>0)move("down")
else move("up")
}

})

</script>

</body>
</html>
