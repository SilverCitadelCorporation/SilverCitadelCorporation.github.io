<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snake Adventure</title>
<style>
body{margin:0;background:#0f172a;color:white;font-family:Arial;text-align:center;}
#startScreen,#gameScreen,#gameOverScreen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;}
canvas{background:#111;}
button{padding:10px 20px;margin:5px;font-size:16px;cursor:pointer;border:none;background:#444;color:white;}
button:hover{background:#666;}
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="startScreen">
    <h1>Snake Adventure</h1>
    <button onclick="startGame()">Play</button>
    <button onclick="openSettings()">Settings</button>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen" style="display:none;">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p>Score: <span id="score">0</span></p>
</div>

<!-- GAME OVER SCREEN -->
<div id="gameOverScreen" style="display:none;">
    <h1>Game Over!</h1>
    <p id="finalScore">Score: 0</p>
    <button onclick="restartGame()">Restart</button>
    <button onclick="exitGame()">Exit</button>
</div>

<script>
// ----------- GAME VARIABLES -----------
let canvas=document.getElementById("gameCanvas")
let ctx=canvas.getContext("2d")
let grid=20, count=0, snake=[{x:8,y:8}], dx=1, dy=0, apple={x:5,y:5}, score=0, gameInterval

// ----------- START / SETTINGS -----------
function startGame(){
    document.getElementById("startScreen").style.display="none"
    document.getElementById("gameScreen").style.display="flex"
    score=0; snake=[{x:8,y:8}]; dx=1; dy=0; placeApple()
    gameInterval=setInterval(gameLoop,100)
}
function openSettings(){alert("Settings: speed, controls can be added here")}

// ----------- GAME LOOP -----------
function gameLoop(){
    count++
    if(count%1!==0) return
    // Move snake
    let head={x:snake[0].x+dx, y:snake[0].y+dy}
    if(head.x<0||head.x>=canvas.width/grid||head.y<0||head.y>=canvas.height/grid||snake.some(s=>s.x===head.x&&s.y===head.y)){
        return gameOver()
    }
    snake.unshift(head)
    // Eat apple
    if(head.x===apple.x && head.y===apple.y){score++; placeApple()}
    else{snake.pop()}
    // Draw
    ctx.fillStyle="#111"; ctx.fillRect(0,0,canvas.width,canvas.height)
    ctx.fillStyle="lime"; snake.forEach(s=>ctx.fillRect(s.x*grid,s.y*grid,grid-2,grid-2))
    ctx.fillStyle="red"; ctx.fillRect(apple.x*grid,apple.y*grid,grid-2,grid-2)
    document.getElementById("score").innerText=score
}

// ----------- APPLE -----------
function placeApple(){apple.x=Math.floor(Math.random()*canvas.width/grid); apple.y=Math.floor(Math.random()*canvas.height/grid)}

// ----------- CONTROLS -----------
document.addEventListener("keydown",e=>{
    if(e.key==="ArrowUp"&&dy===0){dx=0;dy=-1}
    if(e.key==="ArrowDown"&&dy===0){dx=0;dy=1}
    if(e.key==="ArrowLeft"&&dx===0){dx=-1;dy=0}
    if(e.key==="ArrowRight"&&dx===0){dx=1;dy=0}
})

// ----------- GAME OVER -----------
function gameOver(){
    clearInterval(gameInterval)
    document.getElementById("gameScreen").style.display="none"
    document.getElementById("gameOverScreen").style.display="flex"
    document.getElementById("finalScore").innerText="Score: "+score
    // Send score + coins to main hub
    window.parent.postMessage({gameName:"Snake Adventure", score:score, coins:Math.floor(score/2)}, "*")
}

// ----------- RESTART / EXIT -----------
function restartGame(){
    document.getElementById("gameOverScreen").style.display="none"
    startGame()
}
function exitGame(){
    document.getElementById("gameOverScreen").style.display="none"
    window.parent.postMessage({gameName:"Snake Adventure", score:score, coins:Math.floor(score/2)}, "*")
}
</script>

</body>
</html>
