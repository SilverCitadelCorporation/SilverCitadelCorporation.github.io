<!DOCTYPE html>
<html>
<body style="margin:0;overflow:hidden;background:black;">
<canvas id="game"></canvas>
<script>
let canvas=document.getElementById("game");
let ctx=canvas.getContext("2d");
canvas.width=600; canvas.height=400;

let grid=20, snake=[{x:5*grid,y:5*grid}], dx=grid, dy=0, food={x:Math.floor(Math.random()*30)*grid,y:Math.floor(Math.random()*20)*grid}, score=0;

function draw(){
  ctx.fillStyle="black"; ctx.fillRect(0,0,canvas.width,canvas.height);
  
  ctx.fillStyle="red"; ctx.fillRect(food.x,food.y,grid,grid);
  
  ctx.fillStyle="lime"; snake.forEach(s=>ctx.fillRect(s.x,s.y,grid,grid));
  
  let head={x:snake[0].x+dx, y:snake[0].y+dy};
  
  if(head.x<0||head.x>=canvas.width||head.y<0||head.y>=canvas.height||snake.some(s=>s.x===head.x&&s.y===head.y)){
    alert("Game Over! Score: "+score);
    snake=[{x:5*grid,y:5*grid}]; dx=grid; dy=0; score=0; return;
  }
  
  snake.unshift(head);
  
  if(head.x===food.x && head.y===food.y){
    score++;
    food={x:Math.floor(Math.random()*30)*grid,y:Math.floor(Math.random()*20)*grid};
  } else { snake.pop(); }
  
  ctx.fillStyle="white"; ctx.font="16px Arial"; ctx.fillText("Score: "+score,10,20);
}

document.addEventListener("keydown", e=>{
  if(e.key==="ArrowUp" && dy===0){dx=0;dy=-grid;}
  if(e.key==="ArrowDown" && dy===0){dx=0;dy=grid;}
  if(e.key==="ArrowLeft" && dx===0){dx=-grid;dy=0;}
  if(e.key==="ArrowRight" && dx===0){dx=grid;dy=0;}
});

setInterval(draw,100);
</script>
</body>
</html>
