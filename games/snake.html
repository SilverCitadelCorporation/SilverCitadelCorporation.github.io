<!DOCTYPE html>
<html>
<head>
<style>
body{
margin:0;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
color:white;
}

#gameContainer{
border:6px solid white;
position:relative;
}

canvas{
background:black;
display:block;
}

#gameOver{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

button{
padding:10px 20px;
font-size:18px;
margin-top:15px;
cursor:pointer;
}
</style>
</head>

<body>

<div id="gameContainer">

<canvas id="game"></canvas>

<div id="gameOver">
<h1>Game Over</h1>
<p id="finalScore"></p>
<button onclick="restart()">Restart</button>
</div>

</div>

<script>

let canvas=document.getElementById("game")
let ctx=canvas.getContext("2d")

canvas.width=800
canvas.height=500

let grid=20

let snake=[{x:200,y:200}]
let dx=grid
let dy=0

let food=randomFood()

let score=0

function randomFood(){
return{
x:Math.floor(Math.random()*40)*grid,
y:Math.floor(Math.random()*25)*grid
}
}

function draw(){

ctx.fillStyle="black"
ctx.fillRect(0,0,canvas.width,canvas.height)

ctx.fillStyle="red"
ctx.fillRect(food.x,food.y,grid,grid)

ctx.fillStyle="lime"

snake.forEach(s=>{
ctx.fillRect(s.x,s.y,grid,grid)
})

let head={
x:snake[0].x+dx,
y:snake[0].y+dy
}

if(
head.x<0 ||
head.y<0 ||
head.x>=canvas.width ||
head.y>=canvas.height ||
snake.some(s=>s.x===head.x && s.y===head.y)
){
gameOver()
return
}

snake.unshift(head)

if(head.x===food.x && head.y===food.y){
score++
food=randomFood()
}
else{
snake.pop()
}

ctx.fillStyle="white"
ctx.font="20px Arial"
ctx.fillText("Score: "+score,10,25)

}

function gameOver(){
document.getElementById("gameOver").style.display="flex"
document.getElementById("finalScore").innerText="Score: "+score
clearInterval(loop)
}

function restart(){

snake=[{x:200,y:200}]
dx=grid
dy=0
score=0
food=randomFood()

document.getElementById("gameOver").style.display="none"

loop=setInterval(draw,100)

}

document.addEventListener("keydown",e=>{

if(e.key==="ArrowUp" && dy===0){dx=0;dy=-grid}
if(e.key==="ArrowDown" && dy===0){dx=0;dy=grid}
if(e.key==="ArrowLeft" && dx===0){dx=-grid;dy=0}
if(e.key==="ArrowRight" && dx===0){dx=grid;dy=0}

})

let loop=setInterval(draw,100)

</script>

</body>
</html>
