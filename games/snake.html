<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snake Adventure</title>
<style>
body{margin:0;background:#0f172a;color:white;font-family:Arial;text-align:center;}
#startScreen,#gameScreen,#gameOverScreen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;}
canvas{background:#111;}
button, select{padding:10px 20px;margin:5px;font-size:16px;cursor:pointer;border:none;background:#444;color:white;border-radius:5px;}
button:hover, select:hover{background:#666;}
#nextFruitPreview{position:absolute;top:10px;right:10px;font-size:24px;}
#settingsFruitPreview{display:inline-block;margin-left:10px;font-size:24px;width:30px;}
</style>
</head>
<body>

<div id="startScreen">
    <h1>Snake Adventure</h1>
    <button onclick="startGame()">Play</button>
    <button onclick="toggleSettings()">Settings</button>
    <div id="settingsPanel" style="display:none;margin-top:10px;">
        <label>Fruit:</label>
        <select id="fruitSelect" onchange="updateSettingsPreview()">
            <option value="apple">Apple</option>
            <option value="orange">Orange</option>
            <option value="banana">Banana</option>
            <option value="cherry">Cherry</option>
            <option value="grape">Grape</option>
            <option value="watermelon">Watermelon</option>
            <option value="random">Random</option>
        </select>
        <span id="settingsFruitPreview">🍎</span>
        <br>
        <label>Grid Size:
            <select id="gridSelect">
                <option value="20" selected>20</option>
                <option value="15">15</option>
                <option value="25">25</option>
            </select>
        </label>
        <label>Game Mode:
            <select id="modeSelect">
                <option value="classic" selected>Classic</option>
                <option value="wallsOff">Walls Off</option>
            </select>
        </label>
    </div>
</div>

<div id="gameScreen" style="display:none;">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p>Score: <span id="score">0</span></p>
    <div id="nextFruitPreview">🍎</div>
</div>

<div id="gameOverScreen" style="display:none;">
    <h1>Game Over!</h1>
    <p id="finalScore">Score: 0</p>
    <button onclick="restartGame()">Restart</button>
    <button onclick="exitGame()">Exit</button>
</div>

<script>
let canvas=document.getElementById("gameCanvas")
let ctx=canvas.getContext("2d")
let snake=[], dx=1, dy=0, apple={x:5,y:5}, score=0, gameInterval
let grid=20, mode="classic", fruitType="🍎", randomFruit=false, nextFruit="🍎"

const fruits = ["🍎","🍊","🍌","🍒","🍇","🍉"]
const fruitMap = {apple:"🍎", orange:"🍊", banana:"🍌", cherry:"🍒", grape:"🍇", watermelon:"🍉"}

// Show/hide settings panel
function toggleSettings(){
    let panel=document.getElementById("settingsPanel")
    panel.style.display=(panel.style.display==="none")?"block":"none"
    updateSettingsPreview()
}

// Update the fruit preview in settings
function updateSettingsPreview(){
    let val=document.getElementById("fruitSelect").value
    document.getElementById("settingsFruitPreview").innerText = val==="random" ? "🎲" : fruitMap[val]
}

// Apply settings before game starts
function applySettings(){
    let val=document.getElementById("fruitSelect").value
    randomFruit = (val==="random")
    fruitType = randomFruit ? fruits[Math.floor(Math.random()*fruits.length)] : fruitMap[val]
    grid = Number(document.getElementById("gridSelect").value)
    mode = document.getElementById("modeSelect").value
    updateNextFruitDisplay()
}

// Start game
function startGame(){
    applySettings()
    document.getElementById("startScreen").style.display="none"
    document.getElementById("gameScreen").style.display="flex"
    score=0; snake=[{x:8,y:8}]; dx=1; dy=0
    placeApple()
    clearInterval(gameInterval)
    gameInterval=setInterval(gameLoop,100)
}

// Game loop
function gameLoop(){
    let head={x:snake[0].x+dx,y:snake[0].y+dy}
    if(mode==="classic"){
        if(head.x<0||head.x>=canvas.width/grid||head.y<0||head.y>=canvas.height/grid||snake.some(s=>s.x===head.x&&s.y===head.y)){
            return gameOver()
        }
    } else {
        head.x=(head.x+canvas.width/grid)%(canvas.width/grid)
        head.y=(head.y+canvas.height/grid)%(canvas.height/grid)
        if(snake.some(s=>s.x===head.x&&s.y===head.y)) return gameOver()
    }
    snake.unshift(head)
    if(head.x===apple.x && head.y===apple.y){score++; placeApple()}
    else{snake.pop()}

    ctx.fillStyle="#111"; ctx.fillRect(0,0,canvas.width,canvas.height)
    ctx.fillStyle="lime"; snake.forEach(s=>ctx.fillRect(s.x*grid,s.y*grid,grid-2,grid-2))
    ctx.font = grid + "px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle"
    ctx.fillText(fruitType, apple.x*grid + grid/2, apple.y*grid + grid/2)
    document.getElementById("score").innerText=score
}

// Place apple and next fruit
function placeApple(){
    apple.x=Math.floor(Math.random()*canvas.width/grid)
    apple.y=Math.floor(Math.random()*canvas.height/grid)
    if(randomFruit){fruitType = fruits[Math.floor(Math.random()*fruits.length)]}
    nextFruit = fruits[Math.floor(Math.random()*fruits.length)]
    updateNextFruitDisplay()
}

// Update in-game preview
function updateNextFruitDisplay(){
    document.getElementById("nextFruitPreview").innerText = nextFruit
}

// Controls
document.addEventListener("keydown",e=>{
    if(e.key==="ArrowUp"&&dy===0){dx=0;dy=-1}
    if(e.key==="ArrowDown"&&dy===0){dx=0;dy=1}
    if(e.key==="ArrowLeft"&&dx===0){dx=-1;dy=0}
    if(e.key==="ArrowRight"&&dx===0){dx=1;dy=0}
})

// Game over
function gameOver(){
    clearInterval(gameInterval)
    document.getElementById("gameScreen").style.display="none"
    document.getElementById("gameOverScreen").style.display="flex"
    document.getElementById("finalScore").innerText="Score: "+score
}

// Restart / exit
function restartGame(){document.getElementById("gameOverScreen").style.display="none"; startGame()}
function exitGame(){document.getElementById("gameOverScreen").style.display="none"}
</script>
</body>
</html>
