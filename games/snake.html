<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>

<style>
body{margin:0;background:black}
canvas{display:block;margin:auto;background:#111}
</style>

</head>

<body>

<canvas id="game" width="400" height="400"></canvas>

<script>

const canvas=document.getElementById("game")
const ctx=canvas.getContext("2d")

const grid=20

let snake=[{x:10,y:10}]
let dx=1
let dy=0

let food={
x:15,
y:15
}

let score=0

document.addEventListener("keydown",e=>{

if(e.key==="ArrowUp"||e.key==="w"){dx=0;dy=-1}
if(e.key==="ArrowDown"||e.key==="s"){dx=0;dy=1}
if(e.key==="ArrowLeft"||e.key==="a"){dx=-1;dy=0}
if(e.key==="ArrowRight"||e.key==="d"){dx=1;dy=0}

})

function spawnFood(){

food={
x:Math.floor(Math.random()*20),
y:Math.floor(Math.random()*20)
}

}

function update(){

let head={
x:snake[0].x+dx,
y:snake[0].y+dy
}

if(head.x<0||head.y<0||head.x>19||head.y>19){
location.reload()
}

for(let s of snake){
if(s.x===head.x && s.y===head.y){
location.reload()
}
}

snake.unshift(head)

if(head.x===food.x && head.y===food.y){
score++
spawnFood()
}else{
snake.pop()
}

}

function draw(){

ctx.fillStyle="black"
ctx.fillRect(0,0,400,400)

ctx.fillStyle="lime"

snake.forEach(s=>{
ctx.fillRect(s.x*grid,s.y*grid,grid-2,grid-2)
})

ctx.fillStyle="red"
ctx.fillRect(food.x*grid,food.y*grid,grid-2,grid-2)

ctx.fillStyle="white"
ctx.font="20px Arial"
ctx.fillText("Score "+score,10,25)

}

function loop(){

update()
draw()
setTimeout(loop,120)

}

loop()

</script>

</body>
</html>
