<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snake Adventure</title>
<style>
body{margin:0;background:#0f172a;color:white;font-family:Arial;text-align:center;}
#startScreen,#gameScreen,#gameOverScreen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;}
canvas{background:#111;}
button, select{padding:10px 20px;margin:5px;font-size:16px;cursor:pointer;border:none;background:#444;color:white;border-radius:5px;}
button:hover, select:hover{background:#666;}
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="startScreen">
    <h1>Snake Adventure</h1>
    <button onclick="startGame()">Play</button>
    <button onclick="toggleSettings()">Settings</button>
    <div id="settingsPanel" style="display:none;margin-top:10px;">
        <label>Fruit:
            <select id="fruitSelect">
                <option value="apple">🍎 Apple</option>
                <option value="orange">🍊 Orange</option>
                <option value="banana">🍌 Banana</option>
            </select>
        </label>
        <label>Grid Size:
            <select id="gridSelect">
                <option value="20" selected>20</option>
                <option value="15">15</option>
                <option value="25">25</option>
            </select>
        </label>
        <label>Game Mode:
            <select id="modeSelect">
                <option value="classic" selected>Classic</option>
                <option value="wallsOff">Walls Off</option>
            </select>
        </label>
    </div>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen" style="display:none;">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p>Score: <span id="score">0</span></p>
</div>

<!-- GAME OVER SCREEN -->
<div id="gameOverScreen" style="display:none;">
    <h1>Game Over!</h1>
    <p id="finalScore">Score: 0</p>
    <button onclick="restartGame()">Restart</button>
    <button onclick="exitGame()">Exit</button>
</div>

<script>
let canvas=document.getElementById("gameCanvas")
let ctx=canvas.getContext("2d")
let snake=[{x:8,y:8}], dx=1, dy=0, apple={x:5,y:5}, score=0, gameInterval
let fruitType="apple", grid=20, mode="classic"
const fruitMap = {apple:"red", orange:"orange", banana:"yellow"}

// -------- SETTINGS ----------
function toggleSettings(){
    let panel=document.getElementById("settingsPanel")
    panel.style.display=(panel.style.display==="none")?"block":"none"
}
function applySettings(){
    fruitType=document.getElementById("fruitSelect").value
    grid=Number(document.getElementById("gridSelect").value)
    mode=document.getElementById("modeSelect").value
}

// ----------- GAME LOGIC -----------
function startGame(){
    applySettings()
    document.getElementById("startScreen").style.display="none"
    document.getElementById("gameScreen").style.display="flex"
    score=0; snake=[{x:8,y:8}]; dx=1; dy=0; placeApple()
    clearInterval(gameInterval)
    gameInterval=setInterval(gameLoop,100) // fixed speed
}

function gameLoop(){
    let head={x:snake[0].x+dx,y:snake[0].y+dy}

    // Collision
    if(mode==="classic"){
        if(head.x<0||head.x>=canvas.width/grid||head.y<0||head.y>=canvas.height/grid||snake.some(s=>s.x===head.x&&s.y===head.y)){
            return gameOver()
        }
    } else if(mode==="wallsOff"){
        head.x=(head.x+canvas.width/grid)%(canvas.width/grid)
        head.y=(head.y+canvas.height/grid)%(canvas.height/grid)
        if(snake.some(s=>s.x===head.x&&s.y===head.y)) return gameOver()
    }

    snake.unshift(head)

    // Eat apple (fruit)
    if(head.x===apple.x && head.y===apple.y){score++; placeApple()}
    else{snake.pop()}

    // Draw
    ctx.fillStyle="#111"; ctx.fillRect(0,0,canvas.width,canvas.height)
    ctx.fillStyle="lime"; snake.forEach(s=>ctx.fillRect(s.x*grid,s.y*grid,grid-2,grid-2))
    ctx.fillStyle=fruitMap[fruitType]||"red"
    ctx.fillRect(apple.x*grid,apple.y*grid,grid-2,grid-2)
    document.getElementById("score").innerText=score
}

// ----------- APPLE -----------
function placeApple(){
    apple.x=Math.floor(Math.random()*canvas.width/grid)
    apple.y=Math.floor(Math.random()*canvas.height/grid)
}

// ----------- CONTROLS -----------
document.addEventListener("keydown",e=>{
    if(e.key==="ArrowUp"&&dy===0){dx=0;dy=-1}
    if(e.key==="ArrowDown"&&dy===0){dx=0;dy=1}
    if(e.key==="ArrowLeft"&&dx===0){dx=-1;dy=0}
    if(e.key==="ArrowRight"&&dx===0){dx=1;dy=0}
})

// ----------- GAME OVER -----------
function gameOver(){
    clearInterval(gameInterval)
    document.getElementById("gameScreen").style.display="none"
    document.getElementById("gameOverScreen").style.display="flex"
    document.getElementById("finalScore").innerText="Score: "+score
    window.parent.postMessage({gameName:"Snake Adventure", score:score, coins:Math.floor(score/2)}, "*")
}

// ----------- RESTART / EXIT -----------
function restartGame(){
    document.getElementById("gameOverScreen").style.display="none"
    startGame()
}
function exitGame(){
    document.getElementById("gameOverScreen").style.display="none"
    window.parent.postMessage({gameName:"Snake Adventure", score:score, coins:Math.floor(score/2)}, "*")
}
</script>

</body>
</html>
