<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snake Adventure</title>
<style>
body{margin:0;background:#0f172a;color:white;font-family:Arial;text-align:center;}
canvas{display:block;margin:auto;background:#111;}
button{padding:10px 20px;margin:5px;font-size:16px;cursor:pointer;border:none;background:#444;color:white;border-radius:5px;}
button:hover{background:#666;}
</style>
</head>
<body>

<div id="startScreen">
  <h1>Snake Adventure</h1>
  <button id="playBtn">Play</button>
</div>

<div id="gameScreen" style="display:none;">
  <canvas id="canvas" width="600" height="400"></canvas>
  <p>Score: <span id="score">0</span></p>
</div>

<div id="gameOverScreen" style="display:none;">
  <h1>Game Over!</h1>
  <p id="finalScore">Score: 0</p>
  <button id="restartBtn">Restart</button>
  <button id="exitBtn">Exit</button>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let snake, food, score, interval;
const box=20;

function startGame(){
  snake=[{x:10*box,y:10*box}];
  food={x:Math.floor(Math.random()*30)*box,y:Math.floor(Math.random()*20)*box};
  score=0;
  document.getElementById("startScreen").style.display="none";
  document.getElementById("gameOverScreen").style.display="none";
  document.getElementById("gameScreen").style.display="block";
  clearInterval(interval);
  interval=setInterval(gameLoop,100);
}

document.getElementById("playBtn").onclick=startGame;

let dir='RIGHT';
document.addEventListener("keydown",e=>{
  if(e.key==='ArrowUp' && dir!=='DOWN') dir='UP';
  if(e.key==='ArrowDown' && dir!=='UP') dir='DOWN';
  if(e.key==='ArrowLeft' && dir!=='RIGHT') dir='LEFT';
  if(e.key==='ArrowRight' && dir!=='LEFT') dir='RIGHT';
});

function gameLoop(){
  ctx.fillStyle="#111"; ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let s of snake){ctx.fillStyle="lime"; ctx.fillRect(s.x,s.y,box,box);}
  ctx.fillStyle="red"; ctx.fillRect(food.x,food.y,box,box);

  let head={x:snake[0].x,y:snake[0].y};
  if(dir==='LEFT') head.x-=box;
  if(dir==='RIGHT') head.x+=box;
  if(dir==='UP') head.y-=box;
  if(dir==='DOWN') head.y+=box;

  if(head.x===food.x && head.y===food.y){score++; food={x:Math.floor(Math.random()*30)*box,y:Math.floor(Math.random()*20)*box};}
  else snake.pop();

  if(head.x<0||head.x>=canvas.width||head.y<0||head.y>=canvas.height||snake.some(s=>s.x===head.x&&s.y===head.y)){
    return gameOver();
  }

  snake.unshift(head);
  document.getElementById("score").innerText=score;
}

function gameOver(){
  clearInterval(interval);
  document.getElementById("gameScreen").style.display="none";
  document.getElementById("gameOverScreen").style.display="flex";
  document.getElementById("finalScore").innerText="Score: "+score;

  // Update overall stats
  let stats = JSON.parse(localStorage.getItem("overallStats")) || {
    totalPoints:0,snake:0,miniDash:0,reaction:0,eagleCraft:0,geometry:0,plays:0
  };
  stats.snake = Math.max(stats.snake || 0, score);
  stats.totalPoints += score;
  stats.plays += 1;
  localStorage.setItem("overallStats",JSON.stringify(stats));
}

document.getElementById("restartBtn").onclick=startGame;
document.getElementById("exitBtn").onclick = ()=>{window.location.href="../supercalculator.html";}
</script>
</body>
</html>
