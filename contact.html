<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Silver Citadel Corporation</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="css/style.css">

<style>
body { margin:0; font-family:'Garamond', serif; background:url('banner.jpg') no-repeat center center fixed; background-size:cover; color:#d4af37; }
nav { position: fixed; top:0; left:0; width:100%; background:rgba(30,41,59,0.95); border-bottom:2px solid #d4af37; display:flex; align-items:center; justify-content:space-between; padding:5px 30px; z-index:100; }
nav .logo { display:flex; align-items:center; }
nav .logo img{width:60px;margin-right:10px;} nav .logo span{font-size:1.5rem;font-weight:bold;}
nav .links a{margin-left:20px;color:#d4af37;font-weight:bold;text-decoration:none;padding:8px 15px;border-radius:6px;transition:all 0.3s;}
nav .links a:hover{background:rgba(212,175,55,0.5);color:#fff;box-shadow:0 0 10px #d4af37;}
.overlay{background:rgba(0,0,0,0.75);min-height:100vh;padding:120px 30px 30px 30px;box-sizing:border-box;text-align:center;}
.main-card{max-width:700px;margin:0 auto;background:rgba(30,41,59,0.95);padding:30px;border-radius:12px;border:2px solid rgba(212,175,55,0.6);box-shadow:0 8px 30px rgba(0,0,0,0.8);}
.main-card h2{font-size:2.5rem;margin-bottom:20px;text-shadow:1px 1px 3px #000;}
.main-card p{font-size:1.2rem;line-height:1.6;margin-bottom:20px;}
form { display:flex; flex-direction:column; gap:12px; margin-top:20px;}
input, textarea { padding:10px; border-radius:5px; border:none; font-family:'Garamond', serif; }
textarea { height:100px; }
.button { background-color:#4a235a;color:#d4af37;border:2px solid #d4af37;padding:12px;font-weight:bold;cursor:pointer;border-radius:8px;text-transform:uppercase;transition:all 0.3s;}
.button:hover { background-color:#d4af37;color:#4a235a; box-shadow:0 0 15px #d4af37; }
footer{ text-align:center;margin-top:50px;padding:20px;font-size:14px;color:#888;border-top:1px solid rgba(212,175,55,0.3); }

@media screen and (max-width:600px){ nav{flex-direction:column;gap:10px;} nav .links a{margin:5px;padding:6px 12px;} }
</style>
</head>
<body>

<nav>
    <div class="logo">
        <img src="logo.png" alt="Logo">
        <span>Silver Citadel</span>
    </div>
    <div class="links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html">Contact</a>
        <a href="tos.html">Terms of Service</a>
    </div>
</nav>

<div class="overlay">
    <section class="main-card">
        <h2>Contact the Citadel</h2>
        <p>Have a request for a bot or a digital creation? Reach out below.</p>

        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Request..." required></textarea>
            <button type="submit" class="button">Send Message</button>
        </form>
    </section>
</div>

<footer>
    &copy; 2026 Silver Citadel Corporation. All rights reserved.
</footer>

</body>
</html>
