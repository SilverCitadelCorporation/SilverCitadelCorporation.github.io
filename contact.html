<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body {
            background-color: #2c3e50;
            color: #d4af37;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .form-container {
            max-width: 600px;
            margin: auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        label {
            display: block;
            margin-bottom: 8px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: none;
            border-radius: 5px;
        }
        textarea {
            height: 100px;
        }
        button {
            background-color: #4a235a;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        .social-links {
            text-align: center;
            margin-top: 20px;
        }
        .social-links a {
            margin: 0 10px;
            color: #d4af37;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Contact Us</h1>
    <div class="form-container">
        <h2>Contact Information</h2>
        <p>Email: <a href="mailto:silvercitadelcorporation@gmail.com">silvercitadelcorporation@gmail.com</a></p>
        <p>Phone: <a href="tel:5673171797">567-317-1797</a></p>
        <p>Discord: <a href="https://discord.gg/silvercitadel">Join us on Discord</a></p>
        <h2>Send us a Message</h2>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>
            
            <button type="submit">Send</button>
        </form>
    </div>
    <div class="social-links">
        <h3>Follow Us</h3>
        <a href="https://twitter.com/yourprofile">Twitter</a>
        <a href="https://facebook.com/yourprofile">Facebook</a>
        <a href="https://instagram.com/yourprofile">Instagram</a>
    </div>
</body>
</html>
