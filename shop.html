<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silver Citadel Corporation</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Cinzel', serif;
    color: #d4af37;
    background: url("background.png") no-repeat center center fixed;
    background-size: cover;
}

/* TOP HEADER */
header {
    background: rgba(15, 15, 15, 0.95);
    padding: 15px 0;
    position: sticky;
    top: 0;
    z-index: 1000;
    border-bottom: 2px solid #d4af37;
}

nav {
    text-align: center;
}

nav a {
    color: #d4af37;
    text-decoration: none;
    margin: 0 20px;
    font-weight: bold;
    transition: 0.3s;
}

nav a:hover {
    color: white;
}

/* SALE BANNER */
.announcement {
    background: #14532d;
    text-align: center;
    padding: 12px;
    font-size: 18px;
    color: white;
    font-weight: bold;
    letter-spacing: 1px;
}

/* MAIN CONTAINER */
.container {
    text-align: center;
    padding: 80px 20px;
    background: rgba(0, 0, 0, 0.65);
    min-height: 100vh;
}

/* LOGO */
.logo {
    width: 130px;
    margin-bottom: 20px;
}

/* TITLE */
h1 {
    font-size: 42px;
    margin-bottom: 15px;
}

/* REWARD SECTION */
.reward-box {
    margin: 40px auto;
    padding: 25px;
    max-width: 700px;
    background: rgba(20, 83, 45, 0.85);
    border: 2px solid #d4af37;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
    animation: glow 2s infinite alternate;
}

.reward-box h2 {
    font-size: 30px;
    color: #ffffff;
    margin-bottom: 10px;
}

.reward-box p {
    font-size: 18px;
    color: #f5f5f5;
}

@keyframes glow {
    from {
        box-shadow: 0 0 15px rgba(212,175,55,0.4);
    }
    to {
        box-shadow: 0 0 35px rgba(212,175,55,0.9);
    }
}

/* BUTTON */
.button {
    display: inline-block;
    margin-top: 30px;
    padding: 12px 30px;
    background: #d4af37;
    color: black;
    text-decoration: none;
    font-weight: bold;
    border-radius: 8px;
    transition: 0.3s;
}

.button:hover {
    background: white;
}
</style>
</head>

<body>

<!-- 25% TOP BANNER ONLY -->
<div class="announcement">
🔥 ROYAL SALE: 25% OFF ALL SERVICES RIGHT NOW 🔥
</div>

<header>
<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="shop.html">Shop</a>
    <a href="tos.html">TOS</a>
    <a href="contact.html">Contact</a>
</nav>
</header>

<div class="container">

    <img src="logo.png" class="logo" alt="Silver Citadel Logo">

    <h1>Welcome to Silver Citadel</h1>

    <!-- BIG EYE CATCHING 5% SECTION -->
    <div class="reward-box">
        <h2>⚔️ LOYAL KNIGHT REWARD ⚔️</h2>
        <p>
            Every purchase earns you <strong>5% OFF your next order</strong>.  
            Serve the kingdom once — return stronger with rewards.
        </p>
    </div>

    <a href="shop.html" class="button">Enter The Armory</a>

</div>

</body>
</html>
