<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Silver Citadel Corporation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    background: url('banner.jpg') no-repeat center center fixed;
    background-size: cover;
}

.overlay {
    background: rgba(0, 0, 0, 0.75);
    min-height: 100vh;
    padding: 40px;
    text-align: center;
}

.logo {
    width: 220px;
    margin-bottom: 20px;
}

.product {
    background: rgba(30, 41, 59, 0.95);
    padding: 30px;
    border-radius: 12px;
    max-width: 600px;
    margin: 40px auto;
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
}

.knight-img {
    width: 250px;
    margin-bottom: 20px;
}

.price {
    font-size: 22px;
}

.old-price {
    text-decoration: line-through;
    color: gray;
}

button {
    border: none;
    padding: 12px 25px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    margin: 10px;
}

.paypal { background-color: #0070ba; color: white; }
.cashapp { background-color: #00c244; color: white; }
.discord { background-color: #5865F2; color: white; }

button:hover { opacity: 0.85; }
</style>
</head>

<body>

<div class="overlay">

<img src="logo.png" class="logo" alt="Silver Citadel Logo">

<h1>Custom Discord Bot</h1>

<div class="product">

<img src="knight.png" class="knight-img" alt="SCK Knight">

<ul style="list-style:none; padding:0;">
    <li>⚔ Ticket System</li>
    <li>🛡 Moderation Tools</li>
    <li>🔥 Banned Words Filter</li>
    <li>⚡ Custom Commands</li>
</ul>

<p class="price">
    <span class="old-price">$7.99</span>
</p>
<p class="price">$5.99 (Limited Offer)</p>

<a href="https://paypal.me/SilverCitadelCo" target="_blank">
    <button class="paypal">Pay with PayPal</button>
</a>

<a href="https://cash.app/$SilverCitadelCo" target="_blank">
    <button class="cashapp">Pay with Cash App</button>
</a>

<br>

<a href="https://discord.gg/silvercitadel" target="_blank">
    <button class="discord">Join Our Discord</button>
</a>

<p style="margin-top:20px; font-size:14px;">
After payment, join our Discord and open a support ticket with proof of purchase.
</p>

</div>

</div>
</body>
</html>
