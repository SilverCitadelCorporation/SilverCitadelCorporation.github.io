<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop - Silver Citadel Corporation</title>
<link rel="icon" type="image/png" href="logo.png">

<style>
body {
    margin:0;
    font-family:'Garamond', serif;
    background:url('background.png') no-repeat center center fixed;
    background-size:cover;
    color:#d4af37;
}

/* RESPONSIVE NAV - FOR ALL SCREEN SIZES */
nav {
    position: fixed; top:0; left:0; width:100%;
    background: rgba(15, 23, 42, 0.98);
    border-bottom:2px solid #d4af37;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 20px; z-index:100;
    box-sizing: border-box;
    flex-wrap: wrap;
}

nav .logo { display:flex; align-items:center; }
nav .logo img { width:40px; margin-right:10px; }
nav .logo span { font-size:1.2rem; font-weight:bold; white-space: nowrap; }

nav .links { 
    display: flex; 
    align-items: center; 
    gap: 8px;
}

nav .links a {
    color:#d4af37; font-weight:bold;
    text-decoration:none; padding:6px 10px; border-radius:6px; 
    transition:0.3s; font-size: 13px; border: 1px solid transparent;
    white-space: nowrap;
}

nav .links a:hover { border-color: #d4af37; background: rgba(212,175,55,0.1); }
.dc-nav-btn { background: #5865F2 !important; color: white !important; border: none !important; }

/* Mobile Adjustments */
@media (max-width: 600px) {
    nav { justify-content: center; padding: 10px 5px; }
    nav .logo { margin-bottom: 10px; width: 100%; justify-content: center; }
    nav .links { width: 100%; justify-content: center; gap: 4px; }
    nav .links a { padding: 5px 8px; font-size: 11px; }
}

.overlay {
    background: rgba(0,0,0,0.8); min-height:100vh;
    padding:160px 20px 50px 20px; box-sizing:border-box; text-align:center;
}

.shop-wrapper {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 30px; max-width: 1100px; margin: 0 auto;
}

.shop-card {
    background: rgba(30,41,59,0.95); width: 100%; max-width: 350px;
    padding: 25px; border-radius: 12px; border: 2px solid rgba(212,175,55,0.4);
    box-shadow: 0 8px 30px rgba(0,0,0,0.8); transition: 0.3s;
    display: flex; flex-direction: column; position: relative;
}

.shop-card:hover { transform: translateY(-5px); border-color: #d4af37; }

.badge {
    position: absolute; top: -10px; right: -10px; color: #000;
    padding: 5px 12px; font-weight: bold; border-radius: 20px; font-size: 11px;
}
.badge-sck { background: #d4af37; }
.badge-custom { background: #4ade80; }

.shop-card img { width: 100px; margin: 0 auto 15px auto; }
.shop-card h2 { margin-bottom:10px; color:#d4af37; font-size: 22px; }
.desc-text { margin-bottom: 20px; color: #ccc; font-size: 14px; min-height: 40px; }

.price-box { margin-bottom:15px; }
.old-price { text-decoration: line-through; color: #888; font-size: 14px; margin-right: 8px; }
.price { font-size: 24px; color: #4ade80; font-weight: bold; }

.btn-container { display: flex; flex-direction: column; gap: 10px; }
.btn-container button {
    width: 100%; padding: 12px; border: none; border-radius: 6px;
    font-weight: bold; cursor: pointer; text-transform: uppercase;
}
.paypal { background-color: #0070ba; color: white; }
.cashapp { background-color: #00c244; color: white; }

/* --- TOGGLE CHAT WIDGET --- */
.chat-container {
    position: fixed; bottom: 20px; right: 20px; z-index: 1000;
    display: flex; flex-direction: column; align-items: flex-end;
}

#discordWidget {
    display: none; /* Hidden by default */
    margin-bottom: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border-radius: 8px;
}

.chat-toggle-btn {
    background: #5865F2; color: white; border: none; padding: 12px 20px;
    border-radius: 50px; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: 0.3s;
}
.chat-toggle-btn:hover { transform: scale(1.05); background: #4752c4; }

footer { text-align: center; padding: 40px; color: #666; font-size: 12px; }
</style>
</head>
<body>

<nav>
    <div class="logo">
        <img src="logo.png" alt="Logo">
        <span>Silver Citadel</span>
    </div>
    <div class="links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="tos.html">TOS</a>
        <a href="https://discord.gg/silvercitadel" target="_blank" class="dc-nav-btn">Join Discord</a>
    </div>
</nav>

<div class="overlay">
    <h1 style="color:#d4af37; margin-bottom: 40px;">The Armory</h1>

    <div class="shop-wrapper">
        <section class="shop-card">
            <div class="badge badge-sck">25% OFF</div>
            <img src="bot.png" alt="SCK Bot">
            <h2>SCK Bot</h2>
            <p class="desc-text">Advanced moderation and ticket systems for your community.</p>
            <div class="price-box">
                <span class="old-price">$7.99</span>
                <span class="price" data-price="5.99">$5.99 / mo</span>
            </div>
            <div class="btn-container">
                <a href="https://paypal.me/SilverCitadelCo" target="_blank" class="buy-link"><button class="paypal">PayPal</button></a>
                <a href="https://cash.app/$SilverCitadelCo" target="_blank" class="buy-link"><button class="cashapp">Cash App</button></a>
            </div>
        </section>

        <section class="shop-card">
            <div class="badge badge-custom">30% OFF</div>
            <img src="bot-elite.png" alt="Custom Bot">
            <h2>Custom Bot</h2>
            <p class="desc-text">A unique instance built specifically for your server's needs.</p>
            <div class="price-box">
                <span class="old-price">$25.99</span>
                <span class="price" data-price="18.19">$18.19 / mo</span>
            </div>
            <div class="btn-container">
                <a href="https://paypal.me/SilverCitadelCo" target="_blank" class="buy-link"><button class="paypal">PayPal</button></a>
                <a href="https://cash.app/$SilverCitadelCo" target="_blank" class="buy-link"><button class="cashapp">Cash App</button></a>
            </div>
        </section>
    </div>
</div>

<div class="chat-container">
    <div id="discordWidget">
        <iframe src="https://discord.com/widget?id=1127710303715594253&theme=dark" width="350" height="500" allowtransparency="true" frameborder="0" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"></iframe>
    </div>
    <button class="chat-toggle-btn" onclick="toggleDiscord()">💬 Live Support</button>
</div>

<footer>&copy; 2026 Silver Citadel Corporation</footer>

<script>
function toggleDiscord() {
    const widget = document.getElementById('discordWidget');
    widget.style.display = (widget.style.display === 'block') ? 'none' : 'block';
}

// LOYALTY LOGIC
window.addEventListener('DOMContentLoaded', () => {
    const priceElems = document.querySelectorAll('.price');
    const hasDiscount = localStorage.getItem('sc_loyalty_earned');
    if (hasDiscount === 'true') {
        priceElems.forEach(el => {
            const basePrice = parseFloat(el.getAttribute('data-price'));
            el.textContent = `$${(basePrice * 0.95).toFixed(2)} / mo`;
        });
        localStorage.removeItem('sc_loyalty_earned');
    }
});

document.querySelectorAll('.buy-link').forEach(link => {
    link.addEventListener('click', () => localStorage.setItem('sc_loyalty_earned', 'true'));
});
</script>

</body>
</html>
