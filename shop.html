<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot Product Listing</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .product { border: 1px solid #ccc; border-radius: 8px; padding: 20px; margin: 20px 0; }
        .price { color: red; }
        .discounted { text-decoration: line-through; }
    </style>
</head>
<body>
    <h1>Discord Bot Product Listing</h1>
    <div class="product">
        <h2>Discord Bot</h2>
        <h3>Features:</h3>
        <ul>
            <li>Tickets</li>
            <li>Moderation</li>
            <li>Banned Words</li>
            <li>Commands</li>
        </ul>
        <p class="price">Original Price: <span class="discounted">$7.99</span></p>
        <p class="price">Discounted Price: $5.99</p>
        <button onclick="alert('Thank you for your purchase!')">Purchase</button>
    </div>
</body>
</html>
