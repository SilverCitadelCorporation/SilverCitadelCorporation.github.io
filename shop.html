<!DOCTYPE html>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    background: url('banner.jpg') no-repeat center center fixed;
    background-size: cover;
}

.overlay {
    background: rgba(0, 0, 0, 0.75);
    min-height: 100vh;
    padding: 40px 20px; /* Added side padding for mobile */
    text-align: center;
}

.logo {
    width: 220px;
    margin-bottom: 20px;
}

.product {
    background: rgba(30, 41, 59, 0.95);
    padding: 30px;
    border-radius: 12px;
    max-width: 600px;
    margin: 40px auto;
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
    border: 1px solid rgba(212, 175, 55, 0.3); /* Subtle gold border */
}

.knight-img {
    width: 250px;
    margin-bottom: 20px;
    transition: transform 0.3s ease; /* Smooth hover effect */
}

.knight-img:hover {
    transform: scale(1.05); /* Slight zoom when hovering */
}

/* New Trust Banner Style */
.trust-bar {
    background: rgba(255, 255, 255, 0.05);
    padding: 10px;
    border-radius: 8px;
    margin: 20px 0;
    font-size: 14px;
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

.price {
    font-size: 26px; /* Slightly larger */
    font-weight: bold;
    color: #d4af37;
}

.old-price {
    text-decoration: line-through;
    color: #888;
    font-size: 18px;
}

button {
    border: none;
    padding: 14px 25px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    margin: 10px;
    width: 100%; /* Full width on mobile */
    max-width: 240px; /* Limit on desktop */
    font-weight: bold;
    transition: opacity 0.2s, transform 0.1s;
}

button:active { transform: scale(0.98); }

.paypal { background-color: #0070ba; color: white; }
.cashapp { background-color: #00c244; color: white; }
.discord { background-color: #5865F2; color: white; margin-top: 20px; }

button:hover { opacity: 0.85; }

ul li {
    font-size: 18px;
    margin: 12px 0;
}
</style>
</head>
